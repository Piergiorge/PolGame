<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locus Astra — genética de criaturas alienígenas</title>
<style>
  :root {
    --bg:#070b18; --panel:#101731; --panel2:#16204a; --line:#25305c; --text:#e8ecff; --muted:#93a0c8;
    --accent:#7ee0ff; --gold:#ffd54f; --good:#9ccc65; --bad:#ff7a7a; --pink:#f48fb1;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height:100vh; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(1px 1px at 10% 20%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 30% 70%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 55% 30%, #fffa 50%, transparent 51%), radial-gradient(1px 1px at 75% 85%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 15%, #fff8 50%, transparent 51%), radial-gradient(1.5px 1.5px at 42% 92%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 65% 55%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 20% 45%, #fff6 50%, transparent 51%),
      radial-gradient(900px 500px at 85% -10%, #2a1b5c55, transparent 70%), radial-gradient(700px 500px at -10% 110%, #0f4a6a44, transparent 70%);
    background-size: 300px 300px, 260px 260px, 340px 340px, 280px 280px, 320px 320px, 360px 360px, 240px 240px, 310px 310px, 100% 100%, 100% 100%; }
  button { font:inherit; cursor:pointer; }
  .wrap { max-width:1100px; margin:0 auto; padding:14px 14px 40px; }
  header.top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; margin-bottom:12px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { margin:0; font-size:22px; letter-spacing:.04em; }
  .brand h1 span { color:var(--accent); }
  .brand small { color:var(--muted); display:block; font-size:12px; margin-top:-2px; }
  .res { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:13px; white-space:nowrap; }
  .pill b { color:var(--gold); }
  .pill.r b { color:var(--accent); }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; font-size:12px; }
  .ghost:hover { color:var(--text); border-color:#3a4a85; }
  nav.tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  nav.tabs button { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:8px 13px; font-weight:600; }
  nav.tabs button.on { background:var(--panel2); color:var(--text); border-color:var(--accent); }
  nav.tabs button .n { background:var(--accent); color:#071; color:#04121a; border-radius:999px; padding:0 6px; font-size:11px; margin-left:4px; }

  .sub { color:var(--muted); margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; position:relative; }
  .card.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }

  .artbox { display:flex; justify-content:center; background:radial-gradient(circle at 50% 60%, #1d2a5c, #0c1230 70%); border-radius:12px; padding:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { background:#1d2750; border-radius:6px; padding:1px 7px; font-size:12px; }
  .chip.rare { background:#3b2f0a; color:var(--gold); }
  .geno { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; display:grid; grid-template-columns:auto 1fr; gap:1px 10px; background:#0b1230; border-radius:8px; padding:6px 8px; }

  .btn:hover:not(:disabled) { border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.primary { background:var(--accent); color:#04121a; border-color:var(--accent); }
  .btn.gold { background:var(--gold); color:#2a1d00; border-color:var(--gold); }
  .btn.danger { color:var(--bad); }
  .badge { position:absolute; top:10px; right:10px; font-size:11px; background:#26345f; border-radius:6px; padding:1px 6px; color:var(--accent); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }

  .mini { flex:0 0 auto; width:96px; background:#0e1533; border:1px solid var(--line); border-radius:10px; padding:4px; text-align:center; font-size:12px; color:var(--text); }

  .planet { display:flex; gap:12px; align-items:center; }
  .planet .orb { width:58px; height:58px; border-radius:50%; flex:0 0 58px; box-shadow:inset -10px -8px 18px #0008; }
  .req { display:flex; align-items:center; gap:6px; font-size:13px; }
  .req::before { content:"◆"; color:var(--accent); font-size:10px; }
  .eligible { display:flex; flex-wrap:wrap; gap:6px; }
  .toast-box { position:fixed; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(380px, 92vw); }
  .toast { background:#18245a; border:1px solid var(--accent); border-radius:10px; padding:9px 12px; font-size:13px; box-shadow:0 6px 20px #0008; animation:tin .25s ease; }
  .toast.gold { border-color:var(--gold); }
  @keyframes tin { from { transform:translateY(10px); opacity:0; } }
  .modal-bg { position:fixed; inset:0; background:#02040bcc; display:flex; align-items:center; justify-content:center; padding:16px; z-index:40; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; width:min(720px, 100%); max-height:90vh; overflow:auto; }
  .modal h3 { margin:0 0 8px; font-size:20px; color:var(--accent); }
  .modal p { margin:6px 0; }
  .eggs { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:10px 0; }
  .egg { background:#0d1434; border:1px solid var(--line); border-radius:12px; padding:8px; text-align:center; font-size:12.5px; }
  .egg.dead { opacity:.7; border-style:dashed; }
  .battle { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; }
  @media (max-width:640px) { .battle { grid-template-columns:1fr; } .battle .vs { display:none; } }
  .fighter { background:#0d1434; border:1px solid var(--line); border-radius:14px; padding:10px; text-align:center; }
  .hpbar { height:12px; background:#1b2550; border-radius:6px; overflow:hidden; margin:6px 0 2px; }
  .hpbar i { display:block; height:100%; background:linear-gradient(90deg, #66bb6a, #9ccc65); transition:width .3s; }
  .hpbar i.low { background:linear-gradient(90deg, #ef5350, #ff8a65); }
  .vs { font-size:28px; font-weight:800; color:var(--muted); }
  .blog { text-align:left; background:#0b1230; border-radius:10px; padding:8px 10px; height:150px; overflow:auto; font-size:13px; margin-top:10px; }
  .blog p { margin:2px 0; }
  .status { font-size:11.5px; color:var(--accent); min-height:16px; }
  .dex { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .dexi { background:#0d1434; border:1px solid var(--line); border-radius:10px; padding:8px; font-size:13px; }
  .dexi.off { color:#4b5784; }
  .dexi b { display:block; }
  .guide h4 { margin:14px 0 4px; color:var(--accent); }
  .guide p { margin:4px 0; }
  .muted { color:var(--muted); }
  .mono { font-family:ui-monospace, Menlo, Consolas, monospace; }
  .glowtxt { color:#ccff90; text-shadow:0 0 6px #b2ff59; }
  .kbd { background:#1d2750; border-radius:4px; padding:0 5px; }
  .backlink { color:var(--muted); text-decoration:none; font-size:13px; display:inline-block; margin-bottom:6px; }
  .backlink:hover { color:var(--text); }
  .backlink[hidden] { display:none; }
  .soundbtn { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; font-size:12px; }
  .soundbtn:hover { color:var(--text); border-color:#3a4a85; }
  .mbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; background:#1a1f45; border:1px solid #3a3f7a; border-left:4px solid var(--gold); border-radius:10px; padding:7px 12px; margin-bottom:12px; font-size:13px; }
  .mcur h3 { margin:2px 0 8px; color:var(--gold); font-size:19px; }
  .goal { background:#0d1434; border-color:var(--gold); margin-top:10px; }
  .mlist { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:6px; }
  .mitem { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-size:13px; }
  .mitem.now { border-color:var(--gold); }
  .mitem.off { color:#4b5784; }
  .mitem .ghost { margin-left:6px; padding:1px 7px; }
  .egg.gone { opacity:.45; }
  .locked { opacity:.6; }
  .actcard { text-align:left; color:var(--text); font:inherit; cursor:pointer; }
  .actcard:hover { border-color:var(--accent); }
  .census-num { font-size:34px; font-weight:800; color:var(--gold); }
  .census-num span { font-size:15px; font-weight:400; color:var(--text); }
  .btn.elem { border-color:#6a4fb3; }
  .tip { position:fixed; z-index:60; width:240px; background:#121a40; border:1px solid var(--accent); border-radius:10px; padding:8px; box-shadow:0 8px 24px #000a; pointer-events:none; display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .tip[hidden] { display:none; }
  .parent { text-align:center; width:200px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .parent .chips { justify-content:center; }
  .parent .geno { width:100%; text-align:left; }
  .modal.wide { width:min(1100px, 100%); }
  .pedwrap { overflow:auto; background:#0b1230; border-radius:12px; padding:6px; max-height:62vh; }
  svg.ped { display:block; }
  svg.ped .pl { stroke:#c9d3ff; stroke-width:1.6; fill:none; }
  svg.ped .sym { stroke:#c9d3ff; stroke-width:1.8; }
  svg.ped .pn { cursor:pointer; }
  svg.ped .pn:hover .sym { stroke:var(--accent); stroke-width:3; }
  svg.ped .pn.gone .sym { stroke-dasharray:4 3; opacity:.75; }
  svg.ped .slash { stroke:#ff7a7a; stroke-width:1.6; }
  svg.ped .arrow { stroke:var(--gold); stroke-width:2.2; }
  svg.ped text { text-anchor:middle; fill:var(--text); font-size:11px; }
  svg.ped .lbl { fill:var(--muted); font-size:10px; }
  svg.ped .gt { font-family:ui-monospace, Menlo, Consolas, monospace; fill:var(--accent); }
  svg.ped .gt.q { fill:#ffb74d; }
  svg.ped .gen { text-anchor:start; fill:var(--muted); font-weight:700; font-size:13px; }
  svg.ped .star { fill:var(--pink); text-anchor:start; }
  svg.ped .up { fill:var(--gold); font-size:9.5px; }
  .pedleg { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .pedleg span { display:inline-flex; align-items:center; gap:4px; }
  .btn.ok, .btn.ok:disabled { background:#2e5d2a; border-color:var(--good); color:#e8ffe0; opacity:1; }
  .btn.bad, .btn.bad:disabled { background:#5d2a2a; border-color:var(--bad); color:#ffe0e0; opacity:1; }
  .btn.dim:disabled { opacity:.3; }
  table.ratio th, table.moves th { text-align:left; white-space:nowrap; }
  table.ratio td, table.moves td { text-align:left; }
  details summary { outline:none; }
</style>

<body>
<div class="wrap">
  <a class="backlink" id="backlink" href="../" hidden>← Todos os jogos</a>
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="#7ee0ff" stroke-width="1.5" opacity=".5"/>
        <ellipse cx="20" cy="20" rx="19" ry="6" fill="none" stroke="#ffd54f" stroke-width="1.5" transform="rotate(-25 20 20)"/>
        <circle cx="20" cy="20" r="7" fill="#7ee0ff"/>
        <circle cx="33" cy="12" r="2.4" fill="#ffd54f"/>
      </svg>
      <div><h1>LOCUS <span>ASTRA</span></h1><small>estação de genética xenobiológica</small></div>
      <button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button>
    </div>
    <div class="res" id="res"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="toast-box" id="toasts"></div>
<div id="modalRoot"></div>

<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    try { muted = localStorage.getItem('locusastra-mudo') === '1'; } catch (e) {}
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = ac.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(musicBus); osc.start(time); osc.stop(time + dur + 0.03);
    }
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.15) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);
    }
    function toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.5;
      try { localStorage.setItem('locusastra-mudo', muted ? '1' : '0'); } catch (e) {}
      updateSoundButton();
      return muted;
    }
    return { ensure, tone, noise, arp, note, music, toggle, get muted() { return muted; } };
  })();
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundButton() { if (soundBtn) { soundBtn.textContent = Sound.muted ? '🔇 Som desligado (M)' : '🔊 Som ligado (M)'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } }
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.ensure(); Sound.toggle(); soundBtn.blur(); });
  updateSoundButton();
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { Sound.ensure(); Sound.toggle(); } });
  // links "todos os jogos" só aparecem no site publicado
  for (const a of document.querySelectorAll('.backlink')) if (!/github\.io$/.test(location.hostname)) a.hidden = true;

  // =====================================================================
  // GENÉTICA
  // =====================================================================
  const LOCI = ['cor', 'padrao', 'olhos', 'cristal', 'albino', 'elem', 'tam', 'lum'];
  const AUTO = ['cor', 'padrao', 'olhos', 'cristal', 'albino', 'elem', 'm', 'n']; // loci autossômicos (m e n = tamanho)
  const ORDER = { cor: 'RBD', padrao: 'Ss', olhos: 'Oo', cristal: 'Kk', albino: 'Cc', elem: 'PGn', m: 'Mm', n: 'Nn', x: 'Ll' };
  const LOCUS_INFO = {
    cor:     { nome: 'Cor', mech: 'Dominância incompleta + alelos múltiplos',
               how: 'R (vermelho) e B (azul) têm dominância incompleta entre si: RB é roxo. O alelo D (dourado), raro, é recessivo aos dois: só DD é dourado.' },
    padrao:  { nome: 'Padrão', mech: 'Dominância completa',
               how: 'S (manchas) é dominante sobre s (liso). SS e Ss têm manchas; só ss é liso.' },
    olhos:   { nome: 'Olhos', mech: 'Dominância completa (recessivo: ciclope)',
               how: 'O (dois olhos) domina o (um olho). Só oo é ciclope. Ciclopes têm mais chance de golpe crítico.' },
    cristal: { nome: 'Cristais', mech: 'Alelo letal em homozigose',
               how: 'Kk tem cristais nas costas; kk não tem. KK é letal: o ovo não eclode. Por isso Kk × Kk dá 2 com cristais para 1 sem (2:1), não 3:1.' },
    albino:  { nome: 'Albinismo', mech: 'Epistasia recessiva',
               how: 'cc impede a produção de pigmento e esconde qualquer genótipo do gene da cor. Um albino pode carregar alelos de cor que você não vê.' },
    elem:    { nome: 'Elemento', mech: 'Alelos múltiplos e codominância',
               how: 'P (plasma) e G (gelo) são codominantes: PG é Tempestade. Ambos dominam n (neutro), como no sistema ABO.' },
    tam:     { nome: 'Tamanho', mech: 'Herança poligênica (2 genes aditivos)',
               how: 'Dois genes, M/m e N/n, somam efeitos: cada alelo maiúsculo aumenta o tamanho. 0 a 4 alelos dão 5 classes, e o meio é o mais comum.' },
    lum:     { nome: 'Bioluminescência', mech: 'Ligada ao X (recessiva)',

  const sortG = (locus, a, b) => ORDER[locus].indexOf(a) <= ORDER[locus].indexOf(b) ? a + b : b + a;

  // dedução tipo "cruzamento-teste": elimina genótipos dos pais incompatíveis com a prole

  function rarity(c) {
    const p = ph(c); let r = 0;
    if (p.cor === 'dourado') r += 15; if (p.albino) r += 10; if (p.olhos === 'ciclope') r += 5; if (p.lum) r += 8;
    if (p.elem === 'Tempestade') r += 6; if (p.size === 4 || p.size === 0) r += 6; if (p.cristal) r += 4;
    return r;
  }
  const sellValue = c => 10 + rarity(c) * 2;

  function phChips(c) {
    const p = ph(c);
    const ch = [];
    if (has('albino') && p.albino) ch.push(`<span class="chip rare">albino</span>`);
    else ch.push(`<span class="chip ${p.cor === 'dourado' ? 'rare' : ''}">${COR_NOME[p.cor]}</span>`);
    ch.push(`<span class="chip">${p.padrao}</span>`);
    if (has('olhos') && p.olhos === 'ciclope') ch.push(`<span class="chip rare">ciclope</span>`);
    if (has('cristal') && p.cristal) ch.push(`<span class="chip">cristais</span>`);
    if (has('elem')) ch.push(`<span class="chip ${p.elem === 'Tempestade' ? 'rare' : ''}">${p.elem}</span>`);
    if (has('tam')) ch.push(`<span class="chip ${p.size === 0 || p.size === 4 ? 'rare' : ''}">${SIZE_NOME[p.size]}</span>`);
    if (has('lum') && p.lum) ch.push(`<span class="chip glowtxt">bioluminescente</span>`);
    return `<div class="chips">${ch.join('')}</div>`;
  }
  const GENO_ROWS = [['cor', 'Cor'], ['padrao', 'Padrão'], ['olhos', 'Olhos'], ['cristal', 'Cristais'], ['albino', 'Albino'], ['elem', 'Elemento'], ['tam', 'Tamanho'], ['lum', 'Cromos. X']];
  function genoBlock(c) {
    const row = (l, label) => { const d = gDisplay(c, l); return `<span>${label}</span><span class="${d.includes('?') ? 'q' : ''}">${d}</span>`; };
    return `<div class="geno" title="? = alelo ainda desconhecido">${GENO_ROWS.filter(([l]) => has(l)).map(([l, n]) => row(l, n)).join('')}</div>`;
  }

  function stats(c) {
    const p = ph(c);
    const atkC = { vermelho: 5, roxo: 3, azul: 1, dourado: 4, albino: 2 }[p.cor];
    const defC = { vermelho: 1, roxo: 3, azul: 5, dourado: 4, albino: 0 }[p.cor];
    return {
      hp: 40 + p.size * 12 + (p.elem === 'Neutro' ? 8 : 0),
      atk: 12 + p.size * 2 + atkC,
      def: 8 + p.size + defC + (p.cristal ? 6 : 0),
      spd: Math.round(15 - p.size * 1.5 + (p.padrao === 'liso' ? 4 : 0)),
      eva: p.padrao === 'manchas' ? 0.12 : 0.04,
      crit: p.olhos === 'ciclope' ? 0.25 : 0.08,
    };
  }

  // =====================================================================
  // RENDER GERAL
  // =====================================================================
  const TABS = [['missoes', '🎯 Missões'], ['viveiro', '🧫 Viveiro'], ['cruzar', '🧬 Cruzamento'], ['exped', '🚀 Expedição'], ['contratos', '📜 Contratos'], ['arena', '⚔️ Arena'], ['dex', '📘 Xenodex']];
  function render() {
    const mi = S.mission < MISSIONS.length ? `🎯 missão ${S.mission + 1}/${MISSIONS.length}` : '🏆 campanha completa';
    $('#res').innerHTML = `
      <span class="pill">💰 <b>${S.credits}</b> créditos</span>
      <span class="pill r">🔬 <b>${S.research}</b> pesquisa</span>
      <span class="pill">🧫 ${S.creatures.length}/${cap()}</span>
      <span class="pill">📅 dia ${S.day}</span>
      <span class="pill">${mi}</span>
      <button class="ghost" data-act="guide">Guia de genética</button>
      <button class="ghost" data-act="reset">Novo jogo</button>`;
    if (!S.tabs.includes(S.tab)) S.tab = 'missoes';
    $('#tabs').innerHTML = TABS.filter(([k]) => S.tabs.includes(k)).map(([k, n]) => {
      let badge = '';
      if (k === 'contratos' && eligibleCount()) badge = `<span class="n">${eligibleCount()}</span>`;
      if (k === 'missoes' && S.mission < MISSIONS.length && !S.missionStarted) badge = `<span class="n">!</span>`;
      return `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${n}${badge}</button>`;
    }).join('') + (S.tabs.length < TABS.length ? `<span class="meta" style="align-self:center">🔒 outras áreas abrem com as missões</span>` : '');
    const R = { missoes: rMissoes, viveiro: rViveiro, cruzar: rCruzar, exped: rExped, contratos: rContratos, arena: rArena, dex: rDex }[S.tab];
    $('#main').innerHTML = (S.tab !== 'missoes' ? missionBar() : '') + R();
    save();
  }

  // ---------------- VIVEIRO ----------------
  function card(c, actions = true) {
    const seqBtn = !S.flags.seq
      ? `<button class="btn" disabled title="O sequenciador está em calibração (libera na missão 3)">Sequenciar 🔒</button>`
      : `<button class="btn" data-act="seq" data-id="${c.id}" ${c.seq || S.research < 1 ? 'disabled' : ''} title="Revela o genótipo completo">${c.seq ? 'Sequenciado' : 'Sequenciar (1 🔬)'}</button>`;
    return `<div class="card">
      ${c.seq ? '<span class="badge" title="genoma sequenciado">🧬 sequenciado</span>' : ''}
      <div class="head"><span class="name">${esc(c.name)} ${sexSym(c.sex)}</span></div>
      <div class="meta">${c.gen ? `Geração F${c.gen} · ${esc(c.origin)}` : `${c.gift ? 'Doação' : 'Selvagem'} · ${esc(c.origin)}`}${c.mutant ? ' · <span style="color:var(--pink)">★ mutação</span>' : ''}</div>
      <div class="artbox">${art(c, 120)}</div>
      ${phChips(c)}
      ${genoBlock(c)}
      ${actions ? `<div class="btns">
        ${seqBtn}
        <button class="btn" data-act="tobreed" data-id="${c.id}">Cruzar</button>
        <button class="btn" data-act="ped" data-id="${c.id}" title="Ver a família deste astrídeo">🌳 Heredograma</button>
        <button class="btn danger" data-act="sell" data-id="${c.id}" title="Transferir para outra estação">Transferir (+${sellValue(c)})</button>
      </div>` : ''}
    </div>`;
  }
  function rViveiro() {
    return `<h2>Viveiro</h2>
      <p class="sub">Seus astrídeos. O fenótipo você vê; o genótipo aparece com <span class="q mono" style="color:#ffb74d">?</span> onde o alelo ainda é desconhecido. Para descobrir, <b>deduza</b> pelos filhotes de um cruzamento-teste${S.flags.seq ? ' ou <b>sequencie</b> (custa pesquisa)' : ''}.</p>
      <div class="mbar" style="border-left-color:var(--accent)"><span>🧫 Capacidade: <b>${S.creatures.length}/${cap()}</b> ${cap() >= CAP_MAX ? '· tamanho máximo atingido' : `· cada módulo novo abre +${CAP_STEP} vagas`}</span>
        ${cap() < CAP_MAX ? `<button class="btn gold" data-act="expand" ${S.credits < capCost() ? 'disabled' : ''}>Ampliar viveiro +${CAP_STEP} (${capCost()} 💰)</button>` : ''}</div>
      <div class="grid">${S.creatures.map(c => card(c)).join('') || '<p class="muted">Viveiro vazio.</p>'}</div>`;
  }

  // ---------------- CRUZAMENTO ----------------
  function punnettAuto(l, gm, gd) {
    const a = gm.split(''), b = gd.split('');
    const cells = a.map(x => b.map(y => sortG(l, x, y)));
    const counts = {};
    for (const row of cells) for (const g of row) { const ph_ = l === 'cristal' ? LPH[l](g) : LPH[l](g); counts[ph_] = (counts[ph_] || 0) + 1; }
    let alive = 4;
    if (l === 'cristal' && counts.letal) alive -= counts.letal;
    const table = `<table class="pq"><tr><th>♀ \\ ♂</th>${b.map(y => `<th>${y}</th>`).join('')}</tr>${a.map((x, i) => `<tr><th>${x}</th>${cells[i].map(g => `<td style="${LPH[l](g) === 'letal' ? 'color:#ff7a7a;text-decoration:line-through' : ''}">${g}</td>`).join('')}</tr>`).join('')}</table>`;
    const lbl = { com: 'com cristais', sem: 'sem cristais', dois: 'dois olhos', ciclope: 'ciclope', pigmentado: 'pigmentado', albino: 'albino' };
    const probs = Object.entries(counts).filter(([k]) => k !== 'letal').map(([k, n]) => `${lbl[k] || k} <b>${Math.round(n / alive * 100)}%</b>`).join(' · ');
    const extra = counts.letal ? `<div class="warn">${counts.letal}/4 dos ovos são KK e não eclodem.</div>` : '';
    return table + `<div class="prob">${probs}</div>` + extra;
  }
  function punnettX(gm, dx) {
    const a = gm.split(''), cols = [dx, 'Y'];
    const f = x => x === 'L' ? 'Xᴸ' : x === 'l' ? 'Xˡ' : 'Y';
    const cell = (x, y) => y === 'Y' ? f(x) + 'Y' : f(sortG('x', x, y)[0]) + f(sortG('x', x, y)[1]);
    const table = `<table class="pq"><tr><th>♀ \\ ♂</th>${cols.map(y => `<th>${f(y)}</th>`).join('')}</tr>${a.map(x => `<tr><th>${f(x)}</th>${cols.map(y => `<td>${cell(x, y)}</td>`).join('')}</tr>`).join('')}</table>`;
    const fem = a.filter(x => x === 'l' && dx === 'l').length / 2, mac = a.filter(x => x === 'l').length / 2;
    return table + `<div class="prob">Filhas brilhantes <b>${Math.round(fem * 100)}%</b> · Filhos brilhantes <b>${Math.round(mac * 100)}%</b></div>`;
  }
  function sizeDist(gm, gd) {
    const dist = [0, 0, 0, 0, 0];
    for (const a of gm[0] + gm[1]) for (const b of gd[0] + gd[1]) for (const c2 of gm[2] + gm[3]) for (const d of gd[2] + gd[3]) {
      const s = [a, b, c2, d].filter(x => x === 'M' || x === 'N').length; dist[s]++;
    }
    // gm = "MmNn" -> gene m alelos 0..1, gene n alelos 2..3
    return `<div class="prob">${dist.map((n, i) => n ? `${SIZE_NOME[i]} <b>${Math.round(n / 16 * 100)}%</b>` : '').filter(Boolean).join(' · ')}</div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:46px;margin-top:6px">${dist.map((n, i) => `<div title="${SIZE_NOME[i]}" style="flex:1;background:#7ee0ff;opacity:.8;border-radius:3px 3px 0 0;height:${Math.max(2, n / 16 * 100 * 0.45)}px"></div>`).join('')}</div>
      <div class="meta" style="display:flex;justify-content:space-between"><span>0</span><span>alelos maiúsculos</span><span>4</span></div>`;
  }

  function rCruzar() {
    const fem = S.creatures.filter(c => c.sex === 'F'), mac = S.creatures.filter(c => c.sex === 'M');
    const f = byId(S.breed.f), m = byId(S.breed.m);
    const pickRow = (list, slot) => `<div class="picker">${list.map(c => `<button class="mini ${S.breed[slot] === c.id ? 'sel' : ''}" data-act="pick" data-slot="${slot}" data-id="${c.id}" data-tip="${c.id}">${art(c, 70)}<div class="nm">${esc(c.name)}</div></button>`).join('') || '<span class="muted">Nenhum disponível.</span>'}</div>`;
    let loci = '';
    if (f && m) {
      const box = (l, inner) => `<div class="locus"><h4>${LOCUS_INFO[l].nome}</h4><div class="mech">${LOCUS_INFO[l].mech}</div>${inner}</div>`;
      const unknown = (l) => `<div class="warn">Genótipo incompleto (♀ ${gDisplay(f, l)} × ♂ ${gDisplay(m, l)}). ${S.flags.seq ? 'Sequencie ou deduza' : 'Deduza'} pelos filhotes de um cruzamento-teste.</div>`;
      for (const l of ['cor', 'padrao', 'olhos', 'cristal', 'albino', 'elem'].filter(has)) {
        const cf = cands(f, l), cm = cands(m, l);
        let inner = cf.length === 1 && cm.length === 1 ? punnettAuto(l, cf[0], cm[0]) : unknown(l);
        if (l === 'cor' && has('albino')) inner += `<div class="meta">Vale só para filhotes não albinos (o albinismo é epistático).</div>`;
        loci += box(l, inner);
      }
      if (has('tam')) {
        const tf = cands(f, 'tam'), tm = cands(m, 'tam');
        loci += box('tam', tf && tm ? sizeDist(tf[0], tm[0]) : `<div class="warn">Tamanho poligênico: os genótipos de M/m e N/n só aparecem com sequenciamento (exceto minúsculo e colossal).</div>`);
      }
      if (has('lum')) {
        const lf = cands(f, 'lum');
        loci += box('lum', lf.length === 1 ? punnettX(lf[0], m.g.x) : `<div class="warn">A fêmea pode ser XᴸXᴸ ou XᴸXˡ (portadora). Observe os filhos machos: metade brilha se ela for portadora.</div>`);
      }
    }
    const free = cap() - S.creatures.length;
    return `<h2>Laboratório de cruzamento</h2>
      <p class="sub">Escolha uma fêmea e um macho. Para cada gene com genótipo conhecido aparece o quadro de Punnett com a probabilidade de cada fenótipo. Um cruzamento custa <b>15 créditos</b> e gera de 2 a 4 ovos. A <b>ninhada tripla</b> (3 cruzamentos de uma vez) mostra as proporções observadas ao lado das esperadas.</p>
      <div class="two">
        <div class="panel"><b>♀ Fêmea</b>${pickRow(fem, 'f')}</div>
        <div class="panel"><b>♂ Macho</b>${pickRow(mac, 'm')}</div>
      </div>
      ${f && m ? `<div class="panel" style="margin-top:12px">
        <div class="row" style="align-items:center;justify-content:center">
          <div class="parent">${art(f, 110)}<div>${esc(f.name)} ${sexSym('F')} <button class="ghost" data-act="ped" data-id="${f.id}" title="Heredograma">🌳</button></div>${phChips(f)}${genoBlock(f)}</div>
          <div style="font-size:26px;color:var(--muted)">×</div>
          <div class="parent">${art(m, 110)}<div>${esc(m.name)} ${sexSym('M')} <button class="ghost" data-act="ped" data-id="${m.id}" title="Heredograma">🌳</button></div>${phChips(m)}${genoBlock(m)}</div>
        </div>
        <div style="text-align:center;margin-top:8px">
          <button class="btn primary" data-act="breed" data-v="1" ${S.credits < 15 || free < 1 ? 'disabled' : ''}>Cruzar (15 💰)</button>
          <button class="btn" data-act="breed" data-v="3" ${S.credits < 45 || free < 1 ? 'disabled' : ''} title="Três cruzamentos seguidos: mais filhotes para comparar com o Punnett">Ninhada tripla ×3 (45 💰)</button>
          ${free < 1 ? '<div class="warn">Viveiro cheio: transfira algum astrídeo ou amplie o viveiro.</div>' : free < 4 ? `<div class="meta">Só há ${free} vaga(s): filhotes extras serão transferidos automaticamente.</div>` : ''}
        </div>
        <div class="loci">${loci}</div>
      </div>` : `<p class="muted" style="margin-top:12px">Selecione os dois pais para ver as previsões.</p>`}`;
  }

  // proporções esperadas de fenótipo (por locus autossômico, pais conhecidos)
  function expected(l, gf, gm) {
    const out = {}; let n = 0;
    for (const a of gf) for (const b of gm) { const p = LPH[l](sortG(l, a, b)); if (p === 'letal') continue; out[p] = (out[p] || 0) + 1; n++; }
    for (const k in out) out[k] /= n;
    return out;
  }
  const PH_LBL = { com: 'com cristais', sem: 'sem cristais', dois: 'dois olhos', ciclope: 'ciclope', pigmentado: 'pigmentado', albino: 'albino' };
  function ratioTable(f, m, kids) {
    const rows = [];
    for (const l of ['cor', 'padrao', 'olhos', 'cristal', 'albino', 'elem'].filter(has)) {
      const pool = l === 'cor' ? kids.filter(k => !ph(k).albino) : kids;
      if (!pool.length) continue;
      const cnt = {};
      for (const k of pool) { const o = obsLocus(k, l); cnt[o] = (cnt[o] || 0) + 1; }
      const cf = cands(f, l), cm = cands(m, l);
      const exp = cf.length === 1 && cm.length === 1 ? expected(l, cf[0], cm[0]) : null;
      const keys = [...new Set([...Object.keys(cnt), ...Object.keys(exp || {})])];
      rows.push(`<tr><th>${LOCUS_INFO[l].nome}</th><td>${keys.map(k => `${PH_LBL[k] || k}: <b>${cnt[k] || 0}</b>/${pool.length}${exp ? ` <span class="muted">(esperado ${Math.round((exp[k] || 0) * 100)}%)</span>` : ''}`).join('<br>')}</td></tr>`);
    }
    if (has('tam')) {
      const cnt = [0, 0, 0, 0, 0]; kids.forEach(k => cnt[ph(k).size]++);
      rows.push(`<tr><th>Tamanho</th><td>${cnt.map((n, i) => n ? `${SIZE_NOME[i]}: <b>${n}</b>` : '').filter(Boolean).join(' · ')}</td></tr>`);
    }
    if (has('lum')) {
      const fs = kids.filter(k => k.sex === 'F'), ms = kids.filter(k => k.sex === 'M');
      rows.push(`<tr><th>Brilho</th><td>fêmeas: <b>${fs.filter(k => ph(k).lum).length}</b>/${fs.length} · machos: <b>${ms.filter(k => ph(k).lum).length}</b>/${ms.length}</td></tr>`);
    }
    return `<table class="pq ratio">${rows.join('')}</table>`;
  }

  function doBreed(times = 1) {
    const f = byId(S.breed.f), m = byId(S.breed.m);
    if (!f || !m || S.credits < 15 * times) return;
    S.credits -= 15 * times; S.day++; S.stats.crosses += times;
    const born = [], dead = [], msgs = [];
    const gen = Math.max(f.gen, m.gen) + 1;
    let nEggs = 0;
    for (let t = 0; t < times; t++) {
      const n = 2 + rand(3); nEggs += n;
      const kids = [], d0 = [];
      for (let i = 0; i < n; i++) {
        const k = cross(f, m);
        if (k.g.cristal === 'KK') { d0.push(k); continue; }
        kids.push(k);
      }
      const b = kids.map(k => ({ id: S.nextId++, name: newName(), sex: k.sex, g: k.g, seq: false, known: {}, gen, origin: `${f.name} × ${m.name}`, mutant: k.mutant || null, parents: [f.id, m.id] }));
      born.push(...b); dead.push(...d0);
    }
    for (const x of deduce(f, m, born)) if (!msgs.includes(x)) msgs.push(x);
    if (dead.length && has('cristal')) discoverKey('cristal:letal');
    let kept = [], auto = 0, autoCr = 0;
    for (const b of born) {
      if (S.creatures.length < cap()) { S.creatures.push(b); kept.push(b); discover(b); }
      else { auto++; autoCr += sellValue(b); archive(b, 'transferido'); }
    }
    S.credits += autoCr; S.stats.bred += born.length;
    sfx.hatch(Math.min(born.length, 6), Math.min(dead.length, 3));
    if (born.some(b => b.mutant)) sfx.mutation();
    if (msgs.length) sfx.deduce();
    const html = `<h3>Ovos eclodiram! 🥚</h3>
      <p>${esc(f.name)} ♀ × ${esc(m.name)} ♂ geraram ${nEggs} ovo(s)${times > 1 ? ` em ${times} ninhadas` : ''}.</p>
      <div class="eggs">
        ${born.map(b => `<div class="egg ${kept.includes(b) ? '' : 'gone'}">${art(b, times > 1 ? 80 : 100)}<div><b>${esc(b.name)}</b> ${sexSym(b.sex)}</div>${phChips(b)}${b.mutant ? `<div style="color:var(--pink)">★ mutação espontânea!</div>` : ''}${kept.includes(b) ? '' : '<div class="meta">transferido (viveiro cheio)</div>'}</div>`).join('')}
        ${dead.map(() => `<div class="egg dead"><div style="font-size:42px">🥚</div><b>Ovo inviável</b><div class="meta">genótipo KK (letal)</div></div>`).join('')}
      </div>
      ${auto ? `<p class="muted">${auto} filhote(s) não couberam no viveiro e foram transferidos (+${autoCr} créditos).</p>` : ''}
      ${times > 1 && born.length ? `<div class="panel" style="margin-top:8px"><b>📊 Proporções observadas</b> <span class="meta">(${born.length} filhotes vivos)</span>${ratioTable(f, m, born)}<div class="meta">Quanto mais filhotes, mais perto do esperado as proporções ficam (lei dos grandes números).</div></div>` : ''}
      ${msgs.length ? `<div class="panel" style="margin-top:8px"><b>🔎 Dedução pelos filhotes (cruzamento-teste):</b><br>${msgs.map(esc).join('<br>')}</div>` : ''}
      ${times === 1 ? '<p class="meta">Dica: compare as proporções com o quadro de Punnett. Com poucos filhotes, o acaso pesa muito!</p>' : ''}
      <button class="btn primary" data-act="close">Continuar</button>`;
    modal(html);
    missionEvent('cross', { f, m, kids: born, dead: dead.length });
    render();
  }

  // =====================================================================
  // MISSÕES (campanha): cada missão apresenta um gene ou uma ideia nova
  // =====================================================================
  function gift(sex, name, genes) {
    const g = { ...baseG(sex), ...genes };
    return mk(sex, lockG(g, sex), { name, origin: 'Doação da Federação', gift: true });
  }
  const kidsWith = (d, fn) => d && d.kids && d.kids.some(fn);
  const MISSIONS = [
    { t: 'Primeiro cruzamento', tab: 'cruzar',
      story: `<p>Bem-vinda(o) ao laboratório! Por enquanto vamos estudar só <b>dois genes</b>: a <b>cor</b> e o <b>padrão</b> (manchas ou liso). Os outros genes ainda não variam nas suas linhagens.</p><p>Abra o <b>Cruzamento</b>, escolha uma fêmea e um macho e veja o quadro de Punnett antes de cruzar.</p>`,
      goal: 'Faça um cruzamento qualquer no laboratório.',
      check: ev => ev === 'cross',
      lesson: `<p>Cada filhote recebe <b>um alelo de cada gene de cada pai</b>, escolhido ao acaso (1ª lei de Mendel, segregação). O quadro de Punnett lista todas as combinações de gametas igualmente prováveis.</p>`,
      reward: { cr: 30 } },
    { t: 'O mistério do roxo', tab: 'cruzar',
      story: `<p>Vega e Órion são <b>roxos</b>. Um técnico jura que roxo × roxo só pode dar roxo. Prove o contrário.</p><p>Dica: olhe o quadro de Punnett da cor. R e B têm <b>dominância incompleta</b>.</p>`,
      goal: 'Cruze dois roxos e obtenha pelo menos um filhote vermelho e um azul (pode somar vários cruzamentos).',

  const LOCK_DEFAULT_KNOWN = { olhos: 'OO', albino: 'CC', cristal: 'kk', elem: 'nn' };
  function unlockGene(l) {
    if (has(l)) return;
    S.genes.push(l);
    for (const c of S.creatures) {
      c.known = c.known || {};
      if (LOCK_DEFAULT_KNOWN[l]) c.known[l] = c.g[l];
      if (l === 'lum' && c.sex === 'F') c.known.lum = c.g.x;
      discover(c, true);
    }
  }
  function startMission() {
    const M = MISSIONS[S.mission]; if (!M || S.missionStarted) return;
    S.missionStarted = true; S.mp = { lyra: S.mp.lyra, neveCor: S.mp.neveCor };
    const st = M.start || {};
    for (const l of st.genes || []) unlockGene(l);
    for (const t of st.tabs || []) if (!S.tabs.includes(t)) S.tabs.push(t);
    const gifts = st.gifts ? st.gifts() : [];
    for (const c of gifts) { if (S.creatures.length >= cap()) { const old = S.creatures.find(x => !x.gift && x.id !== S.mp.lyra); if (old) { S.credits += sellValue(old); removeCreature(old); } } addCreature(c); }
    sfx.unlock();
    modal(`<h3>🎯 Missão ${S.mission + 1}: ${M.t}</h3>${M.story}
      ${gifts.length ? `<div class="eggs">${gifts.map(c => `<div class="egg">${art(c, 90)}<div><b>${esc(c.name)}</b> ${sexSym(c.sex)}</div>${phChips(c)}</div>`).join('')}</div>` : ''}
      <div class="panel goal"><b>Objetivo:</b> ${M.goal}</div>
      <div class="btns" style="margin-top:10px"><button class="btn primary" data-act="close">Vamos lá</button>${M.tab ? `<button class="btn" data-act="tab" data-v="${M.tab}">Ir para ${TABS.find(t => t[0] === M.tab)[1]}</button>` : ''}</div>`);
    missionEvent('start');
  }
  let lessonQueue = null;
  function missionEvent(ev, d) {
    const M = MISSIONS[S.mission];
    if (!M || !S.missionStarted) return;
    if (!M.check(ev, d)) return;
    const r = M.reward || {};
    S.credits += r.cr || 0; S.research += r.rp || 0;
    for (const f of r.flags || []) S.flags[f] = true;
    for (const t of r.tabs || []) if (!S.tabs.includes(t)) S.tabs.push(t);
    for (const p of r.planets || []) S.planets[p] = true;
    if ((r.tabs || []).includes('contratos') && !S.contracts.length) S.contracts = [genContract(), genContract(), genContract()];
    S.done.push(S.mission);
    const idx = S.mission;
    S.mission++; S.missionStarted = false;
    toast(`🎯 Missão concluída: <b>${M.t}</b>`, 'gold'); sfx.win();
    lessonQueue = `<h3>✅ Missão ${idx + 1} concluída: ${M.t}</h3>${M.lesson}
      <p class="meta">Recompensa: ${r.cr ? `<b style="color:var(--gold)">+${r.cr} 💰</b> ` : ''}${r.rp ? `<b style="color:var(--accent)">+${r.rp} 🔬</b>` : ''}</p>
      <div class="btns"><button class="btn primary" data-act="close">Continuar</button>${S.mission < MISSIONS.length ? `<button class="btn" data-act="mstart2">Próxima missão →</button>` : ''}</div>`;
    if (!$('#modalRoot').innerHTML) showLesson();
  }
  function showLesson() { if (!lessonQueue) return false; modal(lessonQueue); lessonQueue = null; return true; }

  function missionBar() {
    const M = MISSIONS[S.mission];
    if (!M) return '';
    if (!S.missionStarted) return `<div class="mbar"><span>🎯 Nova missão disponível: <b>${M.t}</b></span><button class="btn primary" data-act="mstart">Começar</button></div>`;
    return `<div class="mbar"><span>🎯 <b>${M.t}:</b> ${M.goal}${M.prog ? ` <span class="meta">(${M.prog()})</span>` : ''}</span><button class="btn" data-act="tab" data-v="missoes">Detalhes</button></div>`;
  }
  function rMissoes() {
    const M = MISSIONS[S.mission];
    let cur;
    if (!M) cur = `<div class="panel" style="border-color:var(--gold)"><b style="color:var(--gold)">🏆 Campanha completa!</b><p>Todos os genes foram estudados. Continue com contratos, expedições e a Arena, ou complete o Xenodex.</p></div>`;
    else if (!S.missionStarted) cur = `<div class="panel mcur"><div class="meta">Missão ${S.mission + 1} de ${MISSIONS.length}</div><h3>${M.t}</h3><button class="btn primary" data-act="mstart">Começar missão</button></div>`;
    else cur = `<div class="panel mcur"><div class="meta">Missão ${S.mission + 1} de ${MISSIONS.length}</div><h3>${M.t}</h3>${M.story}
      <div class="panel goal"><b>Objetivo:</b> ${M.goal}${M.prog ? `<div class="meta" style="margin-top:4px">Progresso: ${M.prog()}</div>` : ''}</div>
      ${M.quiz ? `<div style="margin-top:10px"><b>${M.quiz.q}</b><div class="btns" style="margin-top:6px">${M.quiz.opts.map(o => `<button class="btn mono" data-act="mans" data-v="${o}">${o}</button>`).join('')}</div></div>` : ''}
      ${M.hint ? `<details style="margin-top:10px"><summary class="meta" style="cursor:pointer">💡 Dica</summary><p>${M.hint}</p></details>` : ''}
      ${M.tab ? `<div class="btns" style="margin-top:10px"><button class="btn" data-act="tab" data-v="${M.tab}">Ir para ${TABS.find(t => t[0] === M.tab)[1]}</button></div>` : ''}</div>`;
    const list = MISSIONS.map((m, i) => {
      const done = S.done.includes(i), now = i === S.mission;
      return `<div class="mitem ${done ? 'done' : now ? 'now' : 'off'}">${done ? '✅' : now ? '🎯' : '🔒'} <b>${i + 1}. ${done || now ? m.t : '???'}</b>${done ? ` <button class="ghost" data-act="lesson" data-v="${i}">rever lição</button>` : ''}</div>`;
    }).join('');
    return `<h2>Missões</h2>
      <p class="sub">A campanha apresenta um gene ou uma ideia de cada vez. Genes ainda não estudados estão <b>fixos</b> em todas as populações (todo mundo é homozigoto), por isso nem aparecem.</p>
      ${cur}
      <h3 style="margin:18px 0 8px">Diário da estação</h3><div class="mlist">${list}</div>`;
  }

    { id: 'aurum', nome: 'Asteroide Aurum', desc: 'Rochas douradas e cristalinas. Único lugar com o alelo D (dourado).', trip: 40, col: 'radial-gradient(circle at 35% 35%, #fff59d, #a0700a)', acts: ['capturar', 'comercio'], when: 12,
      fr: { cor: { R: .3, B: .3, D: .4 }, padrao: .6, olhos: .3, cristal: .4, albino: .1, elem: { P: .35, G: .35, n: .3 }, m: .7, n: .7, lum: .2 } },
  ];
  const ACTS = { capturar: ['🛸 Capturar', 'Três selvagens avistados: traga um para a estação.'], censo: ['📊 Censo', 'Conte a população e estime quantos portadores existem (Hardy-Weinberg).'],
                 comercio: ['🏪 Entreposto', 'Compre astrídeos com genoma já sequenciado.'], arquivos: ['💾 Arquivos', 'Sequencie 2 astrídeos seus de graça.'] };
  function wild(pl) {
    const fr = pl.fr;
    const draw = obj => { let r = Math.random(); for (const [k, v] of Object.entries(obj)) { r -= v; if (r <= 0) return k; } return Object.keys(obj)[0]; };
    const bi = (p, dom, rec) => Math.random() < p ? rec : dom; // p = frequência do alelo indicado
    const g = {};
    g.cor = sortG('cor', draw(fr.cor), draw(fr.cor));
    g.padrao = sortG('padrao', bi(fr.padrao, 's', 'S'), bi(fr.padrao, 's', 'S'));
    g.olhos = sortG('olhos', bi(fr.olhos, 'O', 'o'), bi(fr.olhos, 'O', 'o'));
    g.cristal = Math.random() < fr.cristal * 2 ? 'Kk' : 'kk';
    g.albino = sortG('albino', bi(fr.albino, 'C', 'c'), bi(fr.albino, 'C', 'c'));
    g.elem = sortG('elem', draw(fr.elem), draw(fr.elem));
    g.m = sortG('m', bi(fr.m, 'm', 'M'), bi(fr.m, 'm', 'M'));
    g.n = sortG('n', bi(fr.n, 'n', 'N'), bi(fr.n, 'n', 'N'));
    const sex = Math.random() < 0.5 ? 'F' : 'M';
    g.x = sex === 'M' ? bi(fr.lum, 'L', 'l') : sortG('x', bi(fr.lum, 'L', 'l'), bi(fr.lum, 'L', 'l'));
    return { id: -1 - rand(1e6), name: newName(), sex, g: lockG(g, sex), seq: false, known: {}, gen: 0, origin: pl.nome };
  }

  // Censo: amostra de 200 indivíduos, conta os recessivos homozigotos e pergunta q e 2pq
  const CENSUS_TRAIT = { padrao: ['liso', 's', c => ph(c).padrao === 'liso'], olhos: ['ciclope', 'o', c => ph(c).olhos === 'ciclope'], albino: ['albino', 'c', c => ph(c).albino] };
  function makeCensus(pl) {
    const loci = Object.keys(CENSUS_TRAIT).filter(has);
    let l, rec, N = 200, tries = 0;
    do { l = pick(loci); rec = 0; for (let i = 0; i < N; i++) if (CENSUS_TRAIT[l][2](wild(pl))) rec++; } while ((rec < 2 || rec > N - 2) && tries++ < 10);
    const f = rec / N, q = Math.sqrt(f), p = 1 - q;
    const r2 = x => x.toFixed(2);
    // alternativas erradas precisam ficar longe da certa (arredondamentos diferentes não podem virar "erro")
    const opts = (good, bad) => {
      const gap = good.includes('.') ? .04 : 8, max = good.includes('.') ? 1 : N, set = [good];
      for (const b of bad) if (+b > 0 && +b < max && set.every(x => Math.abs(+x - +b) >= gap)) set.push(b);
      return shuffle(set.slice(0, 4));
    };
    const q1 = opts(r2(q), [r2(f), r2(p), r2(q / 2), r2(q + .2), r2(q - .15), r2(q + .1), r2(q - .3)]);
    const het = Math.round(2 * +r2(p) * +r2(q) * N); // mesmos valores arredondados que o aluno usa
    const q2 = opts(String(het), [Math.round(q * N), rec, Math.round(p * q * N), Math.round(p * p * N), het + 30, het - 25, het + 15, het - 40].map(String));
    return { l, N, rec, q: r2(q), het: String(het), q1, q2, a1: null, a2: null, done: false };
  }
  function rCensus(pl) {
    const C = S.exp.census, T = CENSUS_TRAIT[C.l];
    const right = { a1: C.q, a2: C.het };
    const cls = (k, v) => !C.done ? (C[k] === v ? 'primary' : '') : v === right[k] ? 'ok' : C[k] === v ? 'bad' : 'dim';
    const opt = (k, list) => list.map(v => `<button class="btn mono ${cls(k, v)}" data-act="cans" data-k="${k}" data-v="${v}" ${C.done ? 'disabled' : ''}>${v}${C.done && v === right[k] ? ' ✔' : C.done && C[k] === v ? ' ✘' : ''}</button>`).join('');
    const verdict = k => C.done ? (C[k] === right[k] ? ' <b style="color:var(--good)">✔ certo</b>' : ` <b style="color:var(--bad)">✘ você marcou ${C[k]}</b>`) : '';
    const p = (1 - +C.q).toFixed(2);
    return `<h2>📊 Censo em ${pl.nome}</h2>
      <p class="sub">Seus drones contaram uma amostra de <b>${C.N}</b> astrídeos. Suponha a população em equilíbrio de Hardy-Weinberg.</p>
      <div class="panel"><div class="census-num">${C.rec} <span>de ${C.N} são <b>${T[0]}</b> (${T[1]}${T[1]})</span></div>
        <p class="meta">Fração de recessivos homozigotos: ${C.rec}/${C.N} = ${(C.rec / C.N).toFixed(3)}</p>
        <p><b>1.</b> Qual é a frequência estimada do alelo <span class="mono">${T[1]}</span> (q)?${verdict('a1')}</p><div class="btns">${opt('a1', C.q1)}</div>
        <p style="margin-top:12px"><b>2.</b> Quantos dos ${C.N} devem ser <b>portadores</b> (heterozigotos)?${verdict('a2')}</p><div class="btns">${opt('a2', C.q2)}</div>
        ${C.done ? `<div class="panel" style="margin-top:12px"><p>q² = ${(C.rec / C.N).toFixed(3)} → q = √${(C.rec / C.N).toFixed(3)} = <b>${C.q}</b>; p = 1 − q = <b>${p}</b></p>
          <p>Portadores = 2pq × ${C.N} = 2 × ${p} × ${C.q} × ${C.N} ≈ <b>${C.het}</b>. Repare: há ${C.het} portadores escondidos para ${C.rec} ${T[0]}s visíveis!</p>
          <p>${C.ok ? '<b style="color:var(--good)">Acertou as duas! +25 💰 +1 🔬</b>' : C.half ? '<b style="color:var(--gold)">Acertou uma. +10 💰</b>' : '<b style="color:var(--bad)">Nenhum acerto desta vez.</b>'}</p></div>

        : `<div class="btns" style="margin-top:12px"><button class="btn primary" data-act="csub" ${C.a1 && C.a2 ? '' : 'disabled'}>Conferir</button></div>`}
      </div>`;
  }
  function rShop(pl) {

          <div class="btns"><button class="btn primary" data-act="trip" data-v="${pl.id}" ${S.credits < pl.trip ? 'disabled' : ''}>Partir (${pl.trip} 💰)</button></div>` : ''}</div>`;
      }).join('')}</div>`;
  }


  // ---------------- CONTRATOS ----------------
  const CLIENTS = [
    ['Museu de Titã', 'quer um exemplar para a nova exposição.'], ['Colônia Vesta', 'busca astrídeos para o programa de reprodução.'],

  function reqLabel(r) {
    if (r.t === 'sex') return r.v === 'F' ? 'fêmea ♀' : 'macho ♂';

    if (r.l === 'padrao') return p.padrao === r.v;

    if (r.l === 'cristal') return p.cristal === r.v;

  function genContract() {
    const tier = Math.min(4, 1 + Math.floor(S.contractsDone / 2));

    const reqs = [], used = new Set();
    let tries = 0;

    while (reqs.length < nTraits && tries++ < 50) {
      const r = pick(pool)();

      const start = cursor, groups = [];
      for (const p of partners) { const xs = p.kids.map(k => { place(k, row + 1); return pos.get(k).x; }); groups.push({ ...p, xs }); }
      const c0 = (Math.min(...groups[0].xs) + Math.max(...groups[0].xs)) / 2;
      const px = Math.max(start, c0 - 0.5);
      pos.set(id, { x: px, row });
      let right = px;
      for (const gq of groups) {
        const inFam = desc.has(gq.q) || pos.has(gq.q);
        if (!inFam && R.get(gq.q)) { const cx = (Math.min(...gq.xs) + Math.max(...gq.xs)) / 2; const sx = Math.max(right + 1, cx + 0.5); pos.set(gq.q, { x: sx, row, spouse: true }); right = sx; }
        unions.push({ a: id, b: gq.q, kids: gq.kids });
      }
      cursor = Math.max(cursor, Math.ceil(right + 1));
    }
    place(root.id, 0);
    // casais em que o parceiro "da família" ficou fora (fora do recorte): garante posição
    for (const u of unions) if (!pos.has(u.b) && R.get(u.b)) pos.set(u.b, { x: cursor++, row: pos.get(u.a).row, spouse: true });

    const T = PED_TRAITS[trait] && has(PED_TRAITS[trait].loc) ? trait : (has('padrao') ? 'padrao' : 'cor');
    const tr = PED_TRAITS[T];
    const SW = 78, RH = 128, PADX = 46, PADY = 30, S2 = 15;
    const X = x => PADX + x * SW + SW / 2, Y = r => PADY + r * RH + S2;
    const maxX = Math.max(...[...pos.values()].map(p => p.x)), maxR = Math.max(...[...pos.values()].map(p => p.row));
    const W = PADX + (maxX + 1) * SW + 20, H = PADY + (maxR + 1) * RH;
    // numeração I-1, I-2...
    const label = new Map();
    for (let r = 0; r <= maxR; r++) [...pos.entries()].filter(([, p]) => p.row === r).sort((a, b) => a[1].x - b[1].x).forEach(([id], i) => label.set(id, `${ROMAN[r] || r + 1}-${i + 1}`));
    const ancOf = id => { const s = new Set(); const go = c => parentsOf(c).forEach(p => { if (!s.has(p.id)) { s.add(p.id); go(p); } }); go(R.get(id)); return s; };
    let lines = '';
    for (const u of unions) {
      const A = pos.get(u.a), B = pos.get(u.b); if (!A || !B) continue;
      const y = Y(A.row), x1 = Math.min(X(A.x), X(B.x)) + S2, x2 = Math.max(X(A.x), X(B.x)) - S2;
      const sa = ancOf(u.a), consang = [...ancOf(u.b)].some(id => sa.has(id));
      lines += consang ? `<path d="M${x1} ${y - 3}H${x2}M${x1} ${y + 3}H${x2}" class="pl"/>` : `<path d="M${x1} ${y}H${x2}" class="pl"/>`;
      const kx = u.kids.map(k => pos.get(k)).filter(Boolean).map(p => X(p.x)); if (!kx.length) continue;
      const mx = (X(A.x) + X(B.x)) / 2, sy = Y(A.row) + RH / 2 + 8, ky = Y(A.row + 1) - S2;
      lines += `<path d="M${mx} ${y}V${sy}M${Math.min(mx, ...kx)} ${sy}H${Math.max(mx, ...kx)}${kx.map(x => `M${x} ${sy}V${ky}`).join('')}" class="pl"/>`;
    }
    let nodes = '';
    for (const [id, p] of pos) {
      const c = R.get(id); if (!c) continue;
      const x = X(p.x), y = Y(p.row);
      const aff = tr.aff && tr.aff(c), car = !aff && tr.car && tr.car(c);
      const fill = tr.fill ? tr.fill(c) : aff ? '#7ee0ff' : '#0b1230';
      const shape = c.sex === 'M' ? `<rect x="${x - S2}" y="${y - S2}" width="${S2 * 2}" height="${S2 * 2}"` : `<circle cx="${x}" cy="${y}" r="${S2}"`;
      const geno = gDisplay(c, tr.loc);
      nodes += `<g class="pn ${c.gone ? 'gone' : ''}" data-act="ped" data-id="${id}" data-tr="${T}" data-tip="${id}">
        ${shape} fill="${fill}" class="sym"/>${car ? `<circle cx="${x}" cy="${y}" r="4.5" fill="#7ee0ff"/>` : ''}
        ${c.gone ? `<path d="M${x - S2 - 5} ${y + S2 + 5}L${x + S2 + 5} ${y - S2 - 5}" class="slash"/>` : ''}
        ${id === focal.id ? `<path d="M${x - S2 - 22} ${y + S2 + 14}L${x - S2 - 4} ${y + S2 - 2}" class="arrow"/><path d="M${x - S2 - 4} ${y + S2 - 2}l-8 1l5 6z" fill="var(--gold)"/>` : ''}
        ${c.mutant ? `<text x="${x + S2 + 3}" y="${y - S2 + 4}" class="star">★</text>` : ''}
        ${p.spouse && parentsOf(c).length ? `<text x="${x}" y="${y - S2 - 6}" class="up">▲ pais</text>` : ''}
        <text x="${x}" y="${y + S2 + 15}" class="lbl">${label.get(id)}</text>
        <text x="${x}" y="${y + S2 + 29}" class="nm">${esc(c.name)}</text>
        <text x="${x}" y="${y + S2 + 43}" class="gt ${geno.includes('?') ? 'q' : ''}">${geno}</text></g>`;
    }
    const rows = Array.from({ length: maxR + 1 }, (_, r) => `<text x="8" y="${Y(r) + 5}" class="gen">${ROMAN[r] || r + 1}</text>`).join('');
    const opts = Object.entries(PED_TRAITS).filter(([, t]) => has(t.loc)).map(([k, t]) => `<button class="btn ${k === T ? 'primary' : ''}" data-act="ped" data-id="${focal.id}" data-tr="${k}">${t.n}</button>`).join('');
    const legend = tr.aff ? `<span><svg width="16" height="16"><rect x="1" y="1" width="14" height="14" fill="#7ee0ff" stroke="#c9d3ff"/></svg> afetado</span>
        ${tr.car ? `<span><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="#0b1230" stroke="#c9d3ff"/><circle cx="8" cy="8" r="3" fill="#7ee0ff"/></svg> portador(a) confirmado(a)</span>` : ''}
        <span><svg width="16" height="16"><rect x="1" y="1" width="14" height="14" fill="#0b1230" stroke="#c9d3ff"/></svg> não afetado</span>` : `<span>cor do símbolo = fenótipo</span>`;
    modal(`<h3>🌳 Heredograma de ${esc(focal.name)}</h3>
      <div class="btns" style="margin-bottom:8px">${opts}</div>
      <div class="pedleg">□ macho · ○ fêmea · ${legend} · <span>═ casal consanguíneo</span> · <span>／ fora do viveiro</span> · <span style="color:var(--gold)">↗ indivíduo em foco</span></div>
      <div class="pedwrap"><svg class="ped" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${rows}${lines}${nodes}</svg></div>
      <p class="meta">Embaixo de cada símbolo: posição (geração-número), nome e genótipo conhecido para o traço escolhido (<span style="color:#ffb74d">?</span> = ainda desconhecido). Clique em um indivíduo para centralizar o heredograma nele; quem tem <span style="color:var(--gold)">▲ pais</span> entrou na família por cruzamento e tem ascendência própria. ${pos.size === 1 ? '<b>Este astrídeo ainda não tem parentes registrados.</b>' : ''}</p>
      <div class="btns"><button class="btn primary" data-act="close">Fechar</button></div>`, 'wide');
    const wrap = $('.pedwrap'), fp = pos.get(focal.id);
    if (wrap && fp) { wrap.scrollLeft = X(fp.x) - wrap.clientWidth / 2; wrap.scrollTop = Y(fp.row) - wrap.clientHeight / 2; }
  }

  // ---------------- XENODEX ----------------
  function rDex() {
    const open = DEX.filter(d => has(d[0]));
    const got = open.filter(d => S.dex[`${d[0]}:${d[1]}`]).length;
    const groups = {};
    for (const d of DEX) (groups[d[0]] = groups[d[0]] || []).push(d);
    return `<h2>Xenodex</h2>
      <p class="sub">Cada fenótipo novo que aparece no seu viveiro é registrado e rende 1 de pesquisa. Registrados: <b>${got}/${open.length}</b>${open.length < DEX.length ? ' (genes ainda não estudados estão bloqueados)' : ''}.</p>
      ${Object.entries(groups).map(([l, arr]) => has(l) ? `<div class="panel" style="margin-bottom:10px">
        <b>${LOCUS_INFO[l].nome}</b> <span class="meta">· ${LOCUS_INFO[l].mech}</span>
        <p class="meta" style="margin:4px 0 8px">${LOCUS_INFO[l].how}</p>
        <div class="dex">${arr.filter(d => !(d[1] === 'dourado' && !S.flags.aurum)).map(d => { const on = S.dex[`${d[0]}:${d[1]}`]; return `<div class="dexi ${on ? '' : 'off'}"><b>${on ? d[2] : '???'}</b>${on ? '✔ registrado' : 'não encontrado'}</div>`; }).join('')}</div>
      </div>` : `<div class="panel locked" style="margin-bottom:10px"><b>🔒 Gene ainda não estudado</b> <span class="meta">· aparece em uma missão futura</span></div>`).join('')}`;
  }

  // ---------------- GUIA ----------------
  function guide() {
    modal(`<div class="guide"><h3>Guia de genética da estação</h3>
      <p>Cada astrídeo é <b>diploide</b>: tem dois alelos de cada gene, um vindo da mãe e outro do pai. O <b>locus</b> é a posição do gene no cromossomo, daí o nome da estação. No cruzamento, cada pai passa um alelo de cada gene ao acaso (1ª lei de Mendel), e genes diferentes se separam de forma independente (2ª lei).</p>
      ${LOCI.filter(has).map(l => `<h4>${LOCUS_INFO[l].nome}: ${LOCUS_INFO[l].mech}</h4><p>${LOCUS_INFO[l].how}</p>`).join('')}
      ${LOCI.some(l => !has(l)) ? `<p class="muted">🔒 Outros genes aparecem conforme você avança nas missões.</p>` : ''}
      <h4>Genótipo × fenótipo</h4><p>Você sempre vê o fenótipo. O genótipo aparece com <b>?</b> quando há mais de uma possibilidade: um astrídeo com manchas pode ser SS ou Ss (aparece "S?").</p>
      <h4>Como descobrir um genótipo</h4>
      <p><b>Cruzamento-teste:</b> cruze o indivíduo com um homozigoto recessivo (ex.: com manchas × liso). Se aparecer algum filhote liso, o pai com manchas só pode ser Ss. O laboratório faz essas deduções automaticamente depois de cada cruzamento.</p>
      <p><b>Sequenciamento:</b> revela tudo, mas custa pesquisa (liberado na missão 3).</p>
      ${S.flags.censo ? `<h4>Hardy-Weinberg</h4><p>Numa população em equilíbrio, as frequências de genótipos são p² : 2pq : q². Se q² é a fração de recessivos, q = √q², p = 1 − q, e os portadores são 2pq.</p>` : ''}
      <h4>Mutações</h4><p>Raramente (cerca de 1,5% dos filhotes) um alelo muda espontaneamente. Os filhotes com mutação aparecem marcados com ★.</p>
      <p style="margin-top:12px"><button class="btn primary" data-act="close">Entendi</button></p></div>`);
  }


  // =====================================================================
  // MÚSICA E EFEITOS
  // =====================================================================
  // Música: acordes lentos de "estação espacial"; na arena fica mais rápida, com baixo pulsante
  const SONG = { bpm: () => S && S.battle && !S.battle.over ? 124 : 66, play(step, t, d) {
    const fight = S && S.battle && !S.battle.over;
    const CH = fight ? [[45, 52, 57, 60], [43, 50, 55, 58], [41, 48, 53, 57], [40, 47, 52, 56]] : [[50, 57, 62, 66], [47, 54, 59, 62], [43, 50, 55, 59], [45, 52, 57, 61]];
    const bar = Math.floor(step / 8) % 4, s = step % 8, ch = CH[bar];
    if (fight) {
      Sound.note(midi(ch[0] - 12), t, d * 0.8, 'sawtooth', 0.22);
      if (s % 2 === 0) Sound.note(midi(ch[1 + (s / 2) % 3] + 12), t, d * 1.2, 'square', 0.1);
    } else {
      if (s === 0) for (const n of ch) Sound.note(midi(n), t, d * 7.5, 'sine', 0.16);
      if (s % 2 === 1) Sound.note(midi(ch[(step >> 1) % 4] + 24), t, d * 1.6, 'triangle', 0.07);
    }
  } };
  let musicOn = false;
  function wakeAudio() { Sound.ensure(); if (!musicOn) { musicOn = true; Sound.music(SONG); } }
  let sfxDelay = 0;
  const sfx = {
    tick: () => Sound.tone(620, 0.04, { type: 'sine', vol: 0.05 }),
    seq: () => { for (let i = 0; i < 8; i++) Sound.tone(midi(72 + (i * 5) % 17), 0.05, { type: 'sine', vol: 0.08, delay: i * 0.05 }); Sound.arp([84, 91], 0.08, { type: 'triangle', vol: 0.15, delay: 0.45 }); },
    hatch: (n, dead) => {
      for (let i = 0; i < n; i++) { Sound.noise(0.06, { freq: 2500, vol: 0.2, delay: i * 0.22 }); Sound.tone(midi(76 + i * 3), 0.15, { type: 'triangle', vol: 0.15, delay: i * 0.22 + 0.04 }); }
      for (let i = 0; i < dead; i++) Sound.tone(90, 0.3, { type: 'sine', vol: 0.25, slide: 0.6, delay: (n + i) * 0.22 });
    },
    mutation: () => Sound.tone(500, 0.6, { type: 'sine', vol: 0.12, slide: 1.8, delay: 0.9 }),
    deduce: () => Sound.arp([79, 86], 0.1, { type: 'sine', vol: 0.15, delay: 1.1 }),
    rocket: () => { Sound.noise(1.0, { freq: 200, sweep: 1500, vol: 0.25 }); Sound.tone(80, 1.0, { type: 'sawtooth', vol: 0.08, slide: 2 }); },
    capture: () => Sound.arp([67, 72, 76, 79], 0.08, { type: 'square', vol: 0.12 }),
    unlock: () => Sound.arp([72, 79, 84, 88, 91], 0.07, { type: 'triangle', vol: 0.18 }),
    coins: () => Sound.arp([84, 88, 91, 96], 0.06, { type: 'square', vol: 0.1 }),
    coin: () => Sound.arp([88, 93], 0.06, { type: 'square', vol: 0.09 }),
    drop: () => Sound.tone(220, 0.15, { type: 'triangle', vol: 0.12, slide: 0.6 }),
    dex: () => Sound.arp([88, 91, 96], 0.07, { type: 'sine', vol: 0.15, delay: 0.3 }),
    hit: crit => { Sound.noise(0.08, { freq: 1100, vol: 0.22, delay: sfxDelay }); Sound.tone(crit ? 330 : 200, 0.12, { vol: 0.1, slide: 0.5, delay: sfxDelay }); if (crit) Sound.tone(1000, 0.12, { vol: 0.08, slide: 1.5, delay: sfxDelay + 0.05 }); },
    miss: () => Sound.noise(0.2, { freq: 600, sweep: 2500, vol: 0.12, delay: sfxDelay }),
    special: e => ({
      Plasma: () => Sound.noise(0.35, { freq: 3000, sweep: 400, vol: 0.25, delay: sfxDelay }),
      Gelo: () => Sound.arp([84, 91, 96], 0.05, { type: 'sine', vol: 0.15, delay: sfxDelay }),
      Tempestade: () => { Sound.tone(1400, 0.25, { type: 'sawtooth', vol: 0.1, slide: 0.15, delay: sfxDelay }); Sound.noise(0.2, { freq: 4000, vol: 0.2, delay: sfxDelay }); },
      Neutro: () => Sound.arp([72, 76, 79, 84], 0.06, { type: 'triangle', vol: 0.15, delay: sfxDelay }),
    }[e])(),
    flash: () => Sound.tone(500, 0.4, { type: 'sine', vol: 0.18, slide: 4, delay: sfxDelay }),
    win: () => Sound.arp([72, 76, 79, 84, 79, 84, 88], 0.1, { type: 'square', vol: 0.13, dur: 0.2, delay: 0.6 }),
    lose: () => Sound.arp([69, 65, 62, 57], 0.2, { type: 'triangle', vol: 0.2, dur: 0.4, delay: 0.6 }),
  };

  // =====================================================================
  // AÇÕES
  // =====================================================================
  document.addEventListener('click', e => {
    wakeAudio();
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const a = el.dataset.act, id = el.dataset.id ? +el.dataset.id : null;
    switch (a) {
      case 'tab': sfx.tick(); closeModal(); S.tab = el.dataset.v; render(); window.scrollTo({ top: 0 }); break;
      case 'close': closeModal(); render(); showLesson(); break;
      case 'guide': guide(); break;
      case 'reset':
        modal(`<h3>Começar um novo jogo?</h3><p>Todo o progresso desta estação será apagado.</p><div class="btns"><button class="btn danger" data-act="reset2">Apagar e recomeçar</button><button class="btn" data-act="close">Cancelar</button></div>`); break;
      case 'reset2': lessonQueue = null; newGame(); closeModal(); intro(); render(); break;
      case 'start': S.intro = true; closeModal(); render(); startMission(); render(); break;
      case 'mstart': startMission(); render(); break;
      case 'mstart2': closeModal(); S.tab = 'missoes'; startMission(); render(); break;
      case 'lesson': { const M = MISSIONS[+el.dataset.v]; if (M) modal(`<h3>Lição ${+el.dataset.v + 1}: ${M.t}</h3>${M.lesson}<div class="btns"><button class="btn primary" data-act="close">Fechar</button></div>`); break; }
      case 'mans': {
        const before = S.mission; missionEvent('answer', { v: el.dataset.v });
        if (S.mission === before) { sfx.drop(); toast(`❌ ${el.dataset.v} não bate com o que se sabe de Neve. Veja a dica!`); }
        render(); break;
      }
      case 'seq': {
        const c = byId(id); if (!c || c.seq || S.research < 1 || !S.flags.seq) break;
        S.research--; c.seq = true; sfx.seq(); toast(`🧬 Genoma de <b>${esc(c.name)}</b> sequenciado.`); missionEvent('seq'); render(); break;
      }
      case 'sell': {
        const c = byId(id); if (!c) break;
        modal(`<h3>Transferir ${esc(c.name)}?</h3><div style="text-align:center">${art(c, 110)}</div><p>Ele vai para outra estação de pesquisa, e você recebe <b>${sellValue(c)} créditos</b>.</p><div class="btns"><button class="btn danger" data-act="sell2" data-id="${c.id}">Transferir</button><button class="btn" data-act="close">Cancelar</button></div>`); break;
      }
      case 'sell2': {
        const c = byId(id); if (!c) break;
        S.credits += sellValue(c); sfx.coin(); removeCreature(c);
        closeModal(); render(); break;
      }
      case 'tobreed': { const c = byId(id); if (!c) break; S.breed[c.sex === 'F' ? 'f' : 'm'] = c.id; S.tab = 'cruzar'; render(); window.scrollTo({ top: 0 }); break; }
      case 'pick': S.breed[el.dataset.slot] = id; render(); break;
      case 'breed': doBreed(+el.dataset.v || 1); break;
      case 'trip': {
        const pl = PLANETS.find(p => p.id === el.dataset.v); if (!pl || !S.planets[pl.id] || S.credits < pl.trip) break;
        S.credits -= pl.trip; S.day++; sfx.rocket(); S.exp = { planet: pl.id, mode: null }; render(); window.scrollTo({ top: 0 }); break;
      }
      case 'mode': {
        if (!S.exp || S.exp.mode) break;
        const pl = PLANETS.find(p => p.id === S.exp.planet), m = el.dataset.v;
        S.exp.mode = m; sfx.tick();
        if (m === 'capturar') S.exp.wild = [wild(pl), wild(pl), wild(pl)];
        if (m === 'censo') S.exp.census = makeCensus(pl);
        if (m === 'comercio') S.exp.shop = [0, 1, 2].map(() => { const c = wild(pl); c.seq = true; return c; });
        if (m === 'arquivos') S.exp.arch = 2;
        render(); break;
      }
      case 'capture': {
        const w = S.exp && S.exp.wild && S.exp.wild[+el.dataset.i]; if (!w || S.creatures.length >= cap()) break;
        w.id = S.nextId++; sfx.capture(); addCreature(w); S.stats.caught++; S.exp = null;
        toast(`🛸 <b>${esc(w.name)}</b> chegou ao viveiro!`); missionEvent('capture'); render(); break;
      }
      case 'cans': { const C = S.exp && S.exp.census; if (!C || C.done) break; C[el.dataset.k] = el.dataset.v; sfx.tick(); render(); break; }
      case 'csub': {
        const C = S.exp && S.exp.census; if (!C || C.done || !C.a1 || !C.a2) break;
        const n = (C.a1 === C.q) + (C.a2 === C.het);
        C.done = true; C.ok = n === 2; C.half = n === 1;
        if (C.ok) { S.credits += 25; S.research += 1; sfx.coins(); } else if (C.half) { S.credits += 10; sfx.coin(); } else sfx.drop();
        render(); missionEvent('census', { ok: C.ok }); break;
      }
      case 'buy': {
        const c = S.exp && S.exp.shop && S.exp.shop[+el.dataset.i]; if (!c || S.credits < shopPrice(c) || S.creatures.length >= cap()) break;
        S.credits -= shopPrice(c); c.id = S.nextId++; addCreature(c); S.exp.shop[+el.dataset.i] = null; sfx.coins();
        toast(`🏪 <b>${esc(c.name)}</b> comprado!`); missionEvent('trade'); render(); break;
      }
      case 'archseq': {
        const c = byId(id); if (!c || c.seq || !S.exp || !S.exp.arch) break;
        c.seq = true; S.exp.arch--; sfx.seq(); toast(`💾 Genoma de <b>${esc(c.name)}</b> recuperado dos arquivos.`); missionEvent('seq'); render(); break;
      }
      case 'leave': S.exp = null; render(); break;
      case 'deliver': {
        const ct = S.contracts.find(x => x.id === +el.dataset.c), c = byId(id); if (!ct || !c) break;
        modal(`<h3>Entregar ${esc(c.name)}?</h3><div style="text-align:center">${art(c, 110)}</div><p>Para <b>${esc(ct.client)}</b>, por <b>${ct.reward.cr} 💰</b> e <b>${ct.reward.rp} 🔬</b>. O astrídeo deixa a estação.</p><div class="btns"><button class="btn primary" data-act="deliver2" data-c="${ct.id}" data-id="${c.id}">Entregar</button><button class="btn" data-act="close">Cancelar</button></div>`); break;
      }
      case 'deliver2': {
        const ct = S.contracts.find(x => x.id === +el.dataset.c), c = byId(id); if (!ct || !c || !ct.reqs.every(r => meets(c, r))) { closeModal(); break; }
        S.credits += ct.reward.cr; S.research += ct.reward.rp; S.contractsDone++; sfx.coins();
        removeCreature(c, 'entregue');
        S.contracts = S.contracts.map(x => x === ct ? genContract() : x);
        closeModal(); toast(`📜 Contrato concluído! +${ct.reward.cr} 💰 +${ct.reward.rp} 🔬`, 'gold'); missionEvent('contract'); render(); break;
      }
      case 'drop': { const i = S.contracts.findIndex(x => x.id === +el.dataset.c); if (i >= 0) { sfx.drop(); S.contracts[i] = genContract(); render(); } break; }
      case 'expand': {
        if (cap() >= CAP_MAX || S.credits < capCost()) break;
        S.credits -= capCost(); S.cap = cap() + CAP_STEP; sfx.unlock(); toast(`🧫 Viveiro ampliado para <b>${cap()}</b> vagas!`, 'gold'); render(); break;
      }
      case 'fight': startBattle(id); break;
      case 'ped': pedigree(id, el.dataset.tr); break;
      case 'move': turn(el.dataset.v); break;
      case 'flee': S.battle.over = true; S.battle.log.push('Você encerrou a simulação.'); render(); break;
      case 'endbattle': S.battle = null; render(); break;
    }
  });

  function intro() {
    modal(`<h3>Bem-vinda(o) à Locus Astra</h3>
      <p>Ano 2187. A estação <b>Locus Astra</b> orbita uma nebulosa cheia de planetas habitados por <b>astrídeos</b>, criaturas cuja herança segue as mesmas regras descobertas por Mendel.</p>
      <p>Você é a nova geneticista da estação. A Federação vai te passar <b>missões</b>: cada uma apresenta um gene ou uma ideia nova. Começamos com só dois genes, cor e padrão.</p>
      <ul>
        <li><b>Cruzamento:</b> preveja os filhotes com quadros de Punnett e descubra genótipos por cruzamento-teste.</li>
        <li><b>Expedição:</b> 7 planetas com frequências alélicas diferentes. Capture, faça censos, compre genomas ou use os arquivos de Helix-7.</li>
        <li><b>Arena:</b> os golpes de cada astrídeo dependem do seu genótipo.</li>
        <li><b>Contratos</b> e <b>Xenodex</b> dão créditos e pesquisa.</li>
      </ul>
      <p class="muted">O progresso é salvo automaticamente neste navegador.</p>
      <button class="btn primary" data-act="start">Assumir o laboratório</button>`);
  }

  if (/github\.io$/.test(location.hostname)) $('#backlink').hidden = false; // link só aparece no site publicado
  if (!load()) newGame();
  render();
  if (!S.intro) intro();
  window.__LA = { get S() { return S; }, cross, deduce, cands, gDisplay, ph, stats, wild: () => wild(PLANETS[0]), render, genContract, meets, MISSIONS, missionEvent, startMission, moveset, makeCensus, PLANETS, unlockGene };
})();
