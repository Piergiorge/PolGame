<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fita Molde — do gene à proteína</title>
<style>
  :root { --bg:#140b22; --panel:#1f1433; --panel2:#2a1d42; --line:#3a2d55; --text:#efe9f7; --muted:#a99bc0; --accent:#80deea;
          --A:#4caf50; --T:#ef5350; --U:#ff8a65; --C:#42a5f5; --G:#ffca28; --gold:#ffd54f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display:flex; flex-direction:column; align-items:center; padding:14px; gap:10px; }
  .wrap { width:100%; max-width:800px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px 14px; flex-wrap:wrap; }
  .topbar .left { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; font-weight:700; }
  h1 small { font-weight:400; color:var(--muted); font-size:14px; margin-left:6px; }
  .backlink { color:var(--muted); text-decoration:none; font-size:13px; }
  .backlink:hover { color:var(--text); }
  .backlink[hidden] { display:none; }
  .tbtns { display:flex; gap:6px; }
  .soundbtn, .tbtn { background:rgba(255,255,255,.08); color:var(--text); border:0; border-radius:8px; padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .soundbtn:hover, .tbtn:hover { background:rgba(255,255,255,.15); }
  .stage { position:relative; }
  canvas { width:100%; aspect-ratio:800/450; display:block; border-radius:10px; background:#2a1440; outline:none; touch-action:none; }
  .overlay { position:absolute; inset:0; background:rgba(18,9,32,.94); border-radius:10px; display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow:auto; }
  .overlay[hidden] { display:none; }
  .stage.open .overlay { position:relative; inset:auto; min-height:min(450px, 56.25vw); }
  .stage.open canvas { position:absolute; inset:0; opacity:.35; }
  .card { max-width:660px; width:100%; margin:auto 0; }
  .card h2 { margin:0 0 6px; font-size:21px; color:#ffd54f; }
  .card h3 { margin:12px 0 4px; font-size:15px; color:var(--accent); }
  .card p, .card li { margin:5px 0; }
  .card ul { padding-left:18px; margin:6px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .seq { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; background:#2a1d42; border-radius:8px; padding:8px 10px; margin:8px 0; line-height:1.8; overflow-x:auto; white-space:nowrap; }
  .b { font-weight:700; } .bA { color:var(--A); } .bT { color:var(--T); } .bU { color:var(--U); } .bC { color:var(--C); } .bG { color:var(--G); }
  .bad { background:#ff5252; color:#fff !important; border-radius:3px; padding:0 2px; }
  .ins { background:#ab47bc; color:#fff !important; border-radius:3px; padding:0 2px; }
  .intron { background:rgba(255,255,255,.12); border-radius:3px; }
  table.t { border-collapse:collapse; width:100%; font-size:13px; margin:8px 0; }
  table.t th, table.t td { text-align:left; padding:4px 8px; border-bottom:1px solid #35274f; }
  table.t th { color:var(--muted); font-weight:600; }
  .stats { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted); margin:8px 0 12px; }
  .stats b { color:var(--text); }
  button.big { background:#ffca28; color:#1d1230; border:0; border-radius:8px; padding:9px 18px; font:inherit; font-weight:700; cursor:pointer; }
  button.big:hover { filter:brightness(1.08); }
  button.big.alt { background:#3a2d55; color:var(--text); }
  button.big:disabled { opacity:.45; cursor:not-allowed; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .phases { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; margin-top:10px; }
  .ph { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:left; color:var(--text); font:inherit; cursor:pointer; display:flex; flex-direction:column; gap:3px; min-height:118px; }
  .ph:hover:not(:disabled) { border-color:var(--accent); }
  .ph:disabled { opacity:.45; cursor:not-allowed; }
  .ph .n { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .ph b { font-size:15px; }
  .ph span { font-size:12px; color:var(--muted); }
  .ph .st { margin-top:auto; font-size:12px; color:#9ccc65; }
  .hint { color:var(--muted); font-size:13px; min-height:20px; }
  kbd { background:#2f2347; border-radius:4px; padding:1px 6px; font-family:inherit; font-size:12px; color:var(--text); }
  .touch { display:none; flex-wrap:wrap; justify-content:center; gap:8px; user-select:none; -webkit-user-select:none; }
  .touch button { min-width:56px; height:52px; padding:0 10px; border-radius:12px; border:0; background:#2f2347; color:var(--text); font:inherit; font-size:17px; font-weight:700; touch-action:none; }
  .touch button.small { font-size:12px; }
  .touch button:active { background:#4a3870; }
  .touch button[hidden] { display:none; }
  @media (pointer: coarse) { .touch { display:flex; } }
  /* fase 5 */
  .tiles { display:flex; flex-wrap:wrap; gap:16px 3px; margin:18px 0 8px; }
  .tile { width:26px; height:30px; border-radius:5px; border:0; font:700 14px ui-monospace, Menlo, monospace; color:#1d1230; cursor:pointer; position:relative; }
  .tile.sel { outline:3px solid #fff; }
  .tile.inr { box-shadow:0 0 0 2px #ffffff55 inset; }
  .tile.dim { opacity:.35; }
  .tile small { position:absolute; top:-13px; left:0; right:0; font:10px system-ui; color:var(--muted); }
  .order { display:grid; gap:8px; margin-top:8px; }
  .order button { text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 12px; font:inherit; cursor:pointer; }
  .order button:hover { border-color:var(--accent); }
  .order button.done { border-color:#9ccc65; color:#9ccc65; cursor:default; }
  .meter { height:16px; background:#2a1d42; border-radius:8px; overflow:hidden; position:relative; margin:8px 0; }
  .meter i { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, #4caf50, #9ccc65); }
  .meter .zone { position:absolute; top:0; bottom:0; background:rgba(255,255,255,.18); border-left:1px dashed #fff8; border-right:1px dashed #fff8; }
  .flow { display:grid; gap:6px; margin:10px 0; }
  .flow div { background:var(--panel); border-radius:8px; padding:7px 10px; font-size:13px; }
  .flow b { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap topbar">
  <div class="left"><a class="backlink" href="../">← Todos os jogos</a><h1>Fita Molde <small id="phaseLabel">do gene à proteína</small></h1></div>
  <div class="tbtns"><button class="tbtn" id="menuBtn" type="button">☰ Fases</button><button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button></div>
</div>
<div class="wrap stage">
  <canvas id="game" width="800" height="450" tabindex="0"></canvas>
  <div class="overlay" id="ov" hidden><div class="card" id="ovCard"></div></div>
</div>
<div class="wrap touch" id="touch">
  <button data-k="ArrowLeft" aria-label="Esquerda">◀</button>
  <button data-k="ArrowRight" aria-label="Direita">▶</button>
  <button data-k="ArrowUp" aria-label="Cima">▲</button>
  <button data-k="ArrowDown" aria-label="Baixo">▼</button>
  <button data-k="Space" class="small">Pular/OK</button>
  <button data-k="KeyE" class="small">Revisar</button>
  <button data-k="Digit1" class="small">1 MMR</button>
  <button data-k="Digit2" class="small">2 NER</button>
  <button data-k="Digit3" class="small">3 BER</button>
  <button data-k="Backspace" class="small">Desfazer</button>
</div>
<div class="wrap hint" id="hint"></div>
<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    try { muted = localStorage.getItem('fitamolde-mudo') === '1'; } catch (e) {}
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = ac.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(musicBus); osc.start(time); osc.stop(time + dur + 0.03);
    }
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.15) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);
    }
    function toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.5;
      try { localStorage.setItem('fitamolde-mudo', muted ? '1' : '0'); } catch (e) {}
      updateSoundButton();
      return muted;
    }
    return { ensure, tone, noise, arp, note, music, toggle, get muted() { return muted; } };
  })();
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundButton() { if (soundBtn) { soundBtn.textContent = Sound.muted ? '🔇 Som desligado (M)' : '🔊 Som ligado (M)'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } }
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.ensure(); Sound.toggle(); soundBtn.blur(); });
  updateSoundButton();
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { Sound.ensure(); Sound.toggle(); } });
  // links "todos os jogos" só aparecem no site publicado
  for (const a of document.querySelectorAll('.backlink')) if (!/github\.io$/.test(location.hostname)) a.hidden = true;

  // =====================================================================
  // NÚCLEO DA CAMPANHA
  // =====================================================================
  const $ = s => document.querySelector(s);
  const canvas = $('#game'), ctx = canvas.getContext('2d');
  const W = 800, H = 450;
  const rand = n => Math.floor(Math.random() * n);
  const pick = a => a[rand(a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // ---------- genética compartilhada ----------
  const BASE_COLOR = { A: '#4caf50', T: '#ef5350', U: '#ff8a65', C: '#42a5f5', G: '#ffca28' };
  const DNA_PAIR = { A: 'T', T: 'A', C: 'G', G: 'C' };
  const RNA_FOR_TEMPLATE = { A: 'U', T: 'A', C: 'G', G: 'C' }; // ribonucleotídeo que pareia com a base do molde
  const HBONDS = { A: 2, T: 2, U: 2, C: 3, G: 3 };
  const ORDER = 'TCAG', AA = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
  const AA3 = { A: 'Ala', R: 'Arg', N: 'Asn', D: 'Asp', C: 'Cys', Q: 'Gln', E: 'Glu', G: 'Gly', H: 'His', I: 'Ile', L: 'Leu', K: 'Lys', M: 'Met', F: 'Phe', P: 'Pro', S: 'Ser', T: 'Thr', W: 'Trp', Y: 'Tyr', V: 'Val', '*': 'Stop' };
  const codonAA = c => { const d = c.replace(/U/g, 'T'); return AA[16 * ORDER.indexOf(d[0]) + 4 * ORDER.indexOf(d[1]) + ORDER.indexOf(d[2])]; };
  const HYDRO = new Set('AVLIMFWC'.split(''));
  const isH = aa => HYDRO.has(aa);
  const toRNA = s => s.replace(/T/g, 'U');

  // Gene da luciferase (fictício, simplificado): éxon 1 + íntron + éxon 2 (fita codificante, 5'→3')
  const GENE = { exon1: 'ATGAAACTGGTT', intron: 'GTAAGTCAG', exon2: 'TCTGAATTCATCTGGTAA' };
  const CODING = GENE.exon1 + GENE.intron + GENE.exon2;             // 39 nt
  const TEMPLATE = CODING.split('').map(b => DNA_PAIR[b]).join(''); // fita molde (3'→5', alinhada)
  const INTRON = [GENE.exon1.length, GENE.exon1.length + GENE.intron.length - 1]; // [12, 20]
  const PROTEIN_OK = 'MKLVSEFIW';
  const UTR5 = 'GCCACC', UTR3 = 'CUAAUAAAGCCA';

  function translateFromAUG(mrna) {
    const start = mrna.indexOf('AUG');
    if (start < 0) return { protein: '', start: -1, stop: false, codons: [] };
    const codons = [];
    let prot = '', stop = false;
    for (let i = start; i + 3 <= mrna.length; i += 3) {
      const c = mrna.slice(i, i + 3), a = codonAA(c);
      codons.push(c);
      if (a === '*') { stop = true; break; }
      prot += a;
    }
    return { protein: prot, start, stop, codons };
  }

  // HTML de sequência colorida
  function seqHTML(s, opts = {}) {
    return s.split('').map((b, i) => {
      const cls = ['b', 'b' + b];
      if (opts.ref && opts.ref[i] !== undefined && opts.ref[i] !== b) cls.push('bad');
      if (opts.intron && i >= opts.intron[0] && i <= opts.intron[1]) cls.push('intron');
      return `<span class="${cls.join(' ')}">${b}</span>${opts.codons && (i + 1) % 3 === 0 ? ' ' : ''}`;
    }).join('');
  }
  const protHTML = (p, ref) => p.split('').map((a, i) => `<span class="${ref && ref[i] !== a ? 'bad' : ''}">${AA3[a] || a}</span>`).join('–') || '<i>(nenhum aminoácido)</i>';

  // ---------- estado da campanha ----------
  const SAVE_KEY = 'fitamolde-campanha-v1';
  let C = { unlocked: 1, done: {}, data: {}, teacher: false };
  try { const t = localStorage.getItem(SAVE_KEY); if (t) C = { ...C, ...JSON.parse(t) }; } catch (e) {}
  const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(C)); } catch (e) {} };

  // Dados de cada fase, com padrão "correto" caso a fase anterior não tenha sido jogada
  const getData = {
    dna2: () => C.data.dna2 || CODING.split('').map(b => ({ b, ins: false })),
    dna3: () => C.data.dna3 || CODING,
    pre: () => C.data.pre || toRNA(C.data.dna3 || CODING),
    mrna: () => C.data.mrna || { seq: UTR5 + toRNA(GENE.exon1 + GENE.exon2) + UTR3, cap: true, tail: 200, splice: 'ok' },
    protein: () => C.data.protein != null ? C.data.protein : { seq: PROTEIN_OK, stop: true, nonstop: false },
    fold: () => C.data.fold || { contacts: null, max: null, quality: 'nativa' },
  };
  const usedDefault = key => !C.data[key];
  // menos de 3 aminoácidos: não há proteína para dobrar nem função para testar
  const noProtein = () => (getData.protein().seq || '').length < 3;

  // ---------- registro de fases ----------
  const PHASES = [];
  let cur = null, curIdx = -1;
  const ov = $('#ov'), ovCard = $('#ovCard');
  const stageEl = document.querySelector('.stage');
  function showOverlay(html) { ovCard.innerHTML = html; ov.hidden = false; stageEl.classList.add('open'); ov.scrollTop = 0; }
  function hideOverlay() { ov.hidden = true; ovCard.innerHTML = ''; stageEl.classList.remove('open'); }
  const overlayOpen = () => !ov.hidden;

  function setTouch(list) {
    for (const b of document.querySelectorAll('#touch button')) b.hidden = !list.includes(b.dataset.k);
  }
  function stopPhase() { if (cur && cur.stop) cur.stop(); cur = null; Sound.music(null); }

  function showMenu() {
    stopPhase();
    $('#phaseLabel').textContent = 'do gene à proteína';
    $('#hint').innerHTML = '';
    const items = PHASES.map((p, i) => {
      const open = C.teacher || i < C.unlocked;
      return `<button class="ph" data-phase="${i}" ${open ? '' : 'disabled'}><span class="n">Fase ${i + 1}</span><b>${p.title}</b><span>${p.short}</span>
        <span class="st">${C.done[i] ? '✔ concluída' : open ? '▶ disponível' : '🔒 bloqueada'}</span></button>`;
    }).join('');
    showOverlay(`<h2>Fita Molde: do gene à proteína</h2>
      <p>Acompanhe o gene da <b>luciferase</b>, a enzima que faz o vaga-lume brilhar, desde a replicação do DNA até a proteína funcionando. O que você produz em cada fase passa para a seguinte, com acertos e erros.</p>
      <div class="phases">${items}</div>
      <div class="btnrow">
        <button class="big alt" data-act="teacher">${C.teacher ? '✔ Modo professor ativo' : 'Modo professor: liberar todas as fases'}</button>
        <button class="big alt" data-act="resetcamp">Recomeçar campanha</button>
      </div>
      <p class="muted">Se você pular uma fase, a seguinte usa a sequência correta como ponto de partida.</p>`);
  }

  function showBrief(i) {
    const p = PHASES[i];
    stopPhase();
    const sk = p.skipInfo && p.skipInfo();
    if (sk) {
      showOverlay(`<h2>Fase ${i + 1}: ${p.title}</h2>${sk}
        <div class="btnrow"><button class="big" data-act="skip" data-phase="${i}" data-primary>Ver o resultado final (Enter)</button><button class="big alt" data-act="menu">Menu de fases</button></div>`);
      return;
    }
    const note = p.needs && usedDefault(p.needs) && i > 0 ? `<p class="muted">Você ainda não concluiu a fase anterior, então esta fase vai usar a sequência correta como ponto de partida.</p>` : '';
    showOverlay(`<h2>Fase ${i + 1}: ${p.title}</h2>${p.brief()}${note}
      <h3>Controles</h3><p class="muted">${p.controls}</p>
      <div class="btnrow"><button class="big" data-act="go" data-phase="${i}" data-primary>Começar (Enter)</button><button class="big alt" data-act="menu">Menu de fases</button></div>`);
  }

  function startPhase(i) {
    hideOverlay();
    cur = PHASES[i]; curIdx = i;
    $('#phaseLabel').textContent = `Fase ${i + 1}: ${cur.title}`;
    $('#hint').innerHTML = cur.controls;
    setTouch(cur.touch || []);
    for (const k in keys) keys[k] = false;
    Sound.ensure();
    cur.start();
    Sound.music(cur.song || null);
    canvas.focus();
  }

  function completePhase(i, html, data) {
    Object.assign(C.data, data || {});
    C.done[i] = true;
    C.unlocked = Math.max(C.unlocked, i + 2);
    save();
    Sound.music(null);
    const last = i === PHASES.length - 1;
    const nx = PHASES[i + 1], nxSkip = nx && nx.skipInfo && nx.skipInfo();
    showOverlay(`${html}<div class="btnrow">
      ${last ? '' : nxSkip ? `<button class="big" data-act="skip" data-phase="${i + 1}" data-primary>Ver o resultado final (Enter)</button>` : `<button class="big" data-act="brief" data-phase="${i + 1}" data-primary>Próxima fase: ${PHASES[i + 1].title} (Enter)</button>`}
      <button class="big alt" data-act="brief" data-phase="${i}">Jogar esta fase de novo</button>
      <button class="big alt" data-act="menu">Menu de fases</button></div>`);
    cur = null;
  }
  function failPhase(i, html) {
    Sound.music(null);
    showOverlay(`${html}<div class="btnrow"><button class="big" data-act="go" data-phase="${i}" data-primary>Tentar de novo (Enter)</button><button class="big alt" data-act="menu">Menu de fases</button></div>`);
    cur = null;
  }

  ov.addEventListener('click', e => {
    const el = e.target.closest('[data-act], [data-phase]'); if (!el) return;
    Sound.ensure();
    const a = el.dataset.act, ph = el.dataset.phase !== undefined ? +el.dataset.phase : null;

  // ---------- entrada ----------

  // ---------- utilidades de desenho ----------

  // =====================================================================
  // MOTOR DE PLATAFORMA (fases 1 e 2): a DNA polimerase copia a fita molde

  function makePlatformer(cfg) {

    const N = cfg.target.length;

    }
    function reset() {

      ros = L.ros.map((d, i) => ({ x0: d.x0 * T, x1: d.x1 * T, cy: d.r * T + 16, x: d.x0 * T + (i * 37) % Math.max(1, (d.x1 - d.x0) * T), y: d.r * T + 16, dir: 1, t: i }));

    function collect(n) {

      else { Sound.tone(midi(BASE_NOTE[n.base]), 0.35, { type: 'sawtooth', vol: 0.14, slide: 0.7 }); Sound.tone(midi(BASE_NOTE[n.base] + 1), 0.35, { type: 'sawtooth', vol: 0.12, slide: 0.7 }); mutations++; shake = 0.25; popText(`Mutação! ${n.base} não pareia com ${cfg.template[i]}`, '#ff5252'); }

    }

    // ---------- física ----------

      const rot = now / 400; ctx.fillStyle = 'rgba(255,112,67,.25)'; circle(r.x, r.y, 18); ctx.fill();

    }
    function drawInter(r, now) {

      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(Math.sin(now / 500 + r.t) * 0.3);

    function drawCheckpoint(c) {
      ctx.fillStyle = '#d7ccc8'; ctx.fillRect(c.x + 6, c.y, 3, c.h);

    function drawGoal(now) {

      ctx.fillStyle = '#ab47bc'; rr(g.x + 10, g.y, g.w - 20, g.h, 20); ctx.fill();

    }
    function drawPlayer() {
      const p = player; if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) return;
      let sx = 1, sy = 1; if (p.squash > 0) { sx = 1.25; sy = 0.78; } else if (!p.onGround && p.vy < -200) { sx = 0.88; sy = 1.12; }
      const dw = p.w * sx, dh = p.h * sy, dx = p.x + (p.w - dw) / 2, dy = p.y + p.h - dh;
      ctx.fillStyle = '#26c6da'; rr(dx, dy, dw, dh, 8); ctx.fill();
      ctx.fillStyle = '#00838f'; rr(p.facing > 0 ? dx + dw - 6 : dx - 2, dy + dh * 0.45, 8, dh * 0.35, 3); ctx.fill();
      const eyeX = p.facing > 0 ? dx + dw - 11 : dx + 4;
      ctx.fillStyle = '#fff'; ctx.fillRect(eyeX, dy + 6, 7, 7); ctx.fillStyle = '#102027'; ctx.fillRect(eyeX + (p.facing > 0 ? 4 : 1), dy + 8, 2, 4);

    }
    function drawTail() {
      if (!strand.length || trail.length < 2) return;
      const pts = [];
      for (let k = 0; k < Math.min(strand.length, 18); k++) {
        const ti = trail.length - 1 - (k + 1) * 4; if (ti < 0) break;
        const s = strand[strand.length - 1 - k];

      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(player.x + player.w / 2, player.y + player.h * 0.6);
      for (const p of pts) ctx.lineTo(p.x, p.y); ctx.stroke();
      for (const p of pts) { ctx.fillStyle = BASE_COLOR[p.s.b]; circle(p.x, p.y, 5); ctx.fill(); if (p.s.ins) { ctx.strokeStyle = '#ce93d8'; ctx.lineWidth = 2; ctx.stroke(); } }
    }
    function drawHUD(now) {
      // janela do molde ao redor da posição atual
      const WIN = Math.min(N, 13), cw = 24, labelW = 58, gap = 5;
      const i0 = clamp(idx() - 6, 0, N - WIN);
      const totalW = labelW * 2 + cw * WIN + gap * 4, x0 = (W - totalW) / 2, y0 = 6;
      panel(x0 - 8, y0, totalW + 16, 74);

      label(`Nova 5'${i0 > 0 ? ' …' : ''}`, x0 + labelW - 6, y0 + 52, { font: '600 11px system-ui, sans-serif', align: 'right', color: '#cbb8e0' });
      const endX = x0 + labelW + cw * WIN + gap * 4 + 4;
      label(i0 + WIN < N ? "… 5'" : "5'", endX, y0 + 22, { font: '600 11px system-ui, sans-serif', color: '#cbb8e0' });
      label(i0 + WIN < N ? "… 3'" : "3'", endX, y0 + 52, { font: '600 11px system-ui, sans-serif', color: '#cbb8e0' });
      // mapeia posição do molde -> base da nova fita (ignorando inserções) e inserções após cada posição
      const nb = [], insAfter = {};
      let j = 0;
      for (const s of strand) { if (s.ins) { (insAfter[j - 1] = insAfter[j - 1] || []).push(s.b); } else nb[j++] = s.b; }
      const pulse = 0.5 + 0.5 * Math.sin(now / 160);
      for (let k = 0; k < WIN; k++) {
        const i = i0 + k, cx = x0 + labelW + k * cw + Math.floor(i / 3) * gap - Math.floor(i0 / 3) * gap;
        if (cfg.intron && i >= cfg.intron[0] && i <= cfg.intron[1]) { ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(cx, y0 + 4, cw, 60); }
        baseTile(cx + 1, y0 + 8, cw - 2, 20, cfg.template[i], { alpha: 0.75 });
        if (i < nb.length) {

          if (ok) { ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.beginPath(); const k2 = HBONDS[b]; for (let q = 0; q < k2; q++) { const lx = cx + cw / 2 + (q - (k2 - 1) / 2) * 5; ctx.moveTo(lx, y0 + 30); ctx.lineTo(lx, y0 + 36); } ctx.stroke(); }
          else label('✕', cx + cw / 2, y0 + 34, { font: '700 10px system-ui, sans-serif', align: 'center', base: 'middle', color: '#ff5252' });
        } else {
          ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); rr(cx + 1.5, y0 + 38.5, cw - 3, 19, 4); ctx.stroke(); ctx.setLineDash([]);
          if (i === nb.length) { ctx.strokeStyle = `rgba(255,213,79,${0.4 + 0.6 * pulse})`; ctx.lineWidth = 2; rr(cx, y0 + 7, cw, 22, 5); ctx.stroke(); rr(cx, y0 + 37, cw, 22, 5); ctx.stroke(); label('?', cx + cw / 2, y0 + 49, { font: '700 12px system-ui, sans-serif', align: 'center', base: 'middle', color: '#ffd54f' }); }

      label(`${idx()}/${N}`, x0 + labelW / 2 - 6, y0 + 70, { font: '600 10px system-ui, sans-serif', align: 'center', color: '#a99bc0' });
      const txt = `Erros: ${mutations}   Revisões: ${corrected}   Danos: ${hits}${insertions ? `   Inserções: ${insertions}` : ''}${hasHelicase ? '   Helicase ✓' : ''}`;
      ctx.font = '600 12px system-ui, sans-serif'; const w = ctx.measureText(txt).width + 20;
      panel(10, H - 34, w, 24, 0.75); label(txt, 20, H - 18, { font: '600 12px system-ui, sans-serif' });

    return {
      ...cfg.phase,
      start() { reset(); },
      key(code, down) {
        if (!down) return;
        if (['Space', 'KeyW', 'ArrowUp'].includes(code)) jumpBufferTimer = PP.jumpBuffer;
        if (['KeyE', 'ArrowDown', 'KeyS'].includes(code)) proofread();

      },
      update(dt) { acc += Math.min(0.1, dt); while (acc >= STEP && !done) { step(STEP); acc -= STEP; } },
      render(dt) {
        const now = performance.now();

        const sx = shake > 0 ? (Math.random() - 0.5) * 8 : 0, sy = shake > 0 ? (Math.random() - 0.5) * 6 : 0;
        const cx = Math.round(camX);

        for (const n of nucs) if (n.active && n.x > cx - 40 && n.x < cx + W + 40) drawNuc(n, now);
        if (helicase && !helicase.taken) { const y = helicase.y + Math.sin(now / 250) * 3; ctx.fillStyle = 'rgba(128,222,234,.25)'; circle(helicase.x, y, 18); ctx.fill(); for (let i = 0; i < 6; i++) { const a = now / 600 + i * Math.PI / 3; ctx.fillStyle = i % 2 ? '#4dd0e1' : '#80deea'; circle(helicase.x + Math.cos(a) * 8, y + Math.sin(a) * 8, 5); ctx.fill(); } label('helicase', helicase.x, y - 20, { font: '600 10px system-ui, sans-serif', align: 'center', color: '#e0f7fa' }); }

          label(t.text, t.x, t.y, { font: '700 13px system-ui, sans-serif', align: 'center', color: t.color }); ctx.globalAlpha = 1;

  }

  // ---------- ferramentas de construção de fase ----------
  function emptyGrid(cols) { return Array.from({ length: ROWS }, () => new Array(cols).fill(0)); }
  function fillG(g, x0, x1, y0, y1, v = 1) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = v; }

  // ---------- Fase 1: fase original (tutorial) ----------
  const P1_TEMPLATE = 'TACCGGACCATT', P1_TARGET = 'ATGGCCTGGTAA';
  function buildLevel1() {
    const COLS = 110, g = emptyGrid(COLS);
    fillG(g, 0, COLS - 1, 12, 13);
    for (const [a, b] of [[16, 18], [30, 33], [52, 54], [66, 69], [88, 90]]) fillG(g, a, b, 12, 13, 0);
    fillG(g, 0, 0, 0, 11); fillG(g, COLS - 1, COLS - 1, 0, 11);
    for (const [x0, x1, y0, y1] of [[8, 12, 9, 9], [20, 24, 9, 9], [25, 28, 6, 6], [35, 39, 9, 9], [44, 44, 10, 11], [46, 50, 8, 8], [56, 60, 9, 9], [61, 63, 6, 6], [72, 76, 9, 9], [78, 80, 6, 6], [82, 85, 3, 3], [93, 97, 9, 9], [100, 101, 10, 11], [102, 103, 9, 11]]) fillG(g, x0, x1, y0, y1);
    return {
      COLS, grid: g, start: { x: 2 * T + 4, y: 12 * T - 30 }, goal: { x: 105 * T, y: 8 * T, w: 2 * T, h: 4 * T }, goalLabel: 'Telômero',
      phages: [[10, 8], [24, 11], [38, 11], [48, 7], [60, 11], [74, 8], [84, 11], [96, 11]],
      ros: [{ x0: 18, x1: 24, r: 6 }, { x0: 55, x1: 61, r: 5 }, { x0: 77, x1: 83, r: 8 }, { x0: 92, x1: 99, r: 6 }], inters: [],
      nucs: [[4, 10, 'A'], [6, 10, 'T'], [10, 7, 'G'], [12, 7, 'C'], [20, 10, 'G'], [22, 7, 'A'], [26, 4, 'G'], [27, 4, 'C'], [35, 7, 'C'], [37, 7, 'T'], [39, 7, 'C'], [42, 10, 'G'],
             [47, 6, 'T'], [49, 6, 'G'], [53, 9, 'A'], [57, 7, 'C'], [59, 7, 'G'], [62, 4, 'T'], [64, 10, 'A'], [72, 7, 'G'], [74, 7, 'T'], [76, 7, 'A'], [79, 4, 'A'], [80, 4, 'C'], [84, 2, 'G'], [86, 10, 'T'], [89, 9, 'A'],
             [93, 7, 'T'], [95, 7, 'A'], [97, 7, 'G'], [99, 10, 'C']],
      helicase: { x: 28 * T + 16, y: 5 * T + 16 }, checkpoints: [{ c: 41, label: 'G1/S' }, { c: 71, label: 'G2/M' }],
    };
  }
  const SONG_REPL = { bpm: 128, play(step, t, d) {
    const CH = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
    const bar = Math.floor(step / 8) % 4, s = step % 8, ch = CH[bar];
    if (s % 2 === 0) Sound.note(midi(ch[0] - 24), t, d * 1.6, 'triangle', 0.7);
    Sound.note(midi(ch[[0, 1, 2, 1, 2, 1, 0, 2][s]] + 12), t, d * 0.8, 'square', 0.16);
    if (s === 0 || s === 4) Sound.note(midi(ch[2] + 24), t, d * 1.5, 'sine', 0.1);
  } };

  PHASES.push(makePlatformer({
    target: P1_TARGET, template: P1_TEMPLATE, buildLevel: buildLevel1, completeMsg: 'Fita completa! Siga até o telômero →',
    phase: {
      title: 'Replicação', short: 'Tutorial: copie uma fita molde curta', song: SONG_REPL,
      controls: '<kbd>←</kbd><kbd>→</kbd> mover · <kbd>Espaço</kbd>/<kbd>↑</kbd> pular (segure para ir mais alto) · <kbd>E</kbd>/<kbd>↓</kbd> revisão 3\'→5\' · <kbd>R</kbd> reiniciar',
      touch: ['ArrowLeft', 'ArrowRight', 'Space', 'KeyE'],
      brief: () => `<p>Você é a <b>DNA polimerase</b>. Copie a fita molde mostrada no topo coletando os nucleotídeos <b>complementares</b> na ordem certa: <b class="bA">A</b>–<b class="bT">T</b> e <b class="bC">C</b>–<b class="bG">G</b>.</p>
        <p>Pegou a base errada? Ela vira uma mutação. Use a <b>revisão 3'→5'</b> para removê-la. Pise nos bacteriófagos, desvie das espécies reativas de oxigênio, pegue a helicase (pulo duplo) e chegue ao telômero.</p>`,
    },
    onFinish(r) {
      const got = r.strand.map(s => s.b).join('');
      const span = (s, ref) => s.split('').map((b, i) => `<span class="b b${b}${ref && b !== ref[i] ? ' bad' : ''}">${b}</span>`).join('');
      const exp = P1_TARGET.match(/.{3}/g), gc = got.match(/.{3}/g);
      let stopped = false; const prot = [];
      const rows = exp.map((ec, i) => {
        const g2 = gc[i], ea = codonAA(ec), ga = codonAA(g2);
        let eff;
        if (stopped) eff = '<span class="muted">não traduzido</span>';
        else if (g2 === ec) eff = '<span style="color:#81c784">Correto</span>';
        else if (ga === ea) eff = '<span style="color:#90caf9">Silenciosa</span>';

      }).join('');
      const wrong = got.split('').filter((b, i) => b !== P1_TARGET[i]).length;

        <table class="t"><tr><th>Esperado</th><th>Obtido</th><th>Efeito</th></tr>${rows}</table>
        <p>Proteína: <b>${prot.join('–') || '(nenhuma)'}</b>${stopped ? '' : ' <span class="muted">(sem códon de parada)</span>'}</p>
        <div class="stats"><span>Erros incorporados <b>${r.mutations}</b></span><span>Revisões <b>${r.corrected}</b></span><span>Danos <b>${r.hits}</b></span><span>Tempo <b>${Math.floor(r.elapsed / 60)}:${String(Math.floor(r.elapsed % 60)).padStart(2, '0')}</b></span></div>
        <p class="muted">Na próxima fase você replica um gene inteiro: o da luciferase.</p>`);
    },
  }));

  // ---------- Fase 2: o gene completo da luciferase (gerada por segmentos) ----------
  function buildLevel2() {
    const SEG = 7, N = CODING.length, START = 6, END = 12;
    const COLS = START + N * SEG + END;
    const g = emptyGrid(COLS);
    fillG(g, 0, COLS - 1, 12, 13);
    fillG(g, 0, 0, 0, 11); fillG(g, COLS - 1, COLS - 1, 0, 11);
    const nucs = [], phages = [], ros = [], inters = [], checkpoints = [];
    let helicase = null;
    const cpSegs = { 13: 'Origem 2', 26: 'Origem 3' };
    for (let i = 0; i < N; i++) {
      const x = START + i * SEG, need = CODING[i];
      const decoys = ['A', 'T', 'C', 'G'].filter(b => b !== need).sort(() => Math.random() - 0.5).slice(0, 2);
      const trio = [need, ...decoys].sort(() => Math.random() - 0.5);
      let type = pick(['A', 'B', 'C', 'D', 'E']);
      if (i < 2 || cpSegs[i]) type = 'A';
      if (i === 5) type = 'B';
      if (type === 'A') { trio.forEach((b, k) => nucs.push([x + 1 + k * 2, 10, b])); if (i > 2 && !cpSegs[i] && Math.random() < 0.35) phages.push([x + 3, 11]); if (i > 6 && Math.random() < 0.25) inters.push({ x0: x, x1: x + 6, r: 9 }); }
      if (type === 'B') {
        fillG(g, x + 1, x + 5, 9, 9);
        trio.forEach((b, k) => nucs.push([x + 1 + k * 2, 7, b]));
        if (i === 5) helicase = { x: (x + 3) * T + 16, y: 8 * T + 16 };
        else if (i > 3 && Math.random() < 0.3) ros.push({ x0: x, x1: x + 6, r: 5 });
        if (i > 2 && i !== 5 && Math.random() < 0.3) phages.push([x + 3, 11]);
      }
      if (type === 'C') {
        fillG(g, x + 2, x + 4, 12, 13, 0);
        const order = [[x + 1, 10], [x + 3, 9], [x + 5, 10]];
        trio.forEach((b, k) => nucs.push([order[k][0], order[k][1], b]));
        if (i > 6 && Math.random() < 0.3) inters.push({ x0: x, x1: x + 6, r: 7 });
      }
      if (type === 'D') {
        fillG(g, x + 3, x + 3, 10, 11);
        const order = [[x + 1, 10], [x + 3, 8], [x + 5, 10]];
        trio.forEach((b, k) => nucs.push([order[k][0], order[k][1], b]));
      }
      if (type === 'E') {
        fillG(g, x + 1, x + 2, 9, 9); fillG(g, x + 3, x + 5, 6, 6);
        const order = [[x + 1, 7], [x + 4, 4], [x + 6, 10]];
        trio.forEach((b, k) => nucs.push([order[k][0], order[k][1], b]));
        if (i > 4 && Math.random() < 0.3) ros.push({ x0: x, x1: x + 6, r: 8 });
      }
      if (cpSegs[i]) checkpoints.push({ c: x + 6, label: cpSegs[i] });
    }
    const gx = START + N * SEG + 6;
    return { COLS, grid: g, start: { x: 2 * T + 4, y: 12 * T - 30 }, goal: { x: gx * T, y: 8 * T, w: 2 * T, h: 4 * T }, goalLabel: 'Fim do gene',
             phages, ros, inters, nucs, helicase, checkpoints };
  }

  PHASES.push(makePlatformer({
    target: CODING, template: TEMPLATE, buildLevel: buildLevel2, intron: INTRON, completeMsg: 'Gene copiado! Siga até o fim →',
    bg: ['#1f1238', '#3a1a48'],
    phase: {
      title: 'O gene da luciferase', short: 'Replique um gene inteiro, com éxons e íntron', song: { ...SONG_REPL, bpm: 136 }, needs: null,
      controls: '<kbd>←</kbd><kbd>→</kbd> mover · <kbd>Espaço</kbd>/<kbd>↑</kbd> pular · <kbd>E</kbd>/<kbd>↓</kbd> revisão 3\'→5\' · <kbd>R</kbd> reiniciar',
      touch: ['ArrowLeft', 'ArrowRight', 'Space', 'KeyE'],
      brief: () => `<p>Agora o desafio é maior: replicar o gene inteiro da <b>luciferase</b>, a enzima que faz o vaga-lume brilhar. São <b>39 nucleotídeos</b>. A faixa clara no molde marca o <b>íntron</b>, um trecho que será removido do RNA na fase 5, mas que também precisa ser copiado no DNA.</p>
        <p><b>Novo inimigo: o agente intercalante.</b> É uma molécula plana que se encaixa entre os pares de bases. Se ela te tocar, uma <b>base extra</b> é inserida na fita nova e desloca a matriz de leitura (<i>frameshift</i>). A revisão (<kbd>E</kbd>) remove a inserção.</p>
        <p class="muted">Os erros que sobrarem seguem para a fase 3 (reparo do DNA).</p>`,
    },
    onFinish(r) {
      const strand = r.strand;
      let j = 0, html = '';

    PHASES.push({
      title: 'Reparo do DNA', short: 'Escolha a via certa para cada lesão', needs: 'dna2',

          if (shown && s.lesion === 'U') label('!', x + 12, y1 - 9, { font: '800 13px system-ui', color: '#ffeb3b' });

  // =====================================================================
  // FASE 4: TRANSCRIÇÃO (corredor de faixas)

        q = opts[0]; lane = q;

      if (b === need) Sound.tone(midi({ A: 72, U: 76, C: 79, G: 84 }[b]), 0.12, { type: 'triangle', vol: 0.22 });
      else { errors++; Sound.tone(220, 0.25, { type: 'sawtooth', vol: 0.12, slide: 0.7 }); floatMsg(`${b} não pareia com ${c.t}`, POLX + 60, LANES[q] - 30, '#ff8a80'); }
    }

      done = true;
      const pre = rna.join('');
      const dnaErr = dna !== CODING;

      },
      overlayKey(code, down) { if (step === 3 && code === 'Space') { pumping = down; return true; } return false; },
      pointer(x, y) { if (step === 4) { tx = x; ty = y; } },
      update(dt) {

        let dy = (held(['ArrowDown', 'KeyS']) ? 1 : 0) - (held(['ArrowUp', 'KeyW']) ? 1 : 0);
        if (dx || dy) { tx = null; } else if (tx != null) { const d = Math.hypot(tx - mx, ty - my); if (d > 6) { dx = (tx - mx) / d; dy = (ty - my) / d; } }
        const m = Math.hypot(dx, dy) || 1;
        mx += dx / m * 150 * dt; my += dy / m * 150 * dt;

          const a = Math.atan2(my - CY, mx - CX);

        }
        poreT -= dt;
        if (poreT <= 0) { poreT = 2.5; for (const p of pores) if (Math.random() < 0.4) p.open = !p.open; if (!pores.some(p => p.open)) pick(pores).open = true; }
        inv = Math.max(0, inv - dt);
        if (tail < 120) integ -= 3 * dt;
        for (const e of exos) {
          e.a += dt;

          const sp = 55 + (tail < 120 ? 15 : 0);
          e.x += (mx - e.x) / d * sp * dt + Math.cos(e.a * 1.7) * 20 * dt; e.y += (my - e.y) / d * sp * dt + Math.sin(e.a * 1.3) * 20 * dt;

        }

          showOverlay(`<h2>mRNA degradado</h2><p>O exossomo alcançou o mRNA antes da exportação. ${tail < 120 ? 'Uma cauda poli(A) curta deixa o RNA mais vulnerável.' : ''}</p><div class="btnrow"><button class="big" data-act="retryExport" data-primary>Tentar a exportação de novo (Enter)</button></div>`);
        }
      },
      render(dt) {
        const now = performance.now();
        ctx.fillStyle = '#1b2a3a'; ctx.fillRect(0, 0, W, H);
        // citoplasma com ribossomos ao fundo
        ctx.fillStyle = 'rgba(255,255,255,.06)'; for (let k = 0; k < 60; k++) { circle((k * 137) % W, (k * 71) % H, 2); ctx.fill(); }

        ctx.strokeStyle = '#9575cd'; ctx.lineWidth = 8; circle(CX, CY, R); ctx.stroke();
        ctx.strokeStyle = '#7e57c2'; ctx.lineWidth = 3; circle(CX, CY, R + 8); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 5;

          const x = CX + Math.cos(p.a) * (R + 4), y = CY + Math.sin(p.a) * (R + 4);

          ctx.fillStyle = p.open ? '#1b2a3a' : '#4e342e'; circle(x, y, p.open ? 6 : 4); ctx.fill();

          ctx.fillStyle = BASE_COLOR.A; for (let k = 0; k < Math.min(6, tail / 35); k++) { circle(mx + 30 + k * 5, my + Math.sin(now / 150 + k) * 3, 2.5); ctx.fill(); }
          ctx.fillStyle = 'rgba(128,222,234,.5)'; circle(mx - 6, my - 8, 6); ctx.fill(); circle(mx + 10, my + 8, 6); ctx.fill();
        }
        panel(10, 8, 250, 46);
        label(`Integridade do mRNA: ${Math.max(0, Math.round(integ))}%`, 22, 28, { font: '700 13px system-ui' });
        ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(22, 36, 220, 8, 4); ctx.fill();
        ctx.fillStyle = integ < 40 ? '#ef5350' : '#9ccc65'; rr(22, 36, 220 * Math.max(0, integ) / 100, 8, 4); ctx.fill();
        label('Leve o mRNA até um poro aberto (verde)', W - 14, 28, { font: '600 12px system-ui', align: 'right', color: '#a5d6a7' });
        drawFloats(dt);
      },
      debug: () => ({ step: () => step, pre: () => pre, sel: () => sel, setTail: v => { tail = v; }, mrnp: () => ({ mx, my }), setPos: (x, y) => { mx = x; my = y; }, pores: () => pores, exos: () => exos }),
    });
  })();

  // =====================================================================
  // FASE 6: TRADUÇÃO
  // =====================================================================
  (() => {
    const RNA_COMP = { A: 'U', U: 'A', C: 'G', G: 'C' };
    const AX = 470, PX = 400, MRNA_Y = 330, DOCK_Y = 214, CW = 70;
    let mrna, start, codons, ci, peptide, mis, items, curT, offset, offsetT, phase, initT, done, accepted, sinceCognate, epTRNA;

    const antiOf = codon => codon.split('').map(b => RNA_COMP[b]).join(''); // escrito 3'→5', alinhado ao códon
    const RNAB = ['A', 'U', 'C', 'G'];
    function makeItem(codon) {
      const aaNeed = codonAA(codon);
      const r = Math.random();
      if (aaNeed === '*') {
        if (r < 0.4 || sinceCognate >= 2) { sinceCognate = 0; return { rf: true }; }
      } else {
        if (r < 0.08) return { rf: true };

      }
      sinceCognate++;
      let c2;

      } else c2 = pick(RNAB) + pick(RNAB) + pick(RNAB);
      if (codonAA(c2) === '*' || codonAA(c2) === aaNeed) c2 = 'GGC'.split('').map((b, k) => k === 0 ? b : pick(RNAB)).join('');
      if (codonAA(c2) === '*') c2 = 'GCU';
      return { anti: antiOf(c2), aa: codonAA(c2) };
    }
    function setup() {
      mrna = getData.mrna();
      start = mrna.seq.indexOf('AUG');
      codons = [];
      if (start >= 0) for (let i = start; i + 3 <= mrna.seq.length; i += 3) codons.push(mrna.seq.slice(i, i + 3));
      ci = 1; peptide = start >= 0 ? ['M'] : []; mis = 0; accepted = 0; sinceCognate = 0; offset = 0; offsetT = 0; done = false; epTRNA = null;
      phase = 'init'; initT = 2.6; curT = null;
      if (start < 0) { phase = 'noaug'; initT = 2.5; }
    }
    function nextItem() {
      if (ci >= codons.length) { finish('nonstop'); return; }
      const it = makeItem(codons[ci]);
      const win = 2.4 - 1.0 * Math.min(1, ci / 10);
      curT = { ...it, x: W + 60, state: 'in', t: 0, win };
    }
    function accept() {
      if (!curT || curT.state === 'out' || phase !== 'run') return;
      if (curT.state === 'in' && curT.x > AX + 60) return;
      const codon = codons[ci], need = codonAA(codon);
      if (curT.rf) {
        if (need === '*') { Sound.arp([84, 79, 72], 0.1, { type: 'triangle', vol: 0.2 }); finish('stop'); }
        else { Sound.tone(150, 0.4, { type: 'square', vol: 0.15 }); floatMsg('Fator de liberação num códon de aminoácido: término prematuro!', W / 2, 120, '#ff8a80'); finish('premature'); }
        return;
      }
      peptide.push(curT.aa); accepted++;
      if (need === '*') { floatMsg(`Leitura através do stop: ${AA3[curT.aa]} adicionado`, W / 2, 120, '#ffb74d'); mis++; }
      else if (curT.aa !== need) { mis++; Sound.tone(220, 0.3, { type: 'sawtooth', vol: 0.12, slide: 0.7 }); floatMsg(`Erro: ${AA3[curT.aa]} no lugar de ${AA3[need]}`, W / 2, 120, '#ff8a80'); }
      else { Sound.tone(midi(72 + (ci % 5) * 2), 0.14, { type: 'triangle', vol: 0.22 }); Sound.tone(midi(79 + (ci % 5) * 2), 0.14, { type: 'sine', vol: 0.12, delay: 0.06 }); floatMsg(`Ligação peptídica: +${AA3[need]}`, W / 2, 120, '#9ccc65'); }
      epTRNA = { anti: curT.anti, aa: curT.aa, t: 0 };
      curT = null; ci++; offsetT = 0.35;

    }
    function reject() { if (curT && curT.state !== 'out' && phase === 'run') { curT.state = 'out'; Sound.tone(300, 0.05, { type: 'sine', vol: 0.06 }); } }

      const resultData = { seq: prot, stop: how === 'stop', nonstop: how === 'nonstop', premature: how === 'premature', mis };
      const howText = { stop: 'O fator de liberação reconheceu o códon de parada e a proteína foi liberada.', premature: 'O fator de liberação entrou num códon de aminoácido: a proteína saiu <b>truncada</b>.', nonstop: 'O ribossomo chegou ao fim do mRNA <b>sem códon de parada</b>. Na célula, a via de degradação <i>non-stop decay</i> destruiria esse produto.' }[how];
      setTimeout(() => {
        Sound.arp(prot === PROTEIN_OK && how === 'stop' ? [72, 76, 79, 84, 79, 84, 88] : [72, 75, 79, 78], 0.11, { type: 'square', vol: 0.14, dur: 0.2 });
        completePhase(5, `<h2>Tradução encerrada</h2>
          <p>${howText}</p>
          <div class="seq">Obtida&nbsp;&nbsp;&nbsp;${protHTML(prot, PROTEIN_OK)}<br>Esperada&nbsp;${protHTML(PROTEIN_OK)}</div>
          <div class="stats"><span>Aminoácidos <b>${prot.length}</b></span><span>Erros do ribossomo <b>${mis}</b></span><span>Proteína codificada por este mRNA <b>${ideal.protein.length ? ideal.protein.split('').map(a => AA3[a]).join('-') : '—'}</b></span></div>
          <p class="muted">${prot === PROTEIN_OK ? 'Proteína idêntica à luciferase correta!' : 'As diferenças podem vir de mutações no DNA, erros de transcrição, splicing incorreto ou erros do ribossomo. Agora a cadeia precisa se dobrar.'}</p>`,
          { protein: resultData, fold: null });
      }, 700);
    }

    function drawTRNA(x, y, anti, aa, opts = {}) {
      ctx.save(); ctx.globalAlpha = opts.alpha ?? 1;
      ctx.fillStyle = opts.rf ? '#78909c' : '#8d6e63';
      // corpo em "L" estilizado (folha de trevo)

      ctx.fillStyle = opts.rf ? '#90a4ae' : '#a1887f'; circle(x - 26, y - 16, 10); ctx.fill(); circle(x + 26, y - 16, 10); ctx.fill();

        label("3'", x - 38, y + 22, { font: '9px system-ui', color: '#d7ccc8' }); label("5'", x + 32, y + 22, { font: '9px system-ui', color: '#d7ccc8' });

    PHASES.push({
      title: 'Tradução', short: 'O ribossomo lê os códons e une aminoácidos', needs: 'mrna',
      controls: '<kbd>Espaço</kbd>/<kbd>↓</kbd> aceitar o tRNA no sítio A · <kbd>→</kbd> recusar · toque no tRNA para aceitar',
      touch: ['Space', 'ArrowRight'],
      song: { bpm: 112, play(step, t, d) { const ch = [[60, 64, 67], [62, 65, 69], [57, 60, 64], [59, 62, 67]][Math.floor(step / 8) % 4]; if (step % 2 === 0) Sound.note(midi(ch[0] - 12), t, d * 1.5, 'triangle', 0.5); if (step % 8 === 0 || step % 8 === 3 || step % 8 === 6) Sound.note(midi(ch[step % 3] + 12), t, d * 1.2, 'sine', 0.16); } },
      brief: () => `<p>No citoplasma, a subunidade menor do <b>ribossomo</b> se liga ao quepe 5' e percorre o mRNA até o primeiro <b>AUG</b>, onde o tRNA iniciador traz a metionina.</p>
        <p>Depois disso, cada <b>tRNA</b> que chega mostra seu <b>anticódon</b> (escrito 3'→5') e o aminoácido que carrega. Aceite só o tRNA cujo anticódon <b>pareia</b> com o códon do <b>sítio A</b> (A–U, C–G). Recuse os outros.</p>
        <p>No códon de parada (UAA, UAG ou UGA) não existe tRNA: espere o <b>fator de liberação</b> (eRF1). Aceitar o fator num códon comum encerra a proteína antes da hora.</p>`,
      start() { setup(); },
      key(code, down) { if (!down) return; if (code === 'Space' || code === 'ArrowDown' || code === 'KeyS') accept(); if (code === 'ArrowRight' || code === 'KeyD' || code === 'Backspace') reject(); },
      pointer(x, y) { if (curT && Math.abs(x - curT.x) < 50 && y > DOCK_Y - 80 && y < DOCK_Y + 40) accept(); },
      update(dt) {
        if (phase === 'init' || phase === 'noaug') {
          initT -= dt;
          if (initT <= 0) { if (phase === 'noaug') { finish('nonstop'); return; } phase = 'run'; nextItem(); }
          return;

        if (phase !== 'run' || done) return;

        if (!curT) return;

      },
      render(dt) {

        ctx.fillStyle = '#1b2a3a'; ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(149,117,205,.55)'; rr(PX - CW * 1.4, MRNA_Y + 34, CW * 2.9, 54, 26); ctx.fill();
        label('ribossomo', PX - CW * 1.4 + 10, MRNA_Y + 80, { font: '600 11px system-ui', color: '#d1c4e9' });

            const j = peptide.length - 1 - k;

        label(codon ? `Precisa do anticódon 3'-${antiOf(codon)}-5'${codonAA(codon) === '*' ? ' … é um STOP!' : ''}` : '', 22, 50, { font: '600 12px system-ui', color: '#a99bc0' });
        panel(W - 210, 8, 200, 54);
        label(`Aminoácidos: ${peptide.length}`, W - 196, 30, { font: '700 13px system-ui' });
        label(`Erros: ${mis}`, W - 196, 50, { font: '600 12px system-ui', color: mis ? '#ff8a80' : '#a99bc0' });
        if (phase === 'init') { panel(W / 2 - 250, H / 2 - 120, 500, 64, 0.92); label('A subunidade menor varre o mRNA a partir do quepe...', W / 2, H / 2 - 92, { font: '700 15px system-ui', align: 'center', color: '#ffd54f' }); label('AUG encontrado! O tRNA iniciador traz a metionina (Met).', W / 2, H / 2 - 70, { font: '13px system-ui', align: 'center' }); }
        if (phase === 'noaug') { panel(W / 2 - 220, H / 2 - 40, 440, 60, 0.92); label('Nenhum AUG encontrado: a tradução não começa.', W / 2, H / 2 - 4, { font: '700 15px system-ui', align: 'center', color: '#ff8a80' }); }
        drawFloats(dt);
      },
      debug: () => ({ cur: () => curT, ci: () => ci, codons: () => codons, phase: () => phase, accept, reject, peptide: () => peptide }),
    });
  })();

  // =====================================================================
  // FASE 7: DOBRAMENTO (modelo HP em rede quadrada)
  // =====================================================================

      brief: () => { const r = activityReport(); return `<p>Chegou a hora da verdade: a proteína funciona? A <b>luciferase</b> catalisa a reação <b>luciferina + ATP + O₂ → oxiluciferina + luz</b>. É assim que o vaga-lume brilha.</p>
        <p>Controle a enzima: capture uma <b style="color:#ffd54f">luciferina</b> e um <b style="color:#ef5350">ATP</b> (o O₂ está por toda parte) para produzir um flash de luz. Faça <b>${GOAL} reações</b> em ${TIME} s. Os <b style="color:#9e9e9e">inibidores competitivos</b> ocupam o sítio ativo e travam a enzima por um tempo.</p>
        <div class="flow"><div><b>Atividade da sua luciferase: ${Math.round(r.act * 100)}%</b> ${r.act >= 0.95 ? '(perfeita)' : '(afeta velocidade e alcance)'}</div><div>${r.notes.join(' · ')}</div><div>Cópias extras da enzima ajudando: <b>${r.copies}</b> (dependem da cauda poli(A) e da integridade do mRNA)</div></div>`; },
      start() { setup(); },
      pointer(x, y) { P.tx = x; P.ty = y; },
      update(dt) {
        if (done) return;
        timeLeft -= dt;
        if (timeLeft <= 0) { finish(false); return; }
        spawnT -= dt; if (spawnT <= 0 && mols.filter(m => !m.dead).length < 16) { spawnT = 0.5; spawn(); }
        for (const m of mols) { m.t += dt; m.x += (m.vx + Math.sin(m.t) * 15) * dt; m.y += (m.vy + Math.cos(m.t * 1.3) * 15) * dt; if (m.x < 20 || m.x > W - 20) m.vx *= -1; if (m.y < 80 || m.y > H - 20) m.vy *= -1; }
        mols = mols.filter(m => !m.dead);
        for (const E of [P, ...helpers]) {
          E.stun = Math.max(0, E.stun - dt); E.busy = Math.max(0, E.busy - dt);
          if (E.stun > 0 || E.busy > 0) continue;
          let dx = 0, dy = 0;
          if (E.ai) {
            const want = mols.filter(m => (m.type === 'lf' && !E.lf) || (m.type === 'atp' && !E.atp));
            let best = null, bd = 1e9; for (const m of want) { const d = Math.hypot(m.x - E.x, m.y - E.y); if (d < bd) { bd = d; best = m; } }
            if (best) { dx = best.x - E.x; dy = best.y - E.y; }
          } else {
            dx = (held(['ArrowRight', 'KeyD']) ? 1 : 0) - (held(['ArrowLeft', 'KeyA']) ? 1 : 0);
            dy = (held(['ArrowDown', 'KeyS']) ? 1 : 0) - (held(['ArrowUp', 'KeyW']) ? 1 : 0);
            if (dx || dy) E.tx = null; else if (E.tx != null) { const d = Math.hypot(E.tx - E.x, E.ty - E.y); if (d > 6) { dx = E.tx - E.x; dy = E.ty - E.y; } }
          }
          if (dx || dy) moveEnzyme(E, dx, dy, dt);
          bindCheck(E);
        }
        for (const f of flashes) f.t += dt;
        flashes = flashes.filter(f => f.t < 1);
      },
      render(dt) {
        const now = performance.now(), glow = light / GOAL;
        const g = ctx.createRadialGradient(W - 90, 70, 10, W - 90, 70, 500);
        g.addColorStop(0, `rgba(${Math.round(60 + 160 * glow)},${Math.round(70 + 160 * glow)},40,1)`); g.addColorStop(0.35, '#16263a'); g.addColorStop(1, '#0b1422');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        // vaga-lume
        const fx = W - 90, fy = 70;
        ctx.fillStyle = '#3e2723'; ctx.beginPath(); ctx.ellipse(fx - 24, fy, 26, 14, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(220,255,120,${0.25 + 0.75 * glow})`; ctx.beginPath(); ctx.ellipse(fx + 16, fy + 2, 22, 13, 0, 0, Math.PI * 2); ctx.fill();
        if (glow > 0.05) { ctx.fillStyle = `rgba(230,255,140,${0.25 * glow})`; circle(fx + 16, fy + 2, 40 + 40 * glow); ctx.fill(); }
        ctx.fillStyle = 'rgba(200,230,255,.35)'; ctx.beginPath(); ctx.ellipse(fx - 30, fy - 16, 18, 8, -0.4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(fx - 14, fy - 18, 18, 8, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#212121'; circle(fx - 50, fy - 2, 8); ctx.fill();
        for (const m of mols) {
          if (m.type === 'lf') { ctx.fillStyle = '#ffd54f'; ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + m.t * 0.3; ctx.lineTo(m.x + Math.cos(a) * 9, m.y + Math.sin(a) * 9); } ctx.closePath(); ctx.fill(); label('Lf', m.x, m.y + 1, { font: '700 8px system-ui', align: 'center', base: 'middle', color: '#3e2723' }); }
          else if (m.type === 'atp') { ctx.fillStyle = '#ef5350'; for (let k = 0; k < 3; k++) { circle(m.x - 8 + k * 8, m.y, 4.5); ctx.fill(); } label('ATP', m.x, m.y + 13, { font: '700 8px system-ui', align: 'center', color: '#ffcdd2' }); }
          else { ctx.fillStyle = '#9e9e9e'; rr(m.x - 8, m.y - 8, 16, 16, 4); ctx.fill(); label('✕', m.x, m.y + 1, { font: '700 10px system-ui', align: 'center', base: 'middle', color: '#424242' }); }
        }
        for (const f of flashes) { ctx.fillStyle = `rgba(230,255,140,${1 - f.t})`; circle(f.x, f.y, 10 + f.t * 60); ctx.fill(); }
        for (const E of [P, ...helpers]) {
          const s = E.ai ? 0.7 : 1;
          ctx.save(); ctx.translate(E.x, E.y); ctx.scale(s, s);
          ctx.fillStyle = E.stun > 0 ? '#9e9e9e' : '#4dd0e1'; ctx.beginPath(); ctx.arc(0, 0, 22, 0.6, Math.PI * 2 - 0.6); ctx.lineTo(4, 0); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#00838f'; for (let k = 0; k < 5; k++) { circle(-10 + (k % 3) * 8, -8 + Math.floor(k / 3) * 12, 3); ctx.fill(); }
          if (E.lf) { ctx.fillStyle = '#ffd54f'; circle(14, -4, 5); ctx.fill(); }
          if (E.atp) { ctx.fillStyle = '#ef5350'; circle(14, 6, 5); ctx.fill(); }
          if (E.busy > 0) { ctx.strokeStyle = '#e6ff8c'; ctx.lineWidth = 3; circle(0, 0, 27 + Math.sin(now / 60) * 2); ctx.stroke(); }
          ctx.restore();
          if (!E.ai) label('você', E.x, E.y + 36, { font: '600 10px system-ui', align: 'center', color: '#80deea' });
        }
        panel(10, 8, 330, 56);
        label(`Luz: ${light}/${GOAL} reações`, 22, 30, { font: '700 14px system-ui', color: '#e6ff8c' });
        ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(22, 40, 300, 10, 5); ctx.fill();
        ctx.fillStyle = '#e6ff8c'; rr(22, 40, 300 * glow, 10, 5); ctx.fill();
        panel(350, 8, 260, 56);
        label(`Tempo: ${Math.max(0, Math.ceil(timeLeft))} s`, 362, 30, { font: '700 14px system-ui' });
        label(`Atividade da enzima: ${Math.round(rep.act * 100)}%`, 362, 50, { font: '600 12px system-ui', color: rep.act > 0.7 ? '#9ccc65' : '#ffb74d' });
        drawFloats(dt);
      },
      debug: () => ({ P: () => P, mols: () => mols, light: () => light, setLight: v => { light = v; }, rep: () => rep }),
    });
  })();

  // =====================================================================
  // LAÇO PRINCIPAL
  // =====================================================================
  function drawIdle() {
    const now = performance.now();
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1f1238'); g.addColorStop(1, '#3a1a48');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let s = 0; s < 2; s++) {
      ctx.strokeStyle = s ? 'rgba(66,165,245,.35)' : 'rgba(239,83,80,.35)'; ctx.lineWidth = 4; ctx.beginPath();
      for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H / 2 + Math.sin(x / 50 + now / 900 + s * Math.PI) * 60);
      ctx.stroke();
    }
    for (let x = 0; x <= W; x += 25) {
      const y1 = H / 2 + Math.sin(x / 50 + now / 900) * 60, y2 = H / 2 + Math.sin(x / 50 + now / 900 + Math.PI) * 60;
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
    }
  }
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    try {
      if (cur) { const c = cur; c.update(dt); if (cur === c) c.render(dt); }
      else drawIdle();
    } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  showMenu();
  requestAnimationFrame(frame);
  window.__FM = { PHASES, get C() { return C; }, startPhase, getData, cur: () => cur, hpMaxContacts, activityReport, showMenu };


})();
</script>
