<!DOCTYPE html>

<head>

<style>
  :root { --bg:#120d14; --panel:#1f1622; --line:#3d2a42; --text:#f4eef6; --muted:#b39fbb; --warm:#ffd166; --accent:#5fe3a1; --red:#ff6b81; }
  * { box-sizing:border-box; } html, body { margin:0; }
  body { background:radial-gradient(900px 500px at 20% -10%, #3a1f3a, transparent 70%), var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height:100vh; }
  button { font:inherit; cursor:pointer; color:inherit; }
  .wrap { max-width:1280px; margin:0 auto; padding:10px 12px 30px; }
  header.top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { margin:0; font:900 26px/1 ui-rounded, system-ui; letter-spacing:.06em; } .brand h1 span { color:var(--warm); }
  .brand small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .ghost, .soundbtn { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; font-size:12px; }
  .ghost:hover, .soundbtn:hover { color:var(--text); border-color:#7a5684; }
  .backlink { color:var(--muted); text-decoration:none; font-size:13px; display:inline-block; margin-bottom:6px; } .backlink[hidden] { display:none; }
  .btn { background:#2d1f33; border:1px solid var(--line); border-radius:10px; padding:7px 14px; font-weight:700; font-size:13px; }
  .btn:hover:not(:disabled) { border-color:var(--warm); } .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.primary { background:var(--warm); color:#2b1d00; border-color:var(--warm); } .btn.big { font-size:16px; padding:10px 20px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  .meta { color:var(--muted); font-size:12.5px; }
  .hero { text-align:center; max-width:820px; margin:6px auto 14px; }
  .hero h2 { font:900 64px/1 ui-rounded, system-ui; margin:6px 0 0; color:var(--warm); text-shadow:0 4px 0 #6b2b3f; letter-spacing:.05em; }
  .hero .sub { color:var(--muted); margin:2px 0 10px; font-size:15px; }
  .stages { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
  .stc { text-align:left; background:linear-gradient(160deg, var(--a), #1f1622 70%); border:2px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:3px; min-height:130px; }
  .stc:hover:not(:disabled) { border-color:var(--warm); transform:translateY(-2px); } .stc:disabled { opacity:.45; cursor:not-allowed; }
  .stc .num { font:900 11px ui-monospace, monospace; color:var(--warm); letter-spacing:.12em; } .stc b { font-size:18px; } .stc .stx { margin-top:auto; font-size:12px; color:#e6d8ee; }
  .row2 { display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-top:14px; } @media (max-width:820px) { .row2 { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .panel h3 { margin:0 0 4px; font-size:15px; } .mem { float:right; color:var(--warm); }
  .shop { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:6px; margin-top:8px; }
  .si { display:flex; gap:8px; align-items:center; background:#18111b; border:1px solid var(--line); border-radius:10px; padding:6px 8px; } .si > div { flex:1; } .si .ic { font-size:22px; }
  .gamewrap { position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000; touch-action:none; user-select:none; -webkit-user-select:none; }
  .gamewrap canvas { display:block; width:100%; }
  .ctrl { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .modalbg { position:fixed; inset:0; background:rgba(8,4,10,.72); display:flex; align-items:center; justify-content:center; padding:14px; z-index:50; }
  .modal { background:#22172a; border:1px solid #5a3d63; border-radius:16px; max-width:620px; width:100%; max-height:92vh; overflow:auto; padding:18px 20px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .modal.wide { max-width:860px; } .modal h2 { margin:0 0 6px; font-size:22px; } .modal h3 { margin:12px 0 4px; font-size:15px; color:var(--warm); }
  .lus { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:8px; }
  .lu { position:relative; text-align:left; background:#2d1f33; border:2px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:4px; min-height:170px; }
  .lu:hover { border-color:var(--warm); transform:translateY(-2px); } .lu.new { border-color:#5fe3a1; }
  .lu .li { font-size:34px; } .lu b { font-size:16px; } .lu .lvl { font-size:12px; color:var(--warm); font-weight:800; } .lu .key { position:absolute; top:8px; right:10px; font:800 12px ui-monospace, monospace; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .lesson { background:#1a1220; border-left:4px solid var(--warm); border-radius:8px; padding:8px 12px; margin:10px 0; } .lesson b.t { color:var(--warm); }
  .dbar { display:grid; grid-template-columns:220px 1fr 50px; gap:8px; align-items:center; font-size:13px; margin:3px 0; }
  .dbar .bb { height:10px; background:#120d14; border-radius:5px; overflow:hidden; } .dbar .bb i { display:block; height:100%; }
  .memg { font-weight:800; color:var(--warm); }
  .cdx { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:6px; }
  .ce { display:flex; gap:8px; align-items:flex-start; background:#18111b; border:1px solid var(--line); border-radius:10px; padding:6px 8px; font-size:13px; } .ce.lock { opacity:.5; }
  .ce .q { width:56px; text-align:center; font-size:28px; flex:none; } .ce canvas { flex:none; } .tag { font-size:10px; background:var(--red); color:#fff; border-radius:5px; padding:0 5px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#22172a; border:1px solid var(--warm); border-radius:12px; padding:7px 14px; z-index:60; box-shadow:0 8px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" id="backlink" href="../" hidden>← Todos os jogos</a>
  <header class="top">
    <div class="brand"><svg width="40" height="40" viewBox="-20 -20 40 40" aria-hidden="true"><path d="M-15 0 C -15 -12, -4 -16, 5 -14 C 14 -12, 18 -3, 16 6 C 14 15, 0 17, -8 13 C -14 10, -15 6, -15 0 Z" fill="#cfe9ff" stroke="#4b7ea8" stroke-width="2.5"/><ellipse cx="-3" cy="0" rx="6" ry="4.5" fill="#7b5ea7"/><circle cx="9" cy="-6" r="3" fill="#f5b041"/><circle cx="7" cy="6" r="2.5" fill="#e8c547"/></svg>
      <div><h1>GULP<span>!</span></h1><small>a jornada de um macrófago</small></div></div>
    <button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button>
  </header>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  // Versão com instrumentos "orquestrais" simples: harpa, cordas, coro, flauta, tímpano e reverb.
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    let C = null, BUS = null; // contexto e barramento usados pelas vozes da música (trocados na renderização offline)
    try { muted = localStorage.getItem('gulp-mudo') === '1'; } catch (e) {}
    function makeReverb(ctx, secs = 3.2, decay = 2.6) {
      const len = Math.floor(ctx.sampleRate * secs), buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
      const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
    }
    function makeBus(ctx, dest, vol) {
      const bus = ctx.createGain(); bus.gain.value = vol;
      const dry = ctx.createGain(); dry.gain.value = .78;
      const wet = ctx.createGain(); wet.gain.value = .42;
      const rv = makeReverb(ctx);
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 45;
      bus.connect(hp); hp.connect(dry); hp.connect(rv); rv.connect(wet); dry.connect(comp); wet.connect(comp); comp.connect(dest);
      return bus;
    }
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = makeBus(ac, master, .5);
          C = ac; BUS = musicBus;
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = C.createOscillator(), g = C.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(BUS); osc.start(time); osc.stop(time + dur + 0.03);
    }
    // voz genérica com envelope ADSR simples, vários osciladores desafinados, filtro, vibrato e pan
    function voice(freq, t, dur, o = {}) {
      const a = o.a ?? .02, r = o.r ?? .3, vol = o.vol ?? .2, end = t + dur + r;
      const g = C.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
      if (o.decay) g.gain.exponentialRampToValueAtTime(Math.max(.0001, vol * (o.sustain ?? .0005)), t + o.decay);
      else { g.gain.setValueAtTime(vol, t + Math.max(a, dur)); }
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      let out = g;
      if (o.lp) { const f = C.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q ?? .7; g.connect(f); out = f; }
      if (o.formant) { const f2 = C.createBiquadFilter(); f2.type = 'peaking'; f2.frequency.value = o.formant; f2.gain.value = 9; f2.Q.value = 1.4; out.connect(f2); out = f2; }
      if (C.createStereoPanner && o.pan) { const p = C.createStereoPanner(); p.pan.value = o.pan; out.connect(p); out = p; }
      out.connect(BUS);
      let lfo = null;
      if (o.vib) { lfo = C.createOscillator(); lfo.frequency.value = o.vib[0]; const lg = C.createGain(); lg.gain.value = freq * (Math.pow(2, o.vib[1] / 1200) - 1); lfo.connect(lg); lfo._g = lg; lfo.start(t); lfo.stop(end + .05); }
      for (const det of (o.det || [0])) {
        const osc = C.createOscillator(); osc.type = o.wave || 'sine'; osc.frequency.value = freq; osc.detune.value = det;
        if (o.drop) { osc.frequency.setValueAtTime(freq * o.drop, t); osc.frequency.exponentialRampToValueAtTime(freq, t + .06); }
        if (lfo) lfo._g.connect(osc.frequency);
        osc.connect(g); osc.start(t); osc.stop(end + .05);
      }
    }
    const INST = {
      harp:    (f, t, d, v = .16, pan = -.25) => { voice(f, t, d, { wave: 'triangle', a: .004, decay: 1.6, r: .4, vol: v, lp: 5000, pan }); voice(f * 2, t, d, { wave: 'sine', a: .003, decay: .5, r: .2, vol: v * .25, pan }); },
      strings: (f, t, d, v = .05, pan = 0) => voice(f, t, d, { wave: 'sawtooth', det: [-7, 0, 6], a: .45, r: .9, vol: v, lp: 2600, vib: [5, 4], pan }),
      choir:   (f, t, d, v = .045, pan = 0) => voice(f, t, d, { wave: 'sawtooth', det: [-9, 0, 8], a: .32, r: .8, vol: v, lp: 2200, formant: 820, vib: [5.2, 7], pan }),
      flute:   (f, t, d, v = .13, pan = .2) => { voice(f, t, d, { wave: 'sine', a: .07, r: .35, vol: v, vib: [5, 9], pan }); voice(f * 2, t, d, { wave: 'sine', a: .1, r: .3, vol: v * .12, pan }); },
      horn:    (f, t, d, v = .06, pan = .1) => voice(f, t, d, { wave: 'sawtooth', det: [-4, 4], a: .09, r: .45, vol: v, lp: 1100, vib: [4.5, 5], pan }),
      bass:    (f, t, d, v = .1) => voice(f, t, d, { wave: 'triangle', a: .05, r: .6, vol: v, lp: 500 }),
      timp:    (f, t, v = .32) => { voice(f, t, .05, { wave: 'sine', a: .003, decay: 1.1, r: .3, vol: v, drop: 1.5 }); voice(f * 1.5, t, .05, { wave: 'sine', a: .003, decay: .4, r: .1, vol: v * .25 }); },
      roll:    (f, t, len, v = .1) => { for (let i = 0; i < len / .07; i++) voice(f, t + i * .07, .03, { wave: 'sine', a: .003, decay: .25, r: .05, vol: v * (0.3 + 0.7 * i * .07 / len), drop: 1.2 }); },
    };
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.25) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);
    }
    // renderiza uma música fora do tempo real (usado para gerar a prévia em áudio)
    async function render(s, secs) {
      const oc = new OfflineAudioContext(2, Math.ceil(44100 * secs), 44100);
      const pc = C, pb = BUS; C = oc; BUS = makeBus(oc, oc.destination, .5);
      const sd = 60 / s.bpm / 2; let tt = .05, st = 0;
      while (tt < secs - 1) { s.play(st, tt, sd); st++; tt += sd; }
      C = pc; BUS = pb;
      return oc.startRendering();
    }
    function toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.5;
      try { localStorage.setItem('gulp-mudo', muted ? '1' : '0'); } catch (e) {}
      updateSoundButton();
      return muted;
    }
    return { ensure, tone, noise, arp, note, voice, INST, music, render, toggle, get muted() { return muted; } };
  })();
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundButton() { if (soundBtn) { soundBtn.textContent = Sound.muted ? '🔇 Som desligado (M)' : '🔊 Som ligado (M)'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } }
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.ensure(); Sound.toggle(); soundBtn.blur(); });
  updateSoundButton();
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { Sound.ensure(); Sound.toggle(); } });
  // links "todos os jogos" só aparecem no site publicado
  for (const a of document.querySelectorAll('.backlink')) if (!/github\.io$/.test(location.hostname)) a.hidden = true;

  // =====================================================================
  // DADOS: armas (mecanismos imunes), passivas, patógenos, fases, lições
  // =====================================================================
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  const lerp = (a, b, t) => a + (b - a) * t;

  // cada arma tem 5 níveis; L(n) devolve os parâmetros do nível n (1..5)
  const WEAPONS = {
    fago: { n: 'Fagocitose', i: '🫧', col: '#ffd166', d: 'Pseudópodes engolem os patógenos mais próximos. Bactérias encapsuladas escapam, a não ser que estejam opsonizadas.',
      L: n => ({ cd: [.8, .72, .64, .56, .48][n - 1], dmg: [14, 18, 22, 27, 32][n - 1], r: [90, 98, 106, 115, 125][n - 1], cnt: [2, 3, 3, 4, 5][n - 1] }),
      up: ['', '+1 alvo, mais dano', 'mais rápido e alcance maior', '+1 alvo', '+1 alvo, muito mais rápido'] },
    ros: { n: 'Explosão respiratória', i: '💥', col: '#ff8fab', d: 'A NADPH oxidase produz espécies reativas de oxigênio: uma aura que fere tudo o que chega perto.',
      L: n => ({ cd: .5, dmg: [5, 6, 8, 10, 13][n - 1], r: [70, 82, 95, 110, 128][n - 1] }),
      up: ['', 'aura maior', 'mais dano', 'aura maior', 'aura enorme e mais forte'] },
    lisozima: { n: 'Lisozima', i: '🧪', col: '#9be7ff', d: 'Enzima que quebra o peptidoglicano da parede bacteriana. Um jato em leque; dano dobrado contra Gram-positivas.',
      L: n => ({ cd: [1.3, 1.2, 1.05, .95, .85][n - 1], dmg: [16, 20, 25, 30, 36][n - 1], r: [140, 150, 165, 180, 200][n - 1], arc: [.7, .8, .9, 1.05, 1.2][n - 1] }),
      up: ['', 'mais dano', 'leque mais largo', 'mais alcance', 'mais rápido e mais forte'] },
    complemento: { n: 'Complemento (MAC)', i: '🗡️', col: '#c3a6ff', d: 'Proteínas do soro formam o complexo de ataque à membrana, que perfura os patógenos em linha. O C3b deixa os atingidos opsonizados.',
      L: n => ({ cd: [1.6, 1.45, 1.3, 1.15, 1.0][n - 1], dmg: [20, 24, 28, 34, 40][n - 1], pierce: [2, 3, 3, 4, 6][n - 1], cnt: [1, 1, 2, 2, 3][n - 1], spd: 420 }),
      up: ['', 'atravessa mais alvos', '+1 lança', 'mais dano', '+1 lança, atravessa tudo'] },
    neutro: { n: 'Neutrófilos', i: '🔵', col: '#7fb8ff', d: 'Você libera quimiocinas e chama neutrófilos do sangue. Eles caçam sozinhos e, ao morrer, soltam redes de DNA (NETs) que prendem os patógenos.',
      L: n => ({ cd: [7, 6.5, 6, 5.5, 5][n - 1], cnt: [1, 2, 2, 3, 4][n - 1], dmg: [14, 16, 20, 24, 28][n - 1], life: [7, 8, 8, 9, 10][n - 1] }),
      up: ['', '+1 neutrófilo', 'mais dano', '+1 neutrófilo', '+1 neutrófilo, vivem mais'] },
    anticorpo: { n: 'Anticorpos (IgG)', i: '🔱', col: '#ffe08a', d: 'Projéteis que perseguem o alvo. Opsonizam (a fagocitose ganha +60% de dano e engole encapsuladas) e neutralizam vírus (dano dobrado).',
      L: n => ({ cd: [1.4, 1.3, 1.2, 1.05, .9][n - 1], dmg: [9, 11, 13, 15, 18][n - 1], cnt: [2, 3, 3, 4, 6][n - 1], spd: 300 }),

    const b = prog.best[st.id] || { t: 0, clear: false };
    prog.best[st.id] = { t: Math.max(b.t, G.t), clear: b.clear || won };
    if (won && st.id === prog.unlocked && st.id < STAGES.length) prog.unlocked = st.id + 1;
    saveProg();
    won ? sfx.win() : sfx.lose();
    const tot = Object.values(G.dmgBy).reduce((a, b) => a + b, 0) || 1;
    const rows = Object.entries(G.dmgBy).filter(([k]) => WEAPONS[k]).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="dbar"><span>${WEAPONS[k].i} ${WEAPONS[k].n}</span><span class="bb"><i style="width:${(v / tot * 100).toFixed(1)}%;background:${WEAPONS[k].col}"></i></span><span class="meta">${Math.round(v / tot * 100)}%</span></div>`).join('');
    const mm = Math.floor(G.t / 60), ss = Math.floor(G.t % 60);
    openModal(`<h2>${won ? `✅ ${st.n}: infecção controlada!` : '💀 O macrófago caiu'}</h2>
      <p>${won ? st.outro : 'Macrófagos morrem aos montes numa infecção: o pus é feito, em boa parte, de células de defesa mortas. Outros virão no seu lugar, e mais preparados.'}</p>
      <p class="meta">Tempo: ${mm}:${String(ss).padStart(2, '0')} · nível ${G.lvl} · ${G.kills} patógenos eliminados${G.cured ? ` · ${G.cured} células curadas pelo interferon` : ''}${G.killedCells ? ` · ${G.killedCells} células infectadas eliminadas pelos linfócitos T` : ''}</p>
      <h3>Quem fez o trabalho</h3>${rows || '<p class="meta">—</p>'}
      <p class="memg">🧠 +${earned} pontos de memória imunológica</p>
      ${won && st.id === STAGES.length ? lessonBox(...CODEX_EXTRA.memoria) : ''}
      <div class="btns">${won && st.id < STAGES.length ? `<button class="btn primary big" data-act="stage" data-v="${st.id + 1}">Próxima fase →</button>` : ''}<button class="btn ${won ? '' : 'primary'}" data-act="stage" data-v="${st.id}">↻ Jogar de novo</button><button class="btn" data-act="menu">Menu</button></div>`, true);
    screen = 'over';
  }
  function pauseMenu() {
    paused = true;
    openModal(`<h2>⏸ Pausa</h2>
      <h3>Armas</h3>${Object.entries(G.wep).map(([k, lv]) => `<p>${WEAPONS[k].i} <b>${WEAPONS[k].n}</b> (nível ${lv}): <span class="meta">${WEAPONS[k].d}</span></p>`).join('')}
      ${Object.keys(G.pas).length ? `<h3>Passivas</h3>${Object.entries(G.pas).map(([k, lv]) => `<p>${PASSIVES[k].i} <b>${PASSIVES[k].n}</b> (nível ${lv}): <span class="meta">${PASSIVES[k].d}</span></p>`).join('')}` : ''}
      <div class="btns"><button class="btn primary" data-act="resume">Continuar</button><button class="btn" data-act="quit">Desistir</button></div>`, true);
  }

  // ---------------- laço ----------------
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (ts - lastT) / 1000 || 0); lastT = ts;
    if (screen !== 'play' || !G) return;
    if (!paused && !modalOpen) {
      let ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
      if (joy.on) { ix = joy.dx; iy = joy.dy; }
      step(dt, { x: ix, y: iy });
      if (G.newCodex) { toast(`📖 Novo na Imunopédia: <b>${(ENEMIES[G.newCodex] || BOSSES[G.newCodex]).n}</b>`); G.newCodex = null; }
      if (G.ended) { render(dt); endRun(); return; }
      if (G.pending > 0) levelUp();
    }
    render(dt);
  }
  function toast(h) { const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = h; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

  // ---------------- entrada ----------------
  function bindJoy() {
    CV.addEventListener('pointerdown', e => { wake(); const r = CV.getBoundingClientRect(); joy.on = true; joy.id = e.pointerId; joy.ox = e.clientX - r.left; joy.oy = e.clientY - r.top; joy.dx = joy.dy = 0; CV.setPointerCapture(e.pointerId); });
    CV.addEventListener('pointermove', e => { if (!joy.on || e.pointerId !== joy.id) return; const r = CV.getBoundingClientRect(), dx = e.clientX - r.left - joy.ox, dy = e.clientY - r.top - joy.oy, d = Math.hypot(dx, dy); const m = Math.min(1, d / 40); joy.dx = d ? dx / d * m : 0; joy.dy = d ? dy / d * m : 0; });
    const up = e => { if (e.pointerId === joy.id) { joy.on = false; joy.dx = joy.dy = 0; } };
    CV.addEventListener('pointerup', up); CV.addEventListener('pointercancel', up);
  }
  const KM = { KeyW: 'u', ArrowUp: 'u', KeyS: 'd', ArrowDown: 'd', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };
  addEventListener('keydown', e => {
    if (KM[e.code]) { keys[KM[e.code]] = true; if (screen === 'play') e.preventDefault(); wake(); }
    if (screen === 'play' && (e.code === 'Escape' || e.code === 'KeyP')) { if (curChoices) return; if (paused) { paused = false; closeModal(); } else if (!modalOpen) pauseMenu(); }
    if (curChoices && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) pickChoice(+e.code.slice(-1) - 1);
  });
  addEventListener('keyup', e => { if (KM[e.code]) keys[KM[e.code]] = false; });
  addEventListener('blur', () => { keys = {}; if (screen === 'play' && !modalOpen) pauseMenu(); });
  addEventListener('resize', resize);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    wake();
    const a = b.dataset.act, v = b.dataset.v;
    switch (a) {
      case 'stage': closeModal(); startStage(+v); break;
      case 'go': closeModal(); setMusic(SONG_RUN); break;
      case 'menu': closeModal(); renderMenu(); break;
      case 'close': closeModal(); break;
      case 'help': help(); break;
      case 'codex': codex(); break;
      case 'buy': { const M = META[v], l = metaLv(v), c = M.cost(l); if (l < M.max && prog.mem >= c) { prog.mem -= c; prog.meta[v] = l + 1; saveProg(); sfx.pick(); renderMenu(); } break; }
      case 'choose': pickChoice(+v); break;
      case 'reroll': if (G.rerolls > 0) { G.rerolls--; closeModal(); curChoices = null; levelUp(); } break;
      case 'pause': if (!modalOpen) pauseMenu(); break;
      case 'resume': paused = false; closeModal(); break;
      case 'quit': paused = false; closeModal(); G.ended = true; G.cleared = false; endRun(); break;
    }
  });
  window.__G = { sim(sec, pickRandom) { for (let i = 0; i < sec * 30 && !G.ended; i++) { const p = G.p; let vx = 0, vy = 0, near = null, nd = 1e9; for (const e of G.en) { const dx = p.x - e.x, dy = p.y - e.y, d2 = dx * dx + dy * dy; if (d2 < nd) { nd = d2; near = e; } const R = 55 + e.r; if (d2 < R * R) { const w = 1 / Math.max(Math.sqrt(d2), 5); vx += dx * w; vy += dy * w; } } let ix = vx * 3, iy = vy * 3; if (near && Math.hypot(ix, iy) < .3) { const d = Math.sqrt(nd), dx = near.x - p.x, dy = near.y - p.y; if (d > 85) { ix += dx / d; iy += dy / d; } } else if (!near) { let gx = 0, gy = 0, gb = 1e9; for (const g of G.gems) { const d2 = dist2(g, p); if (d2 < gb) { gb = d2; gx = g.x - p.x; gy = g.y - p.y; } } const gl = Math.hypot(gx, gy) || 1; ix += gx / gl; iy += gy / gl; } step(1 / 30, { x: ix, y: iy }); while (G.pending > 0) { const c = choices(); applyChoice(pickRandom ? pick(c) : c[0]); } } return { t: G.t, lvl: G.lvl, kills: G.kills, hp: G.p.hp, en: G.en.length, ended: G.ended, cleared: G.cleared, wep: G.wep, pas: G.pas, boss: G.boss && Math.round(G.boss.hp) }; }, get G() { return G; }, startStage, get prog() { return prog; }, pickChoice, get choices() { return curChoices; } };
  renderMenu();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
