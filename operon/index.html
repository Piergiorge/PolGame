<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operon — seja a E. coli</title>
<style>
  :root { --bg:#061a20; --panel:#0d2a33; --line:#1d4753; --text:#e8f4f2; --muted:#8db2b6; --warm:#ffd166; --accent:#7bd389; --red:#ff6b6b; --glc:#ffc43c; --lac:#f2f7ff; --trp:#d07bff; --blue:#6fb7ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:radial-gradient(1100px 520px at 15% -10%, #0e3a46, transparent 70%), var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height:100vh; }
  button { font:inherit; cursor:pointer; }
  .wrap { max-width:1320px; margin:0 auto; padding:10px 12px 40px; }
  header.top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 14px; margin-bottom:8px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { margin:0; font:900 24px/1 ui-monospace, Menlo, monospace; letter-spacing:.18em; }
  .brand h1 span { color:var(--accent); }
  .brand small { display:block; color:var(--muted); font-size:12px; margin-top:3px; letter-spacing:.02em; }

  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:13px; white-space:nowrap; }
  .pill b { color:var(--warm); }
  .pill.big { font-size:15px; padding:4px 13px; }
  .ghost, .soundbtn { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:3px 9px; font-size:12px; }
  .ghost:hover:not(:disabled), .soundbtn:hover { color:var(--text); border-color:#3d8a99; }
  .ghost.on { color:var(--warm); border-color:var(--warm); }
  .backlink { color:var(--muted); text-decoration:none; font-size:13px; display:inline-block; margin-bottom:6px; }
  .backlink:hover { color:#fff; } .backlink[hidden] { display:none; }
  .btn { background:#164452; border:1px solid var(--line); color:var(--text); border-radius:9px; padding:6px 13px; font-weight:650; font-size:13px; }
  .btn:hover:not(:disabled) { border-color:var(--accent); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.primary { background:var(--accent); color:#0b2a17; border-color:var(--accent); }
  .btn.warm { background:var(--warm); color:#2c2100; border-color:var(--warm); }

  .layout { display:grid; grid-template-columns:minmax(0, 1fr) 320px; gap:12px; align-items:start; }
  @media (max-width:980px) { .layout { grid-template-columns:minmax(0, 1fr); } }
  .arena { position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#081f27; touch-action:none; }
  .arena canvas { display:block; width:100%; height:auto; cursor:crosshair; }
  .arena .banner { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:rgba(6,26,32,.88); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-weight:700; font-size:14px; pointer-events:none; white-space:nowrap; transition:opacity .4s; }
  .arena .sensor { position:absolute; left:10px; bottom:10px; background:rgba(6,26,32,.8); border:1px solid var(--line); border-radius:10px; padding:5px 9px; font-size:12px; pointer-events:none; }
  .arena .sensor b { display:inline-block; min-width:30px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .panel h3 { margin:0 0 6px; font:800 15px system-ui; letter-spacing:.02em; }
  .side { display:flex; flex-direction:column; gap:10px; }
  .opwrap { display:grid; grid-template-columns:minmax(0, 1fr) 230px; gap:10px; margin-top:10px; align-items:stretch; }
  @media (max-width:760px) { .opwrap { grid-template-columns:1fr; } }
  svg.ops { display:block; width:100%; height:auto; }
  svg.ops .dna { stroke:#9ccdd6; stroke-width:5; stroke-linecap:round; opacity:.55; }
  svg.ops .gl { font:800 12.5px system-ui; fill:#0a1d24; text-anchor:middle; }
  svg.ops .pl { font:800 9.5px system-ui; fill:#fff; text-anchor:middle; paint-order:stroke; stroke:rgba(0,0,0,.45); stroke-width:2; }
  svg.ops .oh { font:800 13px ui-monospace, monospace; fill:#cfe8ea; letter-spacing:.08em; }
  svg.ops .miss { font:italic 700 11px system-ui; fill:#7fa7b0; text-anchor:middle; }
  svg.ops .tiny { font:10px system-ui; fill:#7fa7b0; text-anchor:middle; }
  svg.ops .mrna { fill:none; stroke:#ffcf5c; stroke-width:2.5; stroke-linejoin:round; }
  svg.ops .ribo { fill:#c9a27a; stroke:#4a3420; stroke-width:1.2; }
  .ctl { display:flex; flex-direction:column; gap:8px; }
  .ctlbox { background:#0a2129; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .ctlbox h4 { margin:0 0 4px; font:800 13px ui-monospace, monospace; letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; }
  .switch { width:100%; border-radius:10px; padding:7px 10px; font-weight:800; border:2px solid; }
  .switch.on { background:#1f6b3c; border-color:var(--accent); color:#fff; }
  .switch.off { background:#3b1b1b; border-color:#a14a4a; color:#ffc9c9; }
  .auto { font-size:11px; background:#173f4c; border-radius:6px; padding:1px 7px; color:var(--accent); font-weight:700; }
  .rd { display:grid; grid-template-columns:auto 1fr auto; gap:2px 6px; align-items:center; font-size:12px; }
  .rd .b { height:7px; background:#08181e; border-radius:4px; overflow:hidden; }
  .rd .b i { display:block; height:100%; border-radius:4px; transition:width .2s; }
  .rd .v { font-variant-numeric:tabular-nums; color:var(--muted); min-width:34px; text-align:right; }
  .vit .rd { font-size:13px; gap:4px 8px; } .vit .rd .b { height:10px; }
  .score { display:flex; flex-direction:column; gap:3px; }
  .score .r { display:flex; align-items:center; gap:6px; font-size:13px; }
  .score .r.me { font-weight:800; }
  .score .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .score .r .n { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .alert { border:2px solid #ff8a8a; background:#3a1616; border-radius:12px; padding:10px; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 4px rgba(255,107,107,.25); } }
  .alert h4 { margin:0 0 4px; }
  canvas.chart { width:100%; height:auto; display:block; border-radius:8px; }
  .legend { display:flex; flex-wrap:wrap; gap:2px 10px; font-size:11px; color:var(--muted); margin-top:4px; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:3px; border-radius:2px; }
  /* menu */
  .hero { text-align:center; padding:16px 0 8px; }
  .hero h2 { font:900 46px/1 ui-monospace, monospace; letter-spacing:.2em; margin:0; color:var(--accent); text-shadow:0 3px 0 #0b3a24; }
  .hero p { color:var(--muted); max-width:720px; margin:10px auto; }
  .levels { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:10px; margin-top:12px; }
  .lv { text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; color:var(--text); display:flex; flex-direction:column; gap:3px; min-height:120px; }
  .lv:hover:not(:disabled) { border-color:var(--accent); transform:translateY(-1px); }
  .lv:disabled { opacity:.45; cursor:not-allowed; }
  .lv .num { font:900 12px ui-monospace, monospace; color:var(--accent); letter-spacing:.1em; }
  .lv .t { font-weight:800; font-size:16px; }
  .lv .stars { color:var(--warm); letter-spacing:2px; margin-top:auto; }
  /* modal */
  .modalbg { position:fixed; inset:0; background:rgba(2,10,14,.66); display:flex; align-items:center; justify-content:center; padding:14px; z-index:50; }
  .modal { background:#0f2f39; border:1px solid #2f6573; border-radius:16px; max-width:720px; width:100%; max-height:92vh; overflow:auto; padding:18px 20px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal h2 { margin:0 0 6px; font:800 22px system-ui; }
  .modal h3 { margin:12px 0 4px; font:800 15px system-ui; }
  .modal p { margin:6px 0; }
  .lesson { background:#0a2730; border-left:4px solid var(--accent); border-radius:8px; padding:8px 12px; margin:10px 0; }
  .lesson b.t { color:var(--accent); }
  table.t { border-collapse:collapse; width:100%; font-size:13px; margin:6px 0; }
  table.t th, table.t td { border-bottom:1px solid #24525f; padding:4px 6px; text-align:left; }
  table.t th { color:var(--muted); font-weight:700; font-size:12px; }
  .bar2 { display:inline-block; width:60px; height:8px; background:#08181e; border-radius:4px; overflow:hidden; vertical-align:middle; margin-right:5px; }
  .bar2 i { display:block; height:100%; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:6px; }
  .opt { text-align:left; background:#13414e; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:7px 10px; }
  .opt:hover:not(:disabled) { border-color:var(--warm); }
  .opt:disabled { opacity:.35; text-decoration:line-through; }
  .opt b { display:block; }
  .tests { display:flex; flex-wrap:wrap; gap:5px; }
  .fb { border-radius:10px; padding:8px 12px; margin:8px 0; }
  .fb.ok { background:#163d27; border:1px solid var(--accent); }
  .fb.no { background:#3d1b1b; border:1px solid #ff8a8a; }
  .starsbig { font-size:34px; color:var(--warm); letter-spacing:6px; text-align:center; }
  .toast { position:fixed; right:14px; bottom:14px; background:#0f2f39; border:1px solid #2f6573; border-radius:12px; padding:8px 14px; z-index:40; box-shadow:0 8px 30px rgba(0,0,0,.4); max-width:340px; animation:tin .3s; }
  @keyframes tin { from { transform:translateY(20px); opacity:0; } }
  kbd { background:#08181e; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" id="backlink" href="../" hidden>← Todos os jogos</a>
  <header class="top">
    <div class="brand"><svg width="40" height="40" viewBox="-20 -20 40 40" aria-hidden="true"><rect x="-17" y="-8" width="34" height="16" rx="8" fill="#c8f7a0" stroke="#0d2a33" stroke-width="2"/><circle cx="-6" cy="0" r="2" fill="#ff9a1f"/><circle cx="0" cy="0" r="2" fill="#ff9a1f"/><rect x="5" y="-9" width="3" height="3" fill="#2f80ff"/><rect x="10" y="6" width="3" height="3" fill="#2f80ff"/><path d="M-17 0 q-3 -4 -1 -8 M-17 2 q-4 2 -2 7" stroke="#cfe" fill="none"/></svg>
      <div><h1>OPER<span>ON</span></h1><small>seja a E. coli</small></div></div>
    <div class="res" id="hud"></div>
    <button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button>
  </header>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    try { muted = localStorage.getItem('operon-mudo') === '1'; } catch (e) {}
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = ac.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(musicBus); osc.start(time); osc.stop(time + dur + 0.03);
    }
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.15) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);
    }
    function toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.5;
      try { localStorage.setItem('operon-mudo', muted ? '1' : '0'); } catch (e) {}
      updateSoundButton();
      return muted;
    }
    return { ensure, tone, noise, arp, note, music, toggle, get muted() { return muted; } };
  })();
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundButton() { if (soundBtn) { soundBtn.textContent = Sound.muted ? '🔇 Som desligado (M)' : '🔊 Som ligado (M)'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } }
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.ensure(); Sound.toggle(); soundBtn.blur(); });
  updateSoundButton();
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { Sound.ensure(); Sound.toggle(); } });
  // links "todos os jogos" só aparecem no site publicado
  for (const a of document.querySelectorAll('.backlink')) if (!/github\.io$/.test(location.hostname)) a.hidden = true;

  // =====================================================================
  // MODELO DA CÉLULA: óperon lac, óperon trp, energia e crescimento
  // Unidades arbitrárias, escolhidas para que a regulação faça diferença
  // visível em poucos segundos de jogo.
  // =====================================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const hill = (x, K, n = 2) => { const xn = Math.pow(Math.max(0, x), n); return xn / (xn + Math.pow(K, n)); };

  // genótipo: o que a linhagem já "evoluiu" e quais mutações carrega
  function wildGeno() {
    return {
      lacMode: 'auto',   // 'manual' (você liga e desliga) | 'auto' (regulação genética)
      lacI: '+',         // '+' normal · '-' sem repressor · 's' super-repressor (não reconhece a alolactose)
      lacO: '+',         // '+' normal · 'c' operador constitutivo (o repressor não se liga)
      capSite: true,     // o promotor lac depende de CAP-AMPc
      crp: '+', cya: '+',// genes da proteína CAP e da adenilato ciclase
      lacZ: '+', lacY: '+',
      trpMode: 'auto',
      trpR: '+', atten: true, trpE: '+',
      fprime: false,     // plasmídeo F′ lac selvagem (merodiploide)
      leak: true,
    };
  }
  const G = (over = {}) => Object.assign(wildGeno(), over);

  // ---------- regulação do lac ----------
  // devolve a taxa de transcrição (0–1) do óperon lac cromossômico e,
  // se houver F′, a do óperon do plasmídeo
  function lacTx(g, sig, manualOn) {
    if (g.lacMode === 'manual') { const t = manualOn ? 1 : 0.01; return { chr: t, fp: 0, occ: manualOn ? 0 : 1, cap: 1, induced: 0, repPresent: false }; }
    const induced = sig.iptg ? 1 : hill(sig.allo, 0.03);
    // repressores disponíveis (difusíveis: agem em trans)
    const reps = [];
    if (g.lacI === '+') reps.push('+'); if (g.lacI === 's') reps.push('s');
    if (g.fprime) reps.push('+');
    const repPresent = reps.length > 0, hasS = reps.includes('s');
    const occFor = opr => { if (opr !== '+' || !repPresent) return 0; if (hasS) return sig.iptg ? 0.9 : 1; return 1 - induced; };
    const capActive = g.crp === '+' ? (g.cya === '+' ? sig.camp : (sig.addCamp ? 1 : 0)) : 0;
    const prom = g.capSite ? 0.08 + 0.92 * capActive : 0.8;
    const leak = g.leak ? 0.03 : 0.002;
    const occ = occFor(g.lacO);
    const chr = (leak + (1 - leak) * (1 - occ)) * prom;
    const fp = g.fprime ? (leak + (1 - leak) * (1 - occFor('+'))) * prom : 0;
    return { chr, fp, occ, cap: capActive, induced, repPresent, hasS };
  }
  // ---------- regulação do trp ----------
  function trpTx(g, trpIn, manualOn) {
    if (g.trpMode === 'manual') { const t = manualOn ? 1 : 0.01; return { tx: t, occ: manualOn ? 0 : 1, read: 1, act: 0 }; }
    const act = g.trpR === '+' ? hill(trpIn, 0.25, 3) : 0;
    const occ = act * 0.99;
    const charged = trpIn / (trpIn + 0.12);
    const read = g.atten ? 0.08 + 0.92 * (1 - charged) : 1;
    return { tx: (0.005 + 0.995 * (1 - occ)) * read, occ, read, act };
  }

  function newCell(geno, x, y) {
    return { geno, x, y, ang: rnd(0, 6.28), vx: 0, vy: 0, atp: 40, B: 1, div: 0,
      mL: 0.02, Z: 0.03, Y: 0.03, mT: 0.2, PT: 0.3, trpIn: 0.5, allo: 0, camp: 0,
      lacOn: false, trpOn: true, lacInfo: null, trpInfo: null,
      env: { g: 0, l: 0, w: 0 }, mu: 0, ein: 0, cost: 0, starve: 0,
      stats: { lacWaste: 0, lacUse: 0, trpWaste: 0, starveT: 0, glcE: 0, lacE: 0 } };
  }

  const K_PROT = 0.05;
  // um passo de dt segundos; env = concentrações locais; devolve o consumo de cada nutriente
  function stepCell(c, env, dt, moving) {
    const g = c.geno; c.env = env;
    const gs = env.g / (env.g + 0.15);           // sinal da glicose
    c.camp += ((1 - gs) - c.camp) * Math.min(1, dt * 1.5);
    // captação
    const ug = 1.0 * env.g / (env.g + 0.3);
    const Yeff = g.lacY === '+' ? c.Y : 0;
    const Zeff = g.lacZ === '+' ? c.Z : 0;
    const ul = (1.25 * Yeff + 0.01) * env.l / (env.l + 0.3) * (1 - 0.65 * gs); // exclusão do indutor pela glicose
    const zsat = Zeff / (Zeff + 0.12);
    const lacE = ul * zsat * 0.8;
    // alolactose: feita pela própria β-galactosidase
    c.allo += (2.2 * ul * zsat - 0.9 * c.allo) * dt;
    if (c.allo < 0) c.allo = 0;
    // triptofano
    const ut = 0.9 * env.w / (env.w + 0.2) * (1 - hill(c.trpIn, 1.0));
    const PTeff = g.trpE === '+' ? c.PT : 0;
    const st = 0.55 * PTeff * (1 / (1 + Math.pow(c.trpIn / 0.8, 2))) * (c.atp > 2 ? 1 : 0.2);
    // regulação
    const L = lacTx(g, { allo: c.allo, camp: c.camp }, c.lacOn);
    const T = trpTx(g, c.trpIn, c.trpOn);
    c.lacInfo = L; c.trpInfo = T;
    const txL = Math.min(1, L.chr + L.fp), txT = T.tx;
    // crescimento
    const fA = c.atp / (c.atp + 30), fT = c.trpIn / (c.trpIn + 0.08);
    const mu = 0.17 * fA * fT * (c.atp > 0.5 ? 1 : 0);
    c.mu = mu;
    const ein = Math.min(ug * 1.0 + lacE, 0.85); // capacidade de processar carbono é limitada

  // animação dos óperons
  const OPA = { lac: [0, .33, .66], trp: [0, .33, .66] };

    operon: ['O que é um óperon', 'Genes vizinhos transcritos juntos, a partir de um único promotor, num só mRNA (policistrônico). No óperon lac: <b>lacZ</b> (β-galactosidase), <b>lacY</b> (permease) e <b>lacA</b> (transacetilase). François Jacob e Jacques Monod propuseram o modelo em 1961 e ganharam o Nobel em 1965, com André Lwoff. Fabricar proteína é caro: regular genes economiza energia.'],
    inducao: ['Controle negativo induzível', 'O lac é <b>induzível</b> e de <b>controle negativo</b>: o repressor LacI desliga. O indutor (alolactose, ou o análogo IPTG) se liga ao repressor e muda sua forma (alosteria), e ele solta o operador. A expressão basal ("vazamento") permite a entrada do primeiro indutor.'],

    good: () => Sound.arp([72, 76, 79, 84], .08, { type: 'triangle', vol: .12, dur: .2 }),

  // ---------------- estado ----------------
  let W = null, screen = 'menu', paused = false, speed = 1, modalOpen = false, keys = {}, lastT = 0, uiT = 0, chT = 0;

  function startLevel(L) {
    const me = newCell(L.geno(), AW / 2, AH / 2); me.lacOn = false; me.trpOn = true;
    W = { L, F: newField(), t: 0, me, rivals: L.rivals.map((k, i) => newRival(k, 120 + (i % 2) * 720 + rnd(-40, 40), 110 + Math.floor(i / 2) * 340 + rnd(-30, 30))),
      ghosts: [], pops: [], target: null, hist: [], histT: 0, mut: null, mutDone: [], mistakes: 0, tests: [], ended: false, banner: '', bannerT: 0, fixed: [] };

    screen = 'play'; paused = false;
    renderPlay();
    openModal(`<h2>Fase ${L.id <= 7 ? L.id : '★'} · ${esc(L.title)}</h2><p class="meta">${esc(L.sub)}</p>${L.intro}
      <p>🎯 Meta: <b>${L.goal} divisões</b> em ${L.T} segundos.</p>

  }

  // ---------------- laço ----------------
  function frame(ts) {
    requestAnimationFrame(frame);
    const rdt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
    if (screen !== 'play' || !W) return;
    const running = !paused && !modalOpen && !W.ended;
    if (running) for (let i = 0; i < speed; i++) tick(rdt);
    const cv = $('#arena'); if (!cv) return;
    const ctx = cv.getContext('2d');
    drawArena(ctx, W, W.t);
    updateOperons(W.me, W.t, running ? rdt * speed : 0);
    uiT += rdt; if (uiT > 0.12) { uiT = 0; updateUI(); }
    chT += rdt; if (chT > 0.25) { chT = 0; const ch = $('#chart'); if (ch) drawChart(ch, W.hist); }
  }
  function tick(dt) {
    if (W.ended) return;
    W.t += dt;
    const L = W.L, me = W.me;
    L.spawn(W, dt);
    diffuse(W.F, dt, L.floorW);
    // movimento do jogador
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (dx || dy) W.target = null;
    else if (W.target) { const ddx = W.target.x - me.x, ddy = W.target.y - me.y, d = Math.hypot(ddx, ddy); if (d < 6) W.target = null; else { dx = ddx / d; dy = ddy / d; } }
    const n = Math.hypot(dx, dy), moving = n > 0;
    if (moving) {
      const sp = (me.atp > 0.5 ? 85 : 30) * dt; me.x = clamp(me.x + dx / n * sp, 14, AW - 14); me.y = clamp(me.y + dy / n * sp, 14, AH - 14);
      me.ang = angLerp(me.ang, Math.atan2(dy, dx), dt * 8);
    }
    const env = sample(W.F, me.x, me.y), up = stepCell(me, env, dt, moving);
    consume(W.F, me.x, me.y, up, dt);
    if (up.divided) onDivide(me, true);
    // rivais
    for (const r of W.rivals) {
      r.think -= dt;
      if (r.think <= 0) { r.think = rnd(.45, .8); aiThink(r); }
      const ddx = r.tx - r.x, ddy = r.ty - r.y, d = Math.hypot(ddx, ddy), mv = d > 8;
      if (mv) { const sp = (r.atp > 0.5 ? 62 : 25) * dt; r.x += ddx / d * Math.min(sp, d); r.y += ddy / d * Math.min(sp, d); r.ang = angLerp(r.ang, Math.atan2(ddy, ddx), dt * 6); }
      const e = sample(W.F, r.x, r.y), u = stepCell(r, e, dt, mv); consume(W.F, r.x, r.y, u, dt);
      if (u.divided) onDivide(r, false);
    }
    for (const g of W.ghosts) { g.life -= dt; g.x += g.vx * dt; g.y += g.vy * dt; }
    W.ghosts = W.ghosts.filter(g => g.life > 0);
    for (const p of W.pops) { p.life -= dt * .8; p.y -= 18 * dt; }
    W.pops = W.pops.filter(p => p.life > 0);
    // mutações programadas
    for (const [i, [tm, pool]] of (L.muts || []).entries()) {
      if (W.t >= tm && !W.mutDone.includes(i) && !W.mut) { W.mutDone.push(i); mutate(pool); }
    }

    W.histT += dt;
    if (W.histT >= 0.25) { W.histT = 0; W.hist.push({ atp: me.atp, Z: me.geno.lacZ === '+' ? me.Z : 0, PT: me.PT, g: env.g, l: env.l, w: env.w, div: W._div }); W._div = false; if (W.hist.length > 400) W.hist.shift(); }

  }
  const angLerp = (a, b, f) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * Math.min(1, f); };
  function onDivide(c, me) {
    const a = c.ang + Math.PI / 2 * (Math.random() < .5 ? 1 : -1);
    W.ghosts.push({ ...c, stats: null, life: 1.5, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, col: me ? '#c8f7a0' : c.col, div: c.div, geno: c.geno });
    W.pops.push({ x: c.x, y: c.y - 30, txt: me ? '+1 divisão!' : '+1', col: me ? '#c8f7a0' : c.col, life: 1 });

  function aiThink(r) {
    const g = r.geno, lacOK = g.lacZ === '+' && g.lacY === '+';
    const lw = lacOK ? (r.Z > .3 ? .95 : .5) : .03, ww = g.trpE === '-' ? (r.trpIn < .6 ? 2.2 : .3) : (r.trpIn < .3 ? 1.1 : .12);
    const val = (x, y) => { const e = sample(W.F, x, y); return e.g + e.l * lw + e.w * ww; };
    let best = { x: r.x, y: r.y, v: val(r.x, r.y) * 1.15 + .02 };
    for (let i = 0; i < 12; i++) for (const d of [80, 170]) {
      const a = i / 12 * 6.283 + rnd(-.2, .2), x = clamp(r.x + Math.cos(a) * d, 20, AW - 20), y = clamp(r.y + Math.sin(a) * d, 20, AH - 20), v = val(x, y) - d / 2000 + rnd(0, .06);
      if (v > best.v) best = { x, y, v };

    if (best.v < .06) { best.x = clamp(r.x + rnd(-200, 200), 20, AW - 20); best.y = clamp(r.y + rnd(-200, 200), 20, AH - 20); }

  function banner(txt, s) { W.banner = txt; W.bannerT = s; }

  // ---------------- mutações e diagnóstico ----------------
  function mutate(pool) {
    let list = pool === 'any' ? [...MUT_POOL.lac, ...MUT_POOL.trp] : pool;

  }
  function dxOptions() { return DX[W.L.id] || [...MUT_POOL.lac, ...MUT_POOL.trp]; }
  function baseGeno() { const g = JSON.parse(JSON.stringify(W.me.geno)); if (W.mut) MUT[W.mut.k].fix(g); return g; }
  function famOf() { const o = dxOptions(); return { lac: o.some(k => MUT[k].fam === 'lac'), trp: o.some(k => MUT[k].fam === 'trp') }; }

  }
  const barv = (v, col) => `<span class="bar2"><i style="width:${Math.round(clamp(v, 0, 1) * 100)}%;background:${col}"></i></span>${Math.round(clamp(v, 0, 1.2) * 100)}`;

    const lacRows = W.tests.filter(id => LAC_TESTS.some(x => x[0] === id)).map(id => { const n = LAC_TESTS.find(x => x[0] === id)[1], A = assayRow(id, g).a, B = assayRow(id, base).a; return `<tr><td>${n}</td><td>${barv(A.Z, '#ff9a1f')}</td><td>${barv(A.Y, '#2f80ff')}</td><td class="meta">${barv(B.Z, '#7a6040')} / ${Math.round(B.Y * 100)}</td></tr>`; }).join('');

  // ---------------- fim da fase ----------------

      <p class="meta">Do controle manual à regulação automática: repressor, indutor, CAP-AMPc, correpressor, atenuação. E, quando surgirem mutantes, diagnostique-os como Jacob e Monod.</p></div>
      <div class="levels">${[...LEVELS, FREE].map(L => `<button class="lv" data-act="level" data-v="${L.id}" ${unlocked(L.id) ? '' : 'disabled'}><span class="num">${L.id <= 7 ? 'FASE ' + L.id : 'MODO LIVRE'}</span><span class="t">${esc(L.title)}</span><span class="meta">${esc(L.sub)}</span>
        <span class="stars">${L.id === 8 ? (prog.best[8] ? `🏆 recorde: ${prog.best[8]} divisões` : '') : '★'.repeat(prog.stars[L.id] || 0) + '☆'.repeat(3 - (prog.stars[L.id] || 0))}${unlocked(L.id) ? '' : ' 🔒'}</span></button>`).join('')}</div>`;
  }
  function renderPlay() {
    renderHUD();
    const lacMan = W.me.geno.lacMode === 'manual' && !W.L.lacLocked, trpMan = W.me.geno.trpMode === 'manual';
    $('#main').innerHTML = `<div class="layout"><div>
        <div class="arena"><canvas id="arena" width="${AW}" height="${AH}"></canvas><div class="banner" id="banner"></div>
          <div class="sensor" id="sensor"></div></div>
        <div class="opwrap"><div class="panel" id="ops" style="padding:6px 8px">${operonSVG(W.me.geno)}</div>
          <div class="ctl">
            <div class="ctlbox"><h4>lac ${lacMan ? '<span class="meta">tecla L</span>' : W.L.lacLocked ? '<span class="meta">sem lactose nesta fase</span>' : '<span class="auto">automático</span>'}</h4>
              ${lacMan ? `<button class="switch" id="swL" data-act="swL"></button>` : ''}
              <div class="rd" id="rdL"></div></div>
            <div class="ctlbox"><h4>trp ${trpMan ? '<span class="meta">tecla T</span>' : '<span class="auto">automático</span>'}</h4>
              ${trpMan ? `<button class="switch" id="swT" data-act="swT"></button>` : ''}
              <div class="rd" id="rdT"></div></div>
          </div></div>
      </div>
      <div class="side">
        <div id="alertBox"></div>
        <div class="panel vit"><h3>🦠 Sua célula</h3><div class="rd" id="vit"></div><div class="meta" id="vit2" style="margin-top:4px"></div></div>
        <div class="panel"><h3>🏁 Divisões</h3><div class="score" id="score"></div></div>
        <div class="panel"><h3>📈 Últimos 60 segundos</h3><canvas class="chart" id="chart" width="600" height="200"></canvas>
          <div class="legend">${SERIES.map(([, c, n], i) => `<span><i style="background:${c};${i > 2 ? 'opacity:.7' : ''}"></i>${n}</span>`).join('')}<span><i style="background:#7bd389;width:3px;height:8px"></i>divisão</span></div></div>
      </div></div>`;
    const cv = $('#arena');
    const setT = e => { const r = cv.getBoundingClientRect(); W.target = { x: (e.clientX - r.left) / r.width * AW, y: (e.clientY - r.top) / r.height * AH }; };
    let drag = false;
    cv.addEventListener('pointerdown', e => { wake(); drag = true; setT(e); cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (drag) setT(e); });
    cv.addEventListener('pointerup', () => { drag = false; });
    renderSideStatic(); updateUI();
  }
  function renderSideStatic() {
    const a = $('#alertBox'); if (!a || !W) return;
    a.innerHTML = W.mut ? `<div class="alert"><h4>🧬 Mutação na sua linhagem!</h4><p style="margin:2px 0 8px">${MUT[W.mut.k].sym}</p><button class="btn warm" data-act="diag">🔬 Diagnosticar</button></div>` : '';
  }
  const row = (lab, v, col, txt) => `<span>${lab}</span><span class="b"><i style="width:${Math.round(clamp(v, 0, 1) * 100)}%;background:${col}"></i></span><span class="v">${txt}</span>`;
  function updateUI() {
    if (!W) return; const me = W.me, L = me.lacInfo, T = me.trpInfo; if (!L) return;
    const hT = $('#hT'); if (hT) hT.textContent = Math.max(0, Math.ceil(W.L.T - W.t)) + ' s';
    const hD = $('#hD'); if (hD) hD.textContent = me.div;
    const e = me.env;
    $('#sensor').innerHTML = `Aqui: <span style="color:var(--glc)">glicose <b>${e.g.toFixed(1)}</b></span> · <span style="color:var(--lac)">lactose <b>${e.l.toFixed(1)}</b></span> · <span style="color:var(--trp)">Trp <b>${e.w.toFixed(1)}</b></span>`;
    const bn = $('#banner'); bn.textContent = W.banner; bn.style.opacity = W.bannerT > 0 ? 1 : 0;
    const gen = me.mu > 0.005 ? Math.round(Math.LN2 / me.mu) + ' s' : '—';
    $('#vit').innerHTML = row('ATP', me.atp / 100, me.atp > 20 ? '#ffd166' : '#ff6b6b', Math.round(me.atp))
      + row('Rumo à divisão', me.B - 1, '#7bd389', Math.round((me.B - 1) * 100) + '%')
      + row('Trp interno', me.trpIn / 1.2, me.trpIn > .1 ? '#d07bff' : '#ff6b6b', me.trpIn.toFixed(2))
      + row('Crescimento', me.mu / 0.12, '#7bd389', gen);
    const net = me.ein - me.cost;
    $('#vit2').innerHTML = `Energia: entra <b style="color:#ffd166">+${me.ein.toFixed(2)}</b>/s · gasto com genes e manutenção <b style="color:#ff9a9a">−${me.cost.toFixed(2)}</b>/s · tempo de geração ${gen}`;
    const sw = $('#swL'); if (sw) { sw.className = 'switch ' + (me.lacOn ? 'on' : 'off'); sw.textContent = me.lacOn ? '● LIGADO (custa ATP)' : '○ DESLIGADO'; }
    const st = $('#swT'); if (st) { st.className = 'switch ' + (me.trpOn ? 'on' : 'off'); st.textContent = me.trpOn ? '● LIGADO (custa ATP)' : '○ DESLIGADO'; }
    const g = me.geno;
    $('#rdL').innerHTML = row('transcrição', L.chr, '#4aa3ff', pct(L.chr)) + row('β-galactosidase', (g.lacZ === '+' ? me.Z : 0) / 1.2, '#ff9a1f', (g.lacZ === '+' ? me.Z : 0).toFixed(2)) + row('permease LacY', (g.lacY === '+' ? me.Y : 0) / 1.2, '#2f80ff', (g.lacY === '+' ? me.Y : 0).toFixed(2))
      + (g.lacMode === 'auto' ? row('alolactose', clamp(me.allo / 0.1, 0, 1), '#ffffff', me.allo.toFixed(2)) : '') + (g.lacMode === 'auto' && g.capSite ? row('AMPc', me.camp, '#ff9f1c', pct(me.camp)) : '');
    $('#rdT').innerHTML = row('transcrição', T.tx, '#4aa3ff', pct(T.tx)) + row('enzimas trp', me.PT / 1.1, '#e98bd8', me.PT.toFixed(2))
      + (g.trpMode === 'auto' && g.trpR === '+' ? row('TrpR com Trp', T.act, '#3fbf6f', pct(T.act)) : '') + (g.trpMode === 'auto' && g.atten ? row('passa o atenuador', T.read, '#ffe08a', pct(T.read)) : '');
    const all = [{ n: 'Você', d: me.div, c: '#c8f7a0', me: 1 }, ...W.rivals.map(r => ({ n: r.name, d: r.div, c: r.col }))].sort((a, b) => b.d - a.d);
    $('#score').innerHTML = all.map(x => `<div class="r ${x.me ? 'me' : ''}"><span class="dot" style="background:${x.c}"></span><span class="n">${esc(x.n)}</span><b>${x.d}</b></div>`).join('');
  }

  // ---------------- modais ----------------
  let modalCb = null;
  function openModal(html, cb) { modalOpen = true; modalCb = cb || null; $('#modalRoot').innerHTML = `<div class="modalbg"><div class="modal">${html}</div></div>`; }
  function closeModal() { modalOpen = false; $('#modalRoot').innerHTML = ''; const cb = modalCb; modalCb = null; if (cb) cb(); }
  function help() {
    openModal(`<h2>Como jogar</h2>
      <p>🖱️ <b>Clique ou toque</b> no campo para nadar até lá (pode arrastar). Teclado: <kbd>WASD</kbd> ou setas. <kbd>Espaço</kbd> pausa, <kbd>L</kbd> e <kbd>T</kbd> ligam e desligam os óperons quando estão no modo manual, <kbd>M</kbd> liga e desliga o som.</p>
      <p>🟡 <b>Glicose</b>, ⚪ <b>lactose</b> e 🟣 <b>triptofano</b> aparecem como nuvens. Sua célula come o que estiver embaixo dela, se tiver as proteínas certas.</p>
      <p>⚡ O <b>ATP</b> vem da comida e paga tudo: nadar, manter a célula e, principalmente, <b>transcrever e traduzir genes</b>. Com energia e Trp sobrando, a célula cresce e se divide.</p>
      <p>🧬 O painel embaixo mostra os óperons por dentro: RNA polimerase (azul), repressores, CAP, mRNA e ribossomos. Os pontinhos na célula mostram as enzimas: laranja = β-galactosidase, azul na membrana = permease, roxo = enzimas do Trp.</p>
      <p>🔬 Quando surgir uma <b>mutação</b>, abra o laboratório, faça testes (IPTG, merodiploide F′, AMPc, com e sem Trp) e descubra qual gene foi afetado.</p>
      <div class="btns"><button class="btn primary" data-act="close">Entendi</button></div>`);
  }
  function notes() {
    const ks = Object.keys(LESSONS);
    openModal(`<h2>📘 Caderno de conceitos</h2><p class="meta">Você desbloqueia conceitos ao completar fases e diagnosticar mutantes.</p>
      ${ks.map(k => prog.lessons.includes(k) ? lessonHTML(k) : `<div class="lesson" style="opacity:.45;border-left-color:#5d8590">🔒 ${LESSONS[k][0]}</div>`).join('')}
      <div class="btns"><button class="btn primary" data-act="close">Fechar</button></div>`);
  }

  // ---------------- entrada ----------------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    wake();
    const act = b.dataset.act, v = b.dataset.v;
    switch (act) {
      case 'level': closeModal(); startLevel(v === '8' ? FREE : LEVELS.find(L => L.id === +v)); break;
      case 'menu': closeModal(); renderMenu(); break;
      case 'go': closeModal(); sfx.tick(); break;
      case 'close': closeModal(); break;
      case 'help': help(); break;
      case 'notes': notes(); break;
      case 'pause': paused = !paused; renderHUD(); break;
      case 'speed': speed = speed === 1 ? 2 : 1; renderHUD(); break;
      case 'swL': W.me.lacOn = !W.me.lacOn; sfx.sw(W.me.lacOn); updateUI(); break;
      case 'swT': W.me.trpOn = !W.me.trpOn; sfx.sw(W.me.trpOn); updateUI(); break;
      case 'diag': openDiag(); break;
      case 'test': runTest(v); break;
      case 'dx': guess(v); break;
    }
  });
  const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (KM[e.code] && screen === 'play') { keys[KM[e.code]] = true; e.preventDefault(); wake(); }
    if (screen !== 'play' || !W || modalOpen) return;
    if (e.code === 'Space') { paused = !paused; renderHUD(); e.preventDefault(); }
    if (e.code === 'KeyL' && W.me.geno.lacMode === 'manual' && !W.L.lacLocked) { W.me.lacOn = !W.me.lacOn; sfx.sw(W.me.lacOn); }
    if (e.code === 'KeyT' && W.me.geno.trpMode === 'manual') { W.me.trpOn = !W.me.trpOn; sfx.sw(W.me.trpOn); }
  });
  addEventListener('keyup', e => { if (KM[e.code]) keys[KM[e.code]] = false; });
  addEventListener('blur', () => { keys = {}; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play' && !modalOpen) { paused = true; renderHUD(); } });

  window.__OP = { get W() { return W; }, startLevel, LEVELS, FREE, endLevel, guess, mutate, renderMenu, get prog() { return prog; } };
  renderMenu();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
