<style>

  .side .panel { border-top-left-radius:0; max-height:calc(100vh - 110px); overflow:auto; }

  .search { width:100%; background:#0b1b22; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:5px 9px; margin:4px 0; }
  .plist { display:flex; flex-direction:column; gap:3px; }
  .prow { text-align:left; background:#0f2530; border:1px solid transparent; border-radius:8px; padding:3px 8px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .prow:hover { border-color:var(--line); } .prow .M { color:#64b5f6; } .prow .F { color:#f48fb1; }
  .gch { display:inline-block; font-size:10px; font-weight:800; border:1.5px solid var(--c); color:var(--c); border-radius:5px; padding:0 4px; margin-right:2px; }
  .gch.h { background:var(--c); color:#111; }
  .modalbg { position:fixed; inset:0; background:rgba(3,12,16,.7); display:flex; align-items:center; justify-content:center; padding:14px; z-index:50; }
  .modal { background:#12303c; border:1px solid #33677a; border-radius:16px; max-width:640px; width:100%; max-height:92vh; overflow:auto; padding:18px 20px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal.wide { max-width:860px; }
  .modal h2 { margin:0 0 8px; font:800 21px Georgia, serif; color:var(--sand); }
  .lesson { background:#0d2630; border-left:4px solid var(--warm); border-radius:8px; padding:8px 12px; margin:10px 0; font-size:13.5px; } .lesson b.t { color:var(--warm); }
  .ped { display:flex; flex-direction:column; gap:8px; margin:10px 0; } .ped .row { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .pn { background:#0f2530; border:2px solid var(--line); border-radius:10px; padding:4px 9px; display:flex; flex-direction:column; min-width:130px; cursor:pointer; font-size:12.5px; }
  .pn.M { border-color:#3b7fb5; } .pn.F { border-color:#b5487a; } .pn.dead { opacity:.6; } .pn.empty { cursor:default; border-style:dashed; }
  .buildbar { margin-bottom:10px; } .bbh { display:flex; justify-content:space-between; align-items:center; } .bbh h3 { margin:0 0 6px; }
  .bcat { display:flex; flex-wrap:wrap; gap:5px; align-items:stretch; margin:4px 0; } .bcn { width:100px; font-size:12px; color:var(--muted); align-self:center; }
  .bb { display:flex; flex-direction:column; align-items:center; min-width:82px; background:#0f2530; border:2px solid var(--line); border-radius:10px; padding:3px 7px; }
  .bb:hover:not(:disabled) { border-color:var(--warm); } .bb.on { border-color:var(--warm); background:#3a3214; box-shadow:0 0 0 2px rgba(242,201,107,.3); }
  .bb.done { opacity:.5; cursor:default; } .bb.poor .bc { color:#ff8f80; }
  .bb .bi { font-size:20px; line-height:1.2; } .bb .bn { font-size:11.5px; font-weight:700; text-align:center; } .bb .bn b { color:var(--warm); } .bb .bc { font-size:11px; color:var(--warm); }
  .bstat { margin-top:8px; background:#0d2630; border:1px solid var(--warm); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:4px; font-size:13px; } .bstat .btn { align-self:flex-start; }
  svg.map .okb { fill:rgba(242,201,107,.25); stroke:#ffd76b; stroke-width:3; stroke-dasharray:6 4; animation:okb 1s linear infinite; pointer-events:none; }
  @keyframes okb { to { stroke-dashoffset:-20; } }
  table.posts td { padding:3px 5px; } .cath { color:var(--warm); font-weight:800; background:#0d2630; }
  ul.chk { list-style:none; padding:0; margin:4px 0; font-size:13px; } ul.chk li.ok { color:var(--muted); text-decoration:line-through; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#12303c; border:1px solid var(--warm); border-radius:12px; padding:8px 16px; z-index:60; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  svg.map .lvb circle { fill:#f2c96b; stroke:#3a2a00; stroke-width:1.2; } svg.map .lvb text { font:900 10px system-ui; fill:#2c2000; text-anchor:middle; pointer-events:none; }
  svg.map .okb.cant { stroke:#ff8f80; fill:rgba(255,120,100,.18); }
  .bb.up { min-width:150px; } .upm { flex:1; min-width:200px; align-self:center; }
  .upbox { background:#0d2630; border:1px solid var(--warm); border-radius:10px; padding:8px 10px; margin-top:6px; } .upbox .btn { margin-top:6px; }
  .lvtag { background:#f2c96b; color:#2c2000; border-radius:6px; padding:0 6px; font-size:11px; font-weight:800; }
  .lvcol { font-size:11px; min-width:200px; }
  .score { font-size:17px; } .score b { color:var(--warm); font-size:22px; }
</style>

<body>
<div class="wrap">
  <a class="backlink" id="backlink" href="../" hidden>← Todos os jogos</a>
  <header class="top">
    <div class="brand"><svg width="42" height="42" viewBox="-21 -21 42 42" aria-hidden="true"><circle r="20" fill="#1d5f86"/><path d="M-14 6 C -8 -10, 8 -12, 15 4 Z" fill="#e9d79c"/><path d="M-9 4 C -4 -6, 6 -7, 10 3 Z" fill="#7cb85c"/><path d="M-3 -16 v14 M-3 -15 l8 6 h-8" stroke="#f4ecd8" stroke-width="1.6" fill="#f4ecd8"/></svg>
      <div><h1>FUNDADORES</h1><small>efeito fundador · gargalo · deriva</small></div></div>
    <div class="res" id="hud"></div>
    <button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button>
  </header>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  // Versão com instrumentos "orquestrais" simples: harpa, cordas, coro, flauta, tímpano e reverb.
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    let C = null, BUS = null; // contexto e barramento usados pelas vozes da música (trocados na renderização offline)
    try { muted = localStorage.getItem('fundadores-mudo') === '1'; } catch (e) {}
    function makeReverb(ctx, secs = 3.2, decay = 2.6) {
      const len = Math.floor(ctx.sampleRate * secs), buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
      const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
    }
    function makeBus(ctx, dest, vol) {
      const bus = ctx.createGain(); bus.gain.value = vol;
      const dry = ctx.createGain(); dry.gain.value = .78;
      const wet = ctx.createGain(); wet.gain.value = .42;
      const rv = makeReverb(ctx);
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 45;
      bus.connect(hp); hp.connect(dry); hp.connect(rv); rv.connect(wet); dry.connect(comp); wet.connect(comp); comp.connect(dest);
      return bus;
    }
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = makeBus(ac, master, .5);
          C = ac; BUS = musicBus;
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = C.createOscillator(), g = C.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(BUS); osc.start(time); osc.stop(time + dur + 0.03);
    }
    // voz genérica com envelope ADSR simples, vários osciladores desafinados, filtro, vibrato e pan
    function voice(freq, t, dur, o = {}) {
      const a = o.a ?? .02, r = o.r ?? .3, vol = o.vol ?? .2, end = t + dur + r;
      const g = C.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
      if (o.decay) g.gain.exponentialRampToValueAtTime(Math.max(.0001, vol * (o.sustain ?? .0005)), t + o.decay);
      else { g.gain.setValueAtTime(vol, t + Math.max(a, dur)); }
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      let out = g;
      if (o.lp) { const f = C.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q ?? .7; g.connect(f); out = f; }
      if (o.formant) { const f2 = C.createBiquadFilter(); f2.type = 'peaking'; f2.frequency.value = o.formant; f2.gain.value = 9; f2.Q.value = 1.4; out.connect(f2); out = f2; }
      if (C.createStereoPanner && o.pan) { const p = C.createStereoPanner(); p.pan.value = o.pan; out.connect(p); out = p; }
      out.connect(BUS);
      let lfo = null;
      if (o.vib) { lfo = C.createOscillator(); lfo.frequency.value = o.vib[0]; const lg = C.createGain(); lg.gain.value = freq * (Math.pow(2, o.vib[1] / 1200) - 1); lfo.connect(lg); lfo._g = lg; lfo.start(t); lfo.stop(end + .05); }
      for (const det of (o.det || [0])) {
        const osc = C.createOscillator(); osc.type = o.wave || 'sine'; osc.frequency.value = freq; osc.detune.value = det;
        if (o.drop) { osc.frequency.setValueAtTime(freq * o.drop, t); osc.frequency.exponentialRampToValueAtTime(freq, t + .06); }
        if (lfo) lfo._g.connect(osc.frequency);
        osc.connect(g); osc.start(t); osc.stop(end + .05);
      }
    }
    const INST = {
      harp:    (f, t, d, v = .16, pan = -.25) => { voice(f, t, d, { wave: 'triangle', a: .004, decay: 1.6, r: .4, vol: v, lp: 5000, pan }); voice(f * 2, t, d, { wave: 'sine', a: .003, decay: .5, r: .2, vol: v * .25, pan }); },
      strings: (f, t, d, v = .05, pan = 0) => voice(f, t, d, { wave: 'sawtooth', det: [-7, 0, 6], a: .45, r: .9, vol: v, lp: 2600, vib: [5, 4], pan }),
      choir:   (f, t, d, v = .045, pan = 0) => voice(f, t, d, { wave: 'sawtooth', det: [-9, 0, 8], a: .32, r: .8, vol: v, lp: 2200, formant: 820, vib: [5.2, 7], pan }),
      flute:   (f, t, d, v = .13, pan = .2) => { voice(f, t, d, { wave: 'sine', a: .07, r: .35, vol: v, vib: [5, 9], pan }); voice(f * 2, t, d, { wave: 'sine', a: .1, r: .3, vol: v * .12, pan }); },
      horn:    (f, t, d, v = .06, pan = .1) => voice(f, t, d, { wave: 'sawtooth', det: [-4, 4], a: .09, r: .45, vol: v, lp: 1100, vib: [4.5, 5], pan }),
      bass:    (f, t, d, v = .1) => voice(f, t, d, { wave: 'triangle', a: .05, r: .6, vol: v, lp: 500 }),
      timp:    (f, t, v = .32) => { voice(f, t, .05, { wave: 'sine', a: .003, decay: 1.1, r: .3, vol: v, drop: 1.5 }); voice(f * 1.5, t, .05, { wave: 'sine', a: .003, decay: .4, r: .1, vol: v * .25 }); },
      roll:    (f, t, len, v = .1) => { for (let i = 0; i < len / .07; i++) voice(f, t + i * .07, .03, { wave: 'sine', a: .003, decay: .25, r: .05, vol: v * (0.3 + 0.7 * i * .07 / len), drop: 1.2 }); },
    };
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.25) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);

    for (const k of fk) { const ok = shuffle(land.filter(t => !t.find && (k === 'fertil' ? t.t === 'campo' : k === 'ervas' ? (t.t === 'floresta' || t.t === 'pantano') : k === 'nauf' ? t.t === 'praia' : true))); if (ok[0]) { ok[0].find = k; if (k === 'fertil') ok[0].fert = 1.6; } }
    // desembarque: praia mais a oeste com campo por perto
    const beaches = land.filter(t => t.t === 'praia').sort((a, b) => a.c - b.c + (a.r - ROWS / 2) ** 2 * .05 - (b.r - ROWS / 2) ** 2 * .05);
    const home = beaches.find(b => neighbors(T, b).some(n => n.t === 'campo')) || beaches[0] || land[0];
    home.home = true; home.b = 'acamp';
    const reveal = (t, d) => { t.rev = true; if (d > 0) for (const n of neighbors(T, t)) reveal(n, d - 1); };
    reveal(home, 2);
    // garante um campo e uma floresta perto do desembarque
    const near = neighbors(T, home).filter(n => TER[n.t].land && n !== home);
    if (!near.some(n => n.t === 'campo') && near[0]) { near[0].t = 'campo'; near[0].fert = 1; }
    if (!neighbors(T, home).concat(...near.map(n => neighbors(T, n))).some(n => n.rev && n.t === 'floresta') && near[1]) near[1].t = 'floresta';
    return T;
  }

  // ---------------- lições ----------------
  const LESSONS = {
    fundador: ['Efeito fundador', 'Uma população nova começa com uma <b>amostra pequena</b> dos genes da população de origem. Por puro acaso, alguns alelos chegam mais frequentes do que no continente, outros mais raros, e muitos nem chegam. Exemplos reais: os <b>Amish</b> da Pensilvânia (Ellis-van Creveld), os <b>africâneres</b> da África do Sul (porfiria variegata, rastreada até um casal de 1688), a ilha de <b>Tristão da Cunha</b> (asma) e as cerca de 36 "doenças da herança finlandesa".'],

    endogamia: ['Endogamia e consanguinidade', 'Parentes compartilham alelos herdados de ancestrais comuns. O <b>coeficiente de endogamia F</b> mede a chance de os dois alelos de uma pessoa serem cópias do mesmo alelo ancestral: F = 1/16 para filhos de primos de 1º grau, 1/64 para primos de 2º grau. Endogamia não cria alelos novos, mas aumenta os homozigotos, inclusive para doenças recessivas. Numa colônia pequena, depois de algumas gerações todos são parentes, mesmo evitando primos.'],

    fluxo: ['Fluxo gênico', 'Migrantes trazem alelos da população de origem. Mesmo <b>poucos migrantes por geração</b> (cerca de um) bastam para impedir que a deriva separe muito a colônia do continente e para repor alelos perdidos.'],

    sobrenome: ['Sobrenomes também derivam', 'Sobrenomes passam de pai para filho como um gene. Em populações isoladas, muitos somem e poucos dominam: em Tristão da Cunha, cerca de 250 habitantes dividem só 7 sobrenomes.'],
    ne: ['Tamanho efetivo (Ne)', 'Para a deriva, não importa quantas pessoas existem, mas quantas <b>deixam filhos</b>. Se poucos homens ou poucas mulheres se reproduzem, ou se a população passou por gargalos, o Ne fica muito menor que o censo. O Ne de longo prazo é a média harmônica dos tamanhos: os anos ruins pesam mais.'],
  };
  // =====================================================================
  // SIMULAÇÃO: um ano de vida na colônia
  // =====================================================================
  const Y0 = 1790, YEARS = 150;
  const SHIPS = [
    { k: 'bote', n: 'Bote', i: '🛶', cap: 16, food: 60, wood: 30, d: 'Pouca gente, comida para uns 4 anos. Fácil de alimentar, mas a amostra genética é minúscula.' },
    { k: 'escuna', n: 'Escuna', i: '⛵', cap: 32, food: 95, wood: 45, d: 'O meio-termo: comida para uns 3 anos.' },
    { k: 'galeao', n: 'Galeão', i: '🚢', cap: 60, food: 140, wood: 60, d: 'Muita gente e muita diversidade, mas comida para pouco mais de 2 anos. Os primeiros invernos serão duros.' },
  ];
  let S = null;
  const living = () => PEOPLE.filter(p => p.alive);
  const yr = () => S.year;
  const hasB = k => S.T.some(t => t.b === k);
  const housing = () => (S.camp || 10) + S.T.filter(t => t.b === 'casa').reduce((a, t) => a + UP.casa.v[(t.lv || 1) - 1], 0);
  const lvB = k => { const t = S.T.find(t => t.b === k); return t ? (t.lv || 1) : 0; };
  const UV = k => UP[k].v[lvB(k) - 1];

  function newColony(ship, crew) {
    S = { year: Y0, ship: ship.k, T: genIsland(), food: ship.food, wood: ship.wood, herbs: 10,
      alloc: { food: 70, wood: 20, herbs: 0, explore: 10 }, policy: { casar: 'livre', familia: 'normal' },
      hist: [], log: [], lessons: [], cases: {}, births: 0, deaths: 0, flags: { malaria: false, cold: 0, drought: 0, pest: 0, storm: 0, bounty: 0, tufoes: 0, frio: false }, founderFreq: null, foundAlleles: {}, marriages: [], firsts: {}, minN: crew.length, ended: false };
    for (const L of LOCI) S.cases[L.k] = 0;
    for (const p of crew) p.arrived = Y0;
    S.camp = Math.max(10, crew.length);
    const fr = freqs(crew); S.founderFreq = fr;
    for (const L of LOCI) S.foundAlleles[L.k] = fr[L.k] > 0;
    S.founderSurnames = new Set(crew.map(p => p.surname)).size;
    snapshot();
    note(`${Y0}: ${crew.length} colonos desembarcam na ilha.`);
  }
  function note(s, cls) { S.log.unshift({ y: S.year, s, cls }); if (S.log.length > 300) S.log.pop(); }
  function snapshot() {
    const L = living(), fr = freqs(L), cnt = {};
    for (const k of LOCI) cnt[k.k] = L.filter(p => affected(p, k.k)).length;
    const colonyBorn = L.filter(p => p.mom != null);
    const meanF = colonyBorn.length ? colonyBorn.reduce((a, p) => a + F(p), 0) / colonyBorn.length : 0;
    const ss = strStats(L);
    S.hist.push({ y: S.year, N: L.length, fr, H: ss.H, al: ss.al, F: meanF, aff: cnt, sur: new Set(L.map(p => p.surname)).size });
  }

  // mortalidade de base por idade (população pré-moderna)
  function baseMort(a) { return a < 1 ? .09 : a < 5 ? .022 : a < 15 ? .005 : a < 40 ? .008 : a < 55 ? .014 : a < 65 ? .03 : a < 75 ? .07 : a < 85 ? .15 : .3; }
  function workCap(p, y) {
    const a = age(p, y); let w = a >= 15 && a < 60 ? 1 : a >= 60 && a < 70 ? .5 : a >= 11 && a < 15 ? .3 : 0;
    if (affected(p, 'fc') || affected(p, 'hbs')) w *= .4;
    if (affected(p, 'evc')) w *= .7;
    if (affected(p, 'acro')) w *= .75;
    if (affected(p, 'surdo') && !hasB('escola')) w *= .85;
    return w;
  }

  // ---------- produção ----------
  function produce(y, mods) {
    const L = living(); let labor = 0; for (const p of L) labor += workCap(p, y);
    if (hasB('escola')) labor *= 1 + UV('escola');
    const a = S.alloc, tot = a.food + a.wood + a.herbs + a.explore || 1;
    const lf = labor * a.food / tot, lw = labor * a.wood / tot, lh = labor * a.herbs / tot, le = labor * a.explore / tot;
    const cold = S.flags.cold > y, dry = S.flags.drought > y, bon = mods.bounty ? 1.3 : 1;
    const clim = (cold ? .7 : 1) * (dry ? .5 : 1) * (mods.pest ? .6 : 1) * bon;
    const det = {}; const D = (k, slots, used, out) => { const d = det[k] || (det[k] = { n: 0, slots: 0, used: 0, out: 0 }); d.n++; d.slots += slots; d.used += used; d.out += out; };
    // comida: os trabalhadores ocupam primeiro os postos que rendem mais
    const posts = [];
    for (const t of S.T) {
      const lv = (t.lv || 1) - 1;
      if (t.b === 'roca') { const [c, v] = UP.roca.v[lv]; posts.push({ k: 'roca', cap: c, y: v * t.fert * (cold ? .7 : 1) * (dry ? (lv === 2 ? .75 : .5) : 1) * (mods.pest ? .6 : 1) * bon }); }
      if (t.b === 'porto') { const [c, v] = UP.porto.v[lv]; posts.push({ k: 'porto', cap: c, y: v * (mods.storm ? (lv === 2 ? .8 : .4) : 1) * (dry ? .9 : 1) * bon }); }
      if (t.b === 'pomar') { const [c, v] = UP.pomar.v[lv]; posts.push({ k: 'pomar', cap: c, y: y - (t.since || 0) >= 5 ? v * (cold ? .8 : 1) * bon : 0 }); }
    }
    posts.sort((x, z) => z.y - x.y);
    let rest = lf, food = 0;
    for (const p of posts) { const w = p.y > 0 ? Math.min(rest, p.cap) : 0; food += w * p.y; rest -= w; D(p.k, p.cap, w, w * p.y); }
    const fw = Math.max(0, rest), forage = Math.min(fw, 12) * 1.0 * (dry ? .7 : 1) + Math.max(0, fw - 12) * 0.4;
    food += forage; det.coleta = { n: 0, slots: 0, used: fw, out: forage };
    // madeira
    let wrest = lw, wood = 0;
    for (const t of S.T.filter(t => t.b === 'serraria').sort((a, b) => (b.lv || 1) - (a.lv || 1))) { const [c, v] = UP.serraria.v[(t.lv || 1) - 1], w = Math.min(wrest, c); wood += w * v; wrest -= w; D('serraria', c, w, w * v); }
    wood += Math.max(0, wrest) * 1.6;
    det.lenha = { n: 0, slots: 0, used: Math.max(0, wrest), out: Math.max(0, wrest) * 1.6 };
    // ervas
    let herbs = 0, hrest = lh;
    for (const t of S.T.filter(t => t.b === 'horta').sort((a, b) => (b.lv || 1) - (a.lv || 1))) { const [c, v] = UP.horta.v[(t.lv || 1) - 1], w = Math.min(hrest, c), o = w * v * (t.find === 'ervas' ? 2 : 1); herbs += o; hrest -= w; D('horta', c, w, o); }
    herbs += Math.max(0, hrest) * .7; det.mato = { n: 0, slots: 0, used: Math.max(0, hrest), out: Math.max(0, hrest) * .7 };
    const q = mods.quar ? .75 : 1;
    return { labor, food: food * q, wood: wood * q, herbs: herbs * q, explorers: Math.round(le * q), lf, lw, lh, le, det };
  }
  const herbCover = n => clamp(S.herbs * (hasB('boticario') ? UV('boticario') : 1) / (0.15 * n + 1), 0, 1);
  function explore(n, y) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const front = S.T.filter(t => !t.rev && neighbors(S.T, t).some(nb => nb.rev && TER[nb.t].land));
      if (!front.length) break;
      // prefere terra
      const land = front.filter(t => TER[t.t].land), t = pick(land.length && Math.random() < .8 ? land : front);
      t.rev = true; for (const nb of neighbors(S.T, t)) if (nb.t === 'mar') nb.rev = true;
      if (t.find) out.push(t);
    }
    return out;
  }

  // ---------- um ano ----------
  // mods vem dos eventos (decididos antes)
  function simYear(mods) {
    const y = ++S.year, res = { births: [], deaths: [], marr: 0, finds: [], aff: [] };
    const prod = produce(y, mods);
    // exploração
    const found = explore(prod.explorers, y);
    for (const t of found) {
      const f = FINDS[t.find]; res.finds.push(t);
      if (t.find === 'nauf') S.wood += 40;
      if (t.find === 'caca') S.food += 30;
      note(`${f.i} Exploradores encontraram: ${f.n}.`, 'good');
    }
    let Lv = living();
    // exploradores correm riscos
    if (prod.explorers > 0) for (const p of shuffle(Lv.filter(p => workCap(p, y) >= 1)).slice(0, prod.explorers)) if (bern(.015)) kill(p, y, 'acidente explorando a ilha', res);
    // estoques
    S.food += prod.food; S.wood += prod.wood; S.herbs += prod.herbs;
    Lv = living();
    let need = 0; for (const p of Lv) { const a = age(p, y); need += a < 10 ? .5 : a < 15 ? .8 : a < 70 ? 1 : .8; }
    let deficit = 0;
    if (S.food >= need) S.food -= need; else { deficit = 1 - S.food / need; S.food = 0; }
    S.food *= hasB('celeiro') ? 1 - UV('celeiro') : .85; // parte estraga
    S.herbs = Math.max(0, S.herbs - .05 * Lv.length);
    const hc = herbCover(Lv.length);
    S.lastProd = { ...prod, need, deficit, hc };
    // mortes
    const enf = hasB('enfermaria') ? UV('enfermaria') : 0, fonte = S.T.some(t => t.rev && t.find === 'fonte'), poco = hasB('poco') ? UV('poco') : 0, crowd = Lv.length > housing();
    const swamps = S.T.filter(t => t.rev && t.t === 'pantano').length, malaria = S.flags.malaria ? clamp(swamps / 4, .25, 1) : 0;
    for (const p of Lv) {
      const a = age(p, y);
      let m = baseMort(a);
      const inf = m * .6 * (1 - enf - .3 * hc) * (crowd ? 1.35 : 1);
      m = m * .4 + inf;
      if (a < 1 && fonte) m *= .8;
      if (a < 5 && poco) m *= 1 - poco;
      if (deficit > 0) m += deficit * (a < 5 || a >= 60 ? .45 : .2);
      let cause = deficit > .3 && Math.random() < .5 ? 'fome' : a < 5 ? 'doença infantil' : a >= 60 ? 'velhice' : 'doença';
      // doenças genéticas
      if (affected(p, 'tay') && a >= 2) { m = .65; cause = 'Tay-Sachs'; }
      if (affected(p, 'evc') && a === 0) { m = Math.max(m, .5); cause = 'defeito cardíaco (Ellis-van Creveld)'; }
      if (affected(p, 'fc')) { m += a < 30 ? .12 : .2; cause = 'fibrose cística'; }
      if (affected(p, 'hbs')) { m += .1 + (malaria ? .06 : 0); cause = 'crise falciforme'; }
      if (malaria) {
        const mm = (a < 10 ? .035 : .009) * malaria * (het(p, 'hbs') ? .15 : 1) * (1 - .3 * hc);
        m += mm; if (Math.random() < mm / m) cause = 'malária';
      }
      if (bern(clamp(m, 0, .95))) kill(p, y, cause, res);
    }
    // casamentos
    Lv = living();
    const rule = S.policy.casar === 'primos' && hasB('cartorio') ? 1 / 16 : S.policy.casar === 'primos2' && lvB('cartorio') >= 2 ? 1 / 64 : 0;
    const men = Lv.filter(p => p.sex === 'M' && p.spouse == null && age(p, y) >= 18 && age(p, y) <= 55);
    for (const w of shuffle(Lv.filter(p => p.sex === 'F' && p.spouse == null && age(p, y) >= 16 && age(p, y) <= 40))) {
      if (!bern(.5)) continue;
      const cands = shuffle(men.filter(m => m.spouse == null && age(m, y) >= age(w, y) - 4 && age(m, y) <= age(w, y) + 15));
      let chosen = null;
      for (const m of cands) {
        if (m.mom != null && (m.mom === w.mom || m.dad === w.dad)) continue;      // irmãos e meio-irmãos: sempre proibido
        if (w.mom === m.id || w.dad === m.id || m.mom === w.id) continue;
        const f = phi(w.id, m.id);
        if (rule && f >= rule - 1e-9) continue;
        chosen = m; break;
      }
      if (chosen) {
        w.spouse = chosen.id; chosen.spouse = w.id; res.marr++;
        const f = phi(w.id, chosen.id); S.marriages.push({ y, f });
        if (f >= 1 / 16 - 1e-9 && !S.firsts.primos) { S.firsts.primos = { y, w: w.id, m: chosen.id }; }
      }
    }
    // nascimentos
    const famP = { pequena: .2, normal: .3, grande: .38 }[S.policy.familia];
    for (const w of Lv) {
      if (w.sex !== 'F' || w.spouse == null || !w.alive) continue;
      const a = age(w, y); if (a < 16 || a > 44) continue;
      const h = P(w.spouse); if (!h || !h.alive) { w.spouse = null; continue; }
      let p = famP * (1 - deficit) * (crowd ? .55 : 1) * (a > 38 ? .5 : 1);
      if (bern(p)) {
        const k = childOf(w, h, y); res.births.push(k); S.births++;
        for (const L of LOCI) if (affected(k, L.k)) { S.cases[L.k]++; res.aff.push([k, L.k]); }
      }
    }
    // eventos de fundo
    if (S.flags.cold > y && !S.firsts.coldNote) S.firsts.coldNote = true;
    S.deaths += res.deaths.length;
    snapshot();
    S.minN = Math.min(S.minN, living().length);
    return res;
  }
  function kill(p, y, cause, res) {
    if (!p.alive) return;
    p.alive = false; p.died = y; p.cause = cause;
    if (p.spouse != null) { const s = P(p.spouse); if (s && s.spouse === p.id) s.spouse = null; p.spouse = null; }
    if (res) res.deaths.push(p);
  }

  // ---------- eventos ----------
  // cada evento: cond(), w, run() -> {t, h, choices?: [[rótulo, efeito()]], mods}
  const EVENTS = [
    { k: 'epidemia', w: 3, mult: () => hasB('cais') ? 1.5 : 1, cond: () => yr() > Y0 + 3, run() {
      return { t: '🤒 Epidemia de varíola', h: 'Um marinheiro de passagem trouxe varíola. Crianças pequenas e idosos são os mais vulneráveis.', choices: [
        ['🚧 Quarentena: menos mortes, mas um quarto da produção perdida', () => epidemic(true)],
        ['⚒️ Seguir trabalhando', () => epidemic(false)]] };
    } },
    { k: 'tufao', w: 1.1, cond: () => yr() > Y0 + 18 && S.flags.tufoes < 1 && living().length > 25, run() {
      S.flags.tufoes++;
      const L = living(), frac = rnd(.45, .65), dead = [];
      const fr2 = frac * (hasB('abrigo') ? 1 - UV('abrigo') : 1);
      for (const p of L) if (bern(fr2)) { kill(p, yr(), 'tufão'); dead.push(p); }
      let lost = 0, dmg = 0; for (const t of S.T) if (t.b && t.b !== 'acamp' && !BUILD[t.b].once && bern(.45)) { if ((t.lv || 1) > 1) { t.lv--; dmg++; } else { t.b = null; lost++; } }
      S.food *= .5;
      const after = living(), fr0 = freqs(L), fr1 = freqs(after);
      const big = LOCI.map(l => [l, fr1[l.k] - fr0[l.k]]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
      return { t: '🌀 Tufão!', h: `Ventos de 200 km/h e uma onda gigante varreram a ilha. Morreram <b>${dead.length} de ${L.length}</b> pessoas${hasB('abrigo') ? ' (o abrigo na rocha salvou muita gente)' : ''}, ${lost} construções foram destruídas${dmg ? ` (outras ${dmg}, mais sólidas, só perderam um nível)` : ''} e metade da comida se perdeu.<p>O tufão não escolheu ninguém pelos genes, mas os ${after.length} sobreviventes são uma nova amostra, pequena. Maior mudança: <b>${big[0].n}</b>, de ${pct(fr0[big[0].k])} para ${pct(fr1[big[0].k])}.</p>`, lesson: 'gargalo', bottleneck: true };
    } },
    { k: 'seca', w: 2, cond: () => yr() > Y0 + 5 && S.flags.drought <= yr(), run() { S.flags.drought = yr() + 2; return { t: '☀️ Seca', h: 'Quase não chove. As roças vão render metade por dois anos, e há menos frutos para coletar.' }; } },
    { k: 'frio', w: 1.2, cond: () => !S.flags.frio && yr() > Y0 + 45, run() { S.flags.frio = true; S.flags.cold = yr() + 20; return { t: '❄️ Os invernos ficaram mais frios', h: 'O clima mudou: verões curtos e invernos longos pelos próximos 20 anos. As roças rendem 30% menos. A pesca não muda.' }; } },
    { k: 'malaria', w: 2.5, cond: () => !S.flags.malaria && yr() > Y0 + 12 && S.T.some(t => t.rev && t.t === 'pantano'), run() {
      S.flags.malaria = true;
      return { t: '🦟 Malária', h: 'Um navio trouxe a malária, e os mosquitos dos pântanos a espalharam. Crianças morrem mais. Quanto mais pântano, pior: a drenagem ajuda.<p>Quem é <b>portador do traço falciforme</b> (HbA/HbS) resiste muito melhor.</p>', lesson: 'balanceadora' };
    } },

  function afterTab() {

  // ---------- gráficos ----------
  function lineChart(cv, series, o) {
    const ctx = cv.getContext('2d'), w = cv.width, h = cv.height, pad = 22;
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#0f2a33'; ctx.fillRect(0, 0, w, h);
    const n = Math.max(2, S.hist.length), min = o.min ?? 0, max = o.max ?? 1;
    const X = i => pad + (w - pad - 6) * i / Math.max(n - 1, YEARS), Y = v => h - 14 - (h - 22) * (v - min) / (max - min || 1);
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.fillStyle = '#7d9aa3'; ctx.font = '10px system-ui';
    for (let k = 0; k <= 2; k++) { const v = min + (max - min) * k / 2, yy = Y(v); ctx.beginPath(); ctx.moveTo(pad, yy); ctx.lineTo(w, yy); ctx.stroke(); ctx.fillText(o.pct ? Math.round(v * 100) + '%' : o.int ? Math.round(v) : v.toFixed(2), 2, yy + 3); }
    ctx.fillText(Y0, pad, h - 2); ctx.textAlign = 'right'; ctx.fillText(Y0 + YEARS, w - 4, h - 2); ctx.textAlign = 'left';
    if (o.ref != null) { ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(pad, Y(o.ref)); ctx.lineTo(w, Y(o.ref)); ctx.stroke(); ctx.setLineDash([]); }
    for (const s of series) { ctx.strokeStyle = s.c; ctx.lineWidth = s.w || 2; ctx.beginPath(); s.v.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))); ctx.stroke(); const lv = s.v.at(-1); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(X(s.v.length - 1), Y(lv), 3, 0, 6.3); ctx.fill(); }
    if (o.f0 != null) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(0), Y(o.f0), 3.5, 0, 6.3); ctx.fill(); }
    // eventos de gargalo
    for (const b of S.bottlenecks || []) { const i = b - Y0; ctx.fillStyle = 'rgba(255,90,90,.8)'; ctx.fillRect(X(i) - 1, 2, 2, h - 16); }
  }
  function pyramid(cv) {
    if (!cv) return; const ctx = cv.getContext('2d'), w = cv.width, h = cv.height, y = S.year; ctx.clearRect(0, 0, w, h);
    const bins = 18, m = new Array(bins).fill(0), f = new Array(bins).fill(0);
    for (const p of living()) { const b = Math.min(bins - 1, Math.floor(age(p, y) / 5)); (p.sex === 'M' ? m : f)[b]++; }
    const mx = Math.max(4, ...m, ...f), bh = (h - 10) / bins, cx = w / 2;
    ctx.font = '10px system-ui'; ctx.textAlign = 'center';
    for (let i = 0; i < bins; i++) {
      const yy = h - 6 - (i + 1) * bh;
      ctx.fillStyle = '#64b5f6'; ctx.fillRect(cx - 18 - m[i] / mx * (cx - 30), yy, m[i] / mx * (cx - 30), bh - 2);
      ctx.fillStyle = '#f48fb1'; ctx.fillRect(cx + 18, yy, f[i] / mx * (cx - 30), bh - 2);
      if (i % 2 === 0) { ctx.fillStyle = '#9fb8c0'; ctx.fillText(i * 5, cx, yy + bh - 3); }
    }
  }

  // ---------- pessoa e genealogia ----------

  // ---------------- avançar o tempo ----------------
  function advance(n) {
    if (busy || S.ended) return; busy = true; refresh();
    const step = left => {
      if (left <= 0 || S.ended) { busy = false; refresh(); save(); return; }
      const ev = rollEvent();
      const go = mods => { const res = simYear(mods || {}); sfx.year(); postYear(res, () => { if (!checkEnd()) step(left - 1); else { busy = false; refresh(); } }); };
      if (!ev) { go({}); return; }
      const r = ev.run();
      if (r.bottleneck) { (S.bottlenecks = S.bottlenecks || []).push(S.year); sfx.storm(); }
      else sfx.bad();
      note(`${r.t}`, 'ev');
      if (r.choices) {
        openModal(`<h2>${r.t}</h2><p>${r.h}</p>${lesson(r.lesson)}<div class="btns col">${r.choices.map((c, i) => `<button class="btn ${i ? '' : 'primary'}" data-act="choice" data-v="${i}">${c[0]}</button>`).join('')}</div>`);
        S._choice = i => { const e = r.choices[i][1]() || {}; openModal(`<h2>${r.t}</h2><p>${e.msg || ''}</p>${lesson(e.lesson)}<div class="btns"><button class="btn primary" data-act="close">Continuar</button></div>`, () => go(e.mods)); };
      } else openModal(`<h2>${r.t}</h2><p>${r.h}</p>${lesson(r.lesson)}<div class="btns"><button class="btn primary" data-act="close">Continuar</button></div>`, () => go(r.mods));
    };
    step(n);
  }
  function postYear(res, next) {
    const msgs = [];
    if (res.births.length) note(`👶 ${res.births.length} nascimento(s).`);
    const causes = {}; for (const d of res.deaths) causes[d.cause] = (causes[d.cause] || 0) + 1;
    if (res.deaths.length) note(`✝️ ${res.deaths.length} morte(s): ${Object.entries(causes).map(([c, n]) => `${c} (${n})`).join(', ')}.`);
    if (res.marr) note(`💍 ${res.marr} casamento(s).`);
    // primeiro afetado de cada doença
    for (const [k, l] of res.aff) {
      const key = 'aff_' + l; if (S.firsts[key] || LK[l].kind === 'visivel') continue; S.firsts[key] = S.year;
      const L = LK[l], mom = P(k.mom), dad = P(k.dad), rel = relation(mom, dad);
      sfx.bad();
      msgs.push(`<h2>${L.kind === 'visivel' ? '👶' : '⚠️'} Nasceu ${esc(k.name)}, ${L.kind === 'visivel' ? `com ${L.n.toLowerCase()}` : `com ${L.n}`}</h2>
        <p>${L.d}</p><p>Os pais, ${esc(fullName(mom))} e ${esc(fullName(dad))}, são saudáveis${L.kind === 'visivel' ? '' : ': os dois são <b>portadores</b> sem saber'}. Parentesco entre eles: <b>${rel}</b>${F(k) > 0 ? ` (F do bebê = ${F(k).toFixed(3)})` : ''}.</p>
        ${L.kind === 'visivel' ? '' : `<p class="meta">Frequência do alelo hoje: ${pct(S.hist.at(-1).fr[l])} na colônia, ${pct(L.q)} no continente.</p>`}
        ${L.kind === 'visivel' ? '' : lesson('recessiva')}${l === 'surdo' ? lesson('surdez') : ''}${F(k) >= 1 / 32 ? lesson('endogamia') : ''}`);
    }
    if (S.firsts.primos && !S.firsts.primosShown) { S.firsts.primosShown = true; const w = P(S.firsts.primos.w), m = P(S.firsts.primos.m); msgs.push(`<h2>💍 Casamento entre primos</h2><p>${esc(fullName(w))} e ${esc(fullName(m))} se casaram. São ${relation(w, m)}. Numa colônia pequena, achar alguém sem parentesco fica cada vez mais difícil.</p>${lesson('endogamia')}`); }
    const h = S.hist.at(-1);
    // deriva perceptível
    if (!S.lessons.includes('deriva') && S.year - Y0 >= 25) { const big = LOCI.find(L => Math.abs(h.fr[L.k] - S.founderFreq[L.k]) > .08); if (big) msgs.push(`<h2>🎲 As frequências estão mudando sozinhas</h2><p>Nos fundadores, ${big.n.toLowerCase()} tinha frequência de ${pct(S.founderFreq[big.k])}. Hoje é <b>${pct(h.fr[big.k])}</b>. Ninguém escolheu isso, e a característica não ajuda nem atrapalha a sobreviver.</p>${lesson('deriva')}`); }
    // perda e fixação
    for (const L of LOCI) {
      if (S.foundAlleles[L.k] && h.fr[L.k] === 0 && !S.firsts['lost_' + L.k] && h.N > 0) { S.firsts['lost_' + L.k] = S.year; note(`🧬 O alelo de ${L.n.toLowerCase()} foi perdido.`, 'ev'); msgs.push(`<h2>🧬 Alelo perdido: ${L.n}</h2><p>A última pessoa que carregava o alelo morreu ou não o passou adiante. Agora ele só volta à ilha se chegar algum migrante portador.</p>${lesson('perda')}`); }
      if (h.fr[L.k] === 1 && !S.firsts['fix_' + L.k]) { S.firsts['fix_' + L.k] = S.year; msgs.push(`<h2>🧬 Alelo fixado: ${L.n}</h2><p>Todos na ilha agora são homozigotos para esse alelo.</p>${lesson('perda')}`); }
    }
    if (!S.lessons.includes('sobrenome') && h.sur <= S.founderSurnames / 2 && h.N > 10) msgs.push(`<h2>📛 Sobrenomes sumindo</h2><p>Os fundadores tinham ${S.founderSurnames} sobrenomes diferentes. Hoje restam ${h.sur}.</p>${lesson('sobrenome')}`);
    const show = () => { if (!msgs.length) { refresh(); next(); return; } openModal(msgs.shift() + `<div class="btns"><button class="btn primary" data-act="close">Continuar</button></div>`, show); };
    if (res.births.length && !msgs.length) sfx.birth();
    if (msgs.length) { refresh(); show(); } else { refresh(); setTimeout(next, 90); }
  }
  function checkEnd() {
    const L = living();
    const fert = L.some(p => p.sex === 'F' && age(p, S.year) < 44) && L.some(p => p.sex === 'M' && age(p, S.year) < 60);
    if (L.length === 0 || (!fert && L.length < 12)) { endGame(false); return true; }
    if (S.year >= Y0 + YEARS) { endGame(true); return true; }
    return false;
  }
  function endGame(win) {
    S.ended = true; save(); win ? sfx.end() : sfx.bad();
    const h = S.hist.at(-1), first = S.hist[0], L = living();
    const totAff = LOCI.filter(l => l.kind !== 'visivel').reduce((a, l) => a + S.cases[l.k], 0);
    const expAff = LOCI.filter(l => l.kind !== 'visivel').reduce((a, l) => a + l.q * l.q, 0) * S.births;
    const score = win ? Math.round(h.N * 3 + h.al * 10 + (1 - Math.min(1, h.F * 10)) * 200 - totAff * 5 + S.lessons.length * 20) : 0;
    const rows = LOCI.map(Lc => `<tr><td><span class="dot" style="background:${Lc.col}"></span>${Lc.n}</td><td>${pct(Lc.q)}</td><td>${pct(S.founderFreq[Lc.k])}</td><td><b>${pct(h.fr[Lc.k])}</b></td><td>${Lc.kind === 'visivel' ? '—' : S.cases[Lc.k]}</td></tr>`).join('');
    openModal(`<h2>${win ? `🏆 ${Y0 + YEARS}: a colônia sobreviveu 150 anos!` : `💀 ${S.year}: a colônia acabou`}</h2>
      ${win ? `<p>Hoje vivem <b>${h.N}</b> pessoas na ilha, descendentes de ${first.N} fundadores${S.hist.some(x => x.N > 0) ? '' : ''}. Nasceram ${S.births} crianças ao longo de seis gerações.</p>` : '<p>Não sobrou gente suficiente para continuar. Populações pequenas também correm risco de extinção por puro acaso (estocasticidade demográfica).</p>'}
      <table class="t"><tr><th>Alelo</th><th>Continente</th><th>Fundadores</th><th>Hoje</th><th>Nascidos afetados</th></tr>${rows}</table>
      <p>Doenças recessivas: <b>${totAff}</b> ${totAff === 1 ? 'nascimento' : 'nascimentos'} de afetados. No continente, com o mesmo número de nascimentos, seriam esperados uns <b>${expAff.toFixed(1)}</b>.</p>
      <p>Diversidade nos marcadores neutros: ${first.al} alelos na chegada, <b>${h.al}</b> hoje (o continente tem 64). Endogamia média: <b>${h.F.toFixed(3)}</b>. Sobrenomes: ${S.founderSurnames} → ${h.sur}.</p>
      ${win ? `<p class="score">Pontuação: <b>${score}</b> <span class="meta">(3 × população + 10 × alelos + bônus por pouca endogamia − 5 por afetado + 20 por conceito aprendido)</span></p>` : ''}
      <p class="meta">Conceitos vistos: ${S.lessons.map(k => LESSONS[k][0]).join(', ') || 'nenhum'}.</p>
      <div class="btns"><button class="btn primary" data-act="newgame">⛵ Nova colônia</button><button class="btn" data-act="close">Ver a ilha</button></div>`, null, true);
  }

  // ---------------- ajuda ----------------
  function help() {
    openModal(`<h2>Como jogar</h2>
      <p>⛵ Escolha o navio e a tripulação. Mais colonos trazem mais diversidade, mas a comida acaba mais rápido.</p>
      <p>🗺️ Clique nos hexágonos da ilha para construir: casas (moradia), roças, pesqueiros, serraria, hortas de ervas, enfermaria, registro de famílias, drenagem. Tudo custa madeira.</p>
      <p>⚒️ Na aba <b>Colônia</b>, divida o trabalho entre comida, madeira, ervas e exploração, e defina as leis de casamento e o tamanho das famílias.</p>
      <p>⏭ Avance o tempo de 1 em 1, 5 em 5 ou 10 em 10 anos. A cada ano as pessoas se casam, têm filhos (com genes sorteados dos pais, como Mendel), adoecem e morrem. Epidemias, secas, frio, malária, tufões e navios mudam tudo.</p>
      <p>🧬 Na aba <b>Genética</b>, acompanhe as frequências dos alelos na colônia comparadas às do continente, a diversidade, a endogamia e os sobrenomes. Na aba <b>Pessoas</b>, veja a pirâmide etária, as genealogias e, no modo professor, os genótipos escondidos.</p>
      <p>🏆 Objetivo: chegar a ${Y0 + YEARS} com uma colônia grande, saudável e diversa.</p>
      <div class="btns"><button class="btn primary" data-act="close">Entendi</button></div>`);
  }

  // ---------------- cliques ----------------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    wake();
    const act = b.dataset.act, v = b.dataset.v;
    switch (act) {
      case 'newgame': closeModal(); renderShips(); break;
      case 'continue': if (load()) { screen = 'game'; sel = S.T.find(t => t.home); renderGame(); } break;
      case 'menu': save(); renderTitle(); break;
      case 'help': help(); break;
      case 'close': closeModal(); break;
      case 'ship': pickedShip = SHIPS.find(s => s.k === v); makePool(pickedShip); renderRecruit(); sfx.tick(); break;
      case 'resort': chosen = new Set(shuffle(pool.map(p => p.id)).slice(0, pickedShip.cap)); renderRecruit(); sfx.tick(); break;
      case 'pick': { const id = +v; if (chosen.has(id)) chosen.delete(id); else if (chosen.size < pickedShip.cap) chosen.add(id); renderRecruit(); sfx.tick(); break; }
      case 'sail': sail(); break;
      case 'tab': tab = v; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); refreshTab(); break;
      case 'tile': if (screen !== 'game') break; if (bmode === 'up' && !busy) { const t = S.T[+v]; if (canUp(t)) { if (!doUpgrade(t)) toast(needSchool(t) ? 'O nível 3 exige a 🏫 Escola.' : `Falta madeira: precisa de 🪵 ${upCost(t.b, t.lv || 1)}.`); else break; } } else if (bmode && !busy) { const t = S.T[+v]; if (canBuild(bmode, t)) { doBuild(bmode, t); break; } bmsg = ''; } sel = S.T[+v]; const m = $('.mapwrap'); if (m) m.innerHTML = mapSVG(); $('#tileBox').innerHTML = tileBox(); break;
      case 'build': if (sel && !busy) doBuild(v, sel); break;
      case 'bmode': bmode = v && bmode !== v ? v : null; bmsg = ''; refresh(); sfx.tick(); break;
      case 'guide': guide(); break;
      case 'upgrade': if (sel && !busy) doUpgrade(sel); break;
      case 'trade': { const used = S.tradeY === S.year ? S.tradeN : 0; if (used >= lvB('cais') || S.wood < 20) break; S.wood -= 20; if (v === 'food') S.food += 15; else S.herbs += 8; S.tradeY = S.year; S.tradeN = used + 1; note(v === 'food' ? '⚓ Trocou 20 de madeira por 15 de comida.' : '⚓ Trocou 20 de madeira por 8 de ervas.'); sfx.good(); refresh(); break; }
      case 'pol': S.policy[b.dataset.k] = v; refreshTab(); sfx.tick(); break;
      case 'adv': advance(+v); break;
      case 'choice': S._choice && S._choice(+v); break;
      case 'person': personModal(+v); break;
      case 'teacher': teacher = b.checked; refreshTab(); break;
    }
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && bmode) { bmode = null; bmsg = ''; refresh(); } });
  { const sb = document.getElementById('soundBtn'); if (sb) { const b = document.createElement('button'); b.id = 'songBtn'; b.className = 'soundbtn'; b.type = 'button'; b.title = 'Trocar a música'; b.textContent = '🎵 ' + SONGS[songKey][0]; b.addEventListener('click', () => { switchSong(); b.blur(); }); sb.parentNode.insertBefore(b, sb); } }
  window.__F = { SONGS, Sound, get S() { return S; }, get PEOPLE() { return PEOPLE; }, advance, living, makePool, sail, SHIPS, renderShips, get busy() { return busy; }, set pickedShip(s) { pickedShip = s; } };
  renderTitle();

})();
</script>
</body>
</html>
