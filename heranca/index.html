<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herança — o jogo da vida e dos genes</title>
<style>
  :root { --bg:#1b2b44; --panel:#ffffff; --ink:#1d2433; --muted:#6b7280; --line:#d8dee9; --accent:#e63946; --good:#1f9d55; --bad:#d62839; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:radial-gradient(1200px 600px at 50% -20%, #2c4a74, transparent 70%), var(--bg); color:var(--ink); font:14px/1.45 'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height:100vh; }
  button { font:inherit; cursor:pointer; }
  .wrap { max-width:1400px; margin:0 auto; padding:12px 12px 40px; }
  header.top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; color:#fff; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { margin:0; font:900 26px/1 system-ui, sans-serif; letter-spacing:.06em; }
  .brand h1 span { color:#ffd23f; }
  .brand small { display:block; color:#b9c7e0; font-size:12px; margin-top:2px; }
  .res { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .pill { background:#24395c; border:1px solid #3b5786; border-radius:999px; padding:3px 11px; font-size:13px; color:#fff; }
  .pill b { color:#ffd23f; }
  .ghost, .soundbtn { background:transparent; border:1px solid #3b5786; color:#b9c7e0; border-radius:8px; padding:4px 10px; font-size:12px; }
  .ghost:hover, .soundbtn:hover { color:#fff; border-color:#7aa0d8; }
  .ghost.dark { color:#1d2433; border-color:#c9d3e3; }
  .ghost.dark:disabled { opacity:.4; }
  .layout { display:grid; grid-template-columns:minmax(0, 1fr) 330px; gap:12px; align-items:start; }
  .layout { grid-template-areas:"board side" "hands side"; }
  .layout > .boardwrap { grid-area:board; } .layout > .side { grid-area:side; } .layout > .hands { grid-area:hands; min-width:0; }
  @media (max-width:980px) { .layout { grid-template-columns:minmax(0, 1fr); grid-template-areas:"board" "side" "hands"; } }
  .boardwrap { border-radius:18px; overflow:hidden; box-shadow:0 10px 30px #0008; }
  .boardwrap { max-height:calc(100vh - 96px); overflow:auto; border-radius:18px; scrollbar-width:thin; }
  @media (max-width:980px) { .boardwrap { max-height:70vh; } }
  @media (max-width:700px) { svg.board { min-width:700px; } }
  svg.board { display:block; width:100%; height:auto; }
  svg.board .road { stroke:#f4f1de; stroke-width:16; stroke-linecap:round; opacity:.85; }
  svg.board .ic { font-size:26px; text-anchor:middle; pointer-events:none; }
  svg.board .ic.sm { font-size:14px; }
  svg.board .tile { stroke:#1d1d1d; stroke-width:2.5; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  svg.board .stop .tile { stroke-width:4; }
  svg.board .tl { font:800 12.5px system-ui; fill:#1d2433; text-anchor:middle; pointer-events:none; }
  svg.board .pare { font:900 8.5px system-ui; fill:#fff; text-anchor:end; paint-order:stroke; stroke:#c0392b; stroke-width:3; letter-spacing:.5px; }
  svg.board .tage { font:800 10px system-ui; fill:#1d2433; opacity:.7; pointer-events:none; }
  svg.board .tokg { filter:drop-shadow(0 2px 1px rgba(0,0,0,.45)); }
  .tokpick { display:flex; flex-wrap:wrap; gap:4px; width:100%; margin:4px 0 6px 18px; }
  .tok { display:flex; flex-direction:column; align-items:center; background:#fff; border:2px solid #ddd; border-radius:10px; padding:2px 4px 3px; cursor:pointer; font:600 10px system-ui; color:#444; }
  .tok.on { border-color:var(--c); box-shadow:0 0 0 2px var(--c); background:#fffbe8; }
  .tok:hover { border-color:var(--c); }
  svg.board .bl { fill:#fff; font:800 15px system-ui; paint-order:stroke; stroke:#1d4d30; stroke-width:4; }
  svg.board .tokg.curcar { filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 3px #ffd23f); }
  svg.board .float { fill:#ffd23f; font:900 16px system-ui; text-anchor:middle; paint-order:stroke; stroke:#1d2433; stroke-width:4; animation:up 1s ease-out forwards; }
  @keyframes up { to { transform:translateY(-22px); opacity:0; } }
  .side { display:flex; flex-direction:column; gap:10px; }
  .panel { background:var(--panel); border-radius:14px; padding:12px; box-shadow:0 6px 18px #0005; }
  .panel.now { border:3px solid; }
  .ph { display:flex; gap:8px; align-items:center; }
  .wheelbox { display:flex; gap:12px; align-items:center; margin:8px 0; }
  #wheel { transition:transform 1.25s cubic-bezier(.2,.8,.25,1); transform-origin:0 0; }
  svg .wn { fill:#111; font:900 13px system-ui; text-anchor:middle; }
  .last { margin-top:6px; font-size:13px; }
  .money { font-size:22px; font-weight:900; color:var(--good); }
  .neg { color:var(--bad); }
  .pos { color:var(--good); }
  .meta { color:var(--muted); font-size:12.5px; }
  details summary { cursor:pointer; font-weight:700; margin:6px 0 2px; }
  table.gtab { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.gtab td, table.gtab th { border-bottom:1px solid var(--line); padding:3px 4px; vertical-align:top; text-align:left; }
  table.gtab.full th { font-size:11.5px; background:#f3f5f9; }
  .mono { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700; }
  .q { color:#c27c0e; }
  .kid { font-size:13px; margin:2px 0; }
  .orow { display:flex; align-items:center; gap:6px; font-size:13px; padding:2px 0; }
  .orow span:last-child { margin-left:auto; font-weight:700; }
  .orow.on { font-weight:800; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; border:1.5px solid #222; flex:0 0 12px; }
  .log { max-height:180px; overflow:auto; font-size:12.5px; }
  .log p { margin:3px 0; padding-left:7px; border-left:2px solid var(--line); }
  .btn { background:#eef2f8; border:1.5px solid #c9d3e3; color:var(--ink); border-radius:10px; padding:6px 12px; font-weight:800; font-size:13.5px; }
  .btn:hover:not(:disabled) { border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.on { background:#1d2433; color:#fff; border-color:#1d2433; }
  .btn.big { font-size:16px; padding:9px 18px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .opt { display:block; width:100%; text-align:left; background:#f6f8fc; border:1.5px solid #d3dbea; border-radius:10px; padding:8px 10px; margin:6px 0; color:var(--ink); }
  .opt:hover:not(:disabled) { border-color:var(--accent); }
  .opt:disabled { opacity:.55; cursor:not-allowed; }
  .card { border:1.5px solid var(--line); border-radius:10px; padding:8px; margin:6px 0; }
  .big { font-size:22px; font-weight:900; margin:6px 0; }
  .lesson { background:#eef6ff; border-left:4px solid #2a9df4; border-radius:8px; padding:8px 10px; margin:8px 0; font-size:13.5px; }
  .hand { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
  .gcard { width:86px; min-height:96px; border-radius:9px; background:#fff; border:2px solid var(--c); box-shadow:0 2px 6px #0003; padding:5px; font-size:11.5px; line-height:1.2; display:flex; flex-direction:column; gap:3px; cursor:help; }
  .gcard .ct { background:var(--c); color:#fff; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; border-radius:4px; padding:1px 4px; align-self:flex-start; }
  .gcard b { font-size:12.5px; }
  .gcard .cs { color:var(--muted); font-size:10.5px; }
  .gcard.good { background:#effaf2; }
  .gcard.back { background:repeating-linear-gradient(45deg, #1d3557, #1d3557 6px, #24406a 6px, #24406a 12px); border-color:#0f1f36; align-items:center; justify-content:center; color:#ffd23f; font-size:22px; position:relative; }
  .gcard.back i { position:absolute; bottom:4px; right:7px; font-style:normal; font-size:13px; font-weight:900; }
  .gcard.flip { animation:flip .6s ease; }
  @keyframes flip { from { transform:rotateY(90deg); } to { transform:rotateY(0); } }
  .hand.small .gcard { width:66px; min-height:70px; font-size:10px; padding:3px; }
  .hand.small .gcard b { font-size:10.5px; }
  .hand.small .gcard .cs { display:none; }
  .hand.small .gcard.back { font-size:16px; }
  .revealed { display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:#fff8e1; border:1px dashed #e0b400; border-radius:10px; padding:6px; margin:8px 0; }
  .flood { background:#e3f2fd; border-left:4px solid #1976d2; border-radius:6px; padding:6px 8px; }
  table.risk { border-collapse:collapse; width:100%; font-size:13.5px; margin:6px 0; }
  table.risk td { padding:3px 6px; border-bottom:1px solid var(--line); }
  table.risk td:last-child { text-align:right; font-weight:800; }
  table.risk tr.tot td { border-top:2px solid #333; font-weight:900; }
  .riskbar { position:relative; height:16px; background:#e8f5e9; border-radius:8px; overflow:visible; margin:8px 0; }
  .riskbar i { display:block; height:100%; background:linear-gradient(90deg, #ff9f43, #d62839); border-radius:8px; }
  .riskbar b { position:absolute; top:-5px; width:4px; height:26px; background:#1d2433; border-radius:2px; transform:translateX(-2px); }
  .glist { padding-left:18px; margin:6px 0; }
  .glist li { margin:3px 0; }
  .others { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px; margin-top:10px; }
  .orow2 { border-left:5px solid; padding:8px 10px; font-size:13px; }
  .orow2.on { box-shadow:0 0 0 3px #ffd23f; }
  .hlab { margin-top:8px; font-weight:800; }
  svg.board .ic.small { font-size:12px; }
  svg.board .sea { fill:#1e88e5; opacity:.75; }
  svg.board .agem rect { fill:#ffd23f; stroke:#1d2433; stroke-width:1.5; }
  svg.board .agem text { font:800 12.5px system-ui; fill:#1d2433; text-anchor:middle; }
  .wheelbox { align-items:flex-start; }
  .wcol { display:flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; }
  .wcol svg { width:120px; height:120px; }
  .wcol .btn { width:100%; }
  .wcol .last { font-size:11px; text-align:center; }
  .sb { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .sbr { border-left:4px solid; background:rgba(0,0,0,.04); border-radius:6px; padding:3px 6px; font-size:12px; }
  .sbr.on { background:#fff6c7; box-shadow:0 0 0 2px #ffd23f; }
  .sbn { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sbm { font-weight:800; font-size:13px; }
  .sbi { display:flex; flex-wrap:wrap; gap:2px 7px; color:#555; font-size:11px; }
  .invrow { border:1px solid #ddd; border-radius:8px; padding:6px 8px; margin:6px 0; }
  table.tx td, table.tx th { font-size:12px; padding:3px 6px; }
  .evcard { background:#fffbe8; border:2px dashed #e0b400; border-radius:10px; padding:4px 12px; }
  .mono.small { font-size:11px; font-weight:600; }
  .modal-bg { position:fixed; inset:0; background:#0b1424cc; display:flex; align-items:center; justify-content:center; padding:14px; z-index:40; }
  .modal { background:#fff; border-radius:18px; padding:18px; width:min(620px, 100%); max-height:90vh; overflow:auto; box-shadow:0 20px 60px #000a; }
  .modal h3 { margin:0 0 8px; font-size:21px; }
  .title { text-align:center; color:#fff; padding:16px 8px; }
  .title h2 { font:900 56px system-ui; letter-spacing:.12em; margin:0; color:#ffd23f; text-shadow:0 4px 0 #b3361f; }
  .title .tl { color:#cfe0ff; font-size:17px; margin:2px 0 16px; }
  .setup { max-width:640px; margin:0 auto; text-align:left; color:var(--ink); }
  .prow { display:flex; gap:6px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  input.txt { border:1.5px solid #c9d3e3; border-radius:8px; padding:6px 8px; font:inherit; width:150px; }
  table.score { width:100%; border-collapse:collapse; }
  table.score td, table.score th { padding:6px; border-bottom:1px solid var(--line); text-align:left; }
  .fam { border-left:5px solid; padding:6px 10px; margin:10px 0; background:#fafbfe; border-radius:8px; }
  .scrollx { overflow-x:auto; }
  .toast-box { position:fixed; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(360px, 92vw); }
  .toast { background:#fff; border-radius:10px; padding:8px 12px; box-shadow:0 6px 20px #0007; font-size:13.5px; }
  .backlink { color:#b9c7e0; text-decoration:none; font-size:13px; display:inline-block; margin-bottom:6px; }
  .backlink:hover { color:#fff; }
  .backlink[hidden] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" id="backlink" href="../" hidden>← Todos os jogos</a>
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="-22 -22 44 44" aria-hidden="true"><circle r="20" fill="#ffd23f" stroke="#b3361f" stroke-width="3"/><g stroke="#b3361f" stroke-width="2.5"><path d="M-9 -12 C 9 -6, -9 6, 9 12"/><path d="M9 -12 C -9 -6, 9 6, -9 12"/></g><path d="M-6 -7H6M-4 0H4M-6 7H6" stroke="#1d2433" stroke-width="2"/></svg>
      <div><h1>HERAN<span>ÇA</span></h1><small>o jogo da vida e dos genes</small></div>
      <button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button>
    </div>
    <div class="res" id="res"></div>
  </header>
  <main id="main"></main>
</div>
<div class="toast-box" id="toasts"></div>
<div id="modalRoot"></div>
<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    try { muted = localStorage.getItem('heranca-mudo') === '1'; } catch (e) {}
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = ac.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(musicBus); osc.start(time); osc.stop(time + dur + 0.03);
    }
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.15) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);
    }
    function toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.5;
      try { localStorage.setItem('heranca-mudo', muted ? '1' : '0'); } catch (e) {}
      updateSoundButton();
      return muted;
    }
    return { ensure, tone, noise, arp, note, music, toggle, get muted() { return muted; } };
  })();
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundButton() { if (soundBtn) { soundBtn.textContent = Sound.muted ? '🔇 Som desligado (M)' : '🔊 Som ligado (M)'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } }
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.ensure(); Sound.toggle(); soundBtn.blur(); });
  updateSoundButton();
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { Sound.ensure(); Sound.toggle(); } });
  // links "todos os jogos" só aparecem no site publicado
  for (const a of document.querySelectorAll('.backlink')) if (!/github\.io$/.test(location.hostname)) a.hidden = true;

  // =====================================================================
  // UTILITÁRIOS
  // =====================================================================
  const rand = n => Math.floor(Math.random() * n);
  const pick = a => a[rand(a.length)];
  const ri = (a, b) => a + rand(b - a + 1);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const money = v => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(Math.round(v)).toLocaleString('pt-BR');
  const pct = x => `${Math.round(x * 100)}%`;

  // =====================================================================
  // GENOMA (a base é a população comum; as cartas sorteadas definem o que cada pessoa tem de especial)
  // =====================================================================
  const bern = p => Math.random() < p;
  function baseGenome(sex) {
    const g = {
      abo: [pick(['O', 'O', 'O', 'A', 'A', 'B']), pick(['O', 'O', 'O', 'A', 'A', 'B'])], rh: ['D', bern(.25) ? 'd' : 'D'],
      fut: ['H', bern(.1) ? 'h' : 'H'],            // FUT1: hh = fenótipo Bombay ("falso O")
      hbb: ['A', 'A'], cftr: ['F', 'F'], fh: ['h', 'h'],
      lct: ['L', bern(.4) ? 'L' : 'l'], actn: [bern(.6) ? 'R' : 'X', bern(.6) ? 'R' : 'X'],
      apoe: [pick(['e3', 'e3', 'e3', 'e2']), pick(['e3', 'e3', 'e3', 'e2', 'e4'])],
      dm: Array.from({ length: 8 }, () => bern(.3) ? 1 : 0), has: Array.from({ length: 8 }, () => bern(.3) ? 1 : 0),
      alt: Array.from({ length: 6 }, () => bern(.5) ? 1 : 0),
      lon: ['g', bern(.1) ? 'G' : 'g'],              // variante de longevidade (tipo FOXO3)
      hla: [ri(1, 24), ri(1, 24)],                     // haplótipos HLA (compatibilidade para transplantes)
    };
    g.dal = sex === 'M' ? ['N'] : ['N', bern(.08) ? 'd' : 'N'];
    return g;
  }
  function childGenome(mom, dad, sex) {
    const g = {};
    for (const l of ['abo', 'rh', 'fut', 'hbb', 'cftr', 'fh', 'lct', 'actn', 'apoe', 'lon', 'hla']) g[l] = [pick(mom[l]), pick(dad[l])];
    for (const l of ['dm', 'has', 'alt']) { g[l] = []; for (let i = 0; i < mom[l].length / 2; i++) { g[l].push(mom[l][2 * i + rand(2)]); g[l].push(dad[l][2 * i + rand(2)]); } }
    g.dal = sex === 'M' ? [pick(mom.dal)] : [pick(mom.dal), dad.dal[0]];
    return g;
  }
  const n = (g, l, a) => g[l].filter(x => x === a).length;
  const has = (g, l, a) => g[l].includes(a);
  const sum = a => a.reduce((x, y) => x + y, 0);
  function blood(g) {
    if (n(g, 'fut', 'h') === 2) return 'O' + (has(g, 'rh', 'D') ? '+' : '−'); // Bombay: sem antígeno H, parece O na tipagem
    const s = new Set(g.abo); const t = s.has('A') && s.has('B') ? 'AB' : s.has('A') ? 'A' : s.has('B') ? 'B' : 'O';

      if (Math.random() < (fam ? .4 : (h === 'sed' || h === 'dieta' ? .08 : 0))) k.habits[h] = true;
    }
    if (k.habits.sed && k.habits.ativo) delete k.habits.sed;
    k.cards = cardsFromGenome(k).map(x => ({ k: x, rev: false }));
    return { k, mom, dad };
  }
  function baby(p, show) {
    if (!p.spouse) { addCash(p, -2000); show('👶 Batizado do afilhado', `<p>${esc(p.name)} virou padrinho/madrinha e deu um presente (${money(-2000)}).</p>`); return; }
    if (p.kids.length >= 6) { show('👶 Carro lotado', '<p>O carro já está cheio! Vocês decidiram não ter mais filhos.</p>'); return; }
    const twins = Math.random() < .14 && p.kids.length <= 4, mz = twins && Math.random() < .4;
    const made = [makeKid(p)];
    if (twins) {
      if (mz) { const a = made[0].k, b = { ...a, g: JSON.parse(JSON.stringify(a.g)), habits: { ...a.habits }, cards: a.cards.map(c => ({ ...c })), name: pick(a.sex === 'M' ? NAMES_M : NAMES_F) }; a.mz = b.mz = Date.now(); made.push({ k: b, mom: made[0].mom, dad: made[0].dad }); }
      else made.push(makeKid(p));
    }
    let extra = '', cost = 0;
    for (const { k, mom, dad } of made) {
      p.kids.push(k);
      const K = ph(k);
      if (ph(mom).rhNeg && !K.rhNeg) { cost += 1500; extra += `<p>🩸 ${esc(mom === p ? 'Você' : mom.name)} é Rh− e ${esc(k.name)} é Rh+: anti-D aplicada depois do parto.</p>${mom === p ? revealCards(p, ['rhneg']) : ''}${lesson('rh')}`; }
      if (K.sickle || K.cf) { extra += `<p>🦶 O <b>teste do pezinho</b> detectou ${K.sickle ? 'anemia falciforme (HbS/HbS)' : 'fibrose cística (f/f)'} em ${esc(k.name)}. Tratamento desde já.</p>${revealCards(p, K.sickle ? ['hbs'] : ['cf'])}${lesson('pezinho')}`; }
      if (ph(mom).blood.startsWith('O') && ph(dad).blood.startsWith('O') && !K.blood.startsWith('O') && !K.bombay) {
        extra += `<p>🧩 <b>Mistério:</b> os dois pais têm sangue tipo O na tipagem, mas ${esc(k.name)} nasceu com sangue <b>${K.blood}</b>. Um dos pais carrega A ou B "escondido" pelo fenótipo Bombay.</p>${revealCards(p, ['bombay'])}${lesson('bombay')}`;
      }
    }
    if (cost) addCash(p, -(p.insured ? cost / 2 : cost));
    sfx.baby();
    log(`${p.name} teve ${twins ? 'gêmeos' : 'um bebê'}: ${made.map(m => m.k.name).join(' e ')}.`);
    const famLesson = p.kids.length >= 2 ? lesson('familia') : '';
    if (twins) extra += `<p>👯 ${mz ? '<b>Gêmeos idênticos</b>: vieram do mesmo zigoto e têm exatamente o mesmo genoma (e o mesmo sexo).' : '<b>Gêmeos fraternos</b>: dois óvulos, dois espermatozoides. São tão parecidos quanto quaisquer irmãos.'}</p>${lesson('gemeos')}`;
    show(`👶 ${twins ? (mz ? 'Gêmeos idênticos!' : 'Gêmeos!') : 'Nasceu!'}`, made.map(({ k }) => `<div class="card"><b>${esc(k.name)}</b> ${k.sex === 'F' ? '♀' : '♂'} · ${k.cards.length} carta(s) virada(s) para baixo<div class="hand small">${k.cards.map(c => cardHTML(c.k, false)).join('')}</div></div>`).join('') + extra + lesson('filho') + famLesson);
  }
  function lab(p, done) {
    const free = p.career === 'gen', price = free ? 0 : S.labPrice;
    const opts = [];
    const hidden = x => x.cards.some(c => !c.rev && (CARDS[c.k].cat === 'gen' || CARDS[c.k].cat === 'risk'));
    if (hidden(p)) opts.push(['self', `Sequenciar ${p.name}`]);
    if (p.spouse && hidden(p.spouse)) opts.push(['spouse', `Sequenciar ${p.spouse.name}`]);
    if (p.cpu) {
      for (const [k] of opts) if (free || p.cash > 20000) { if (!free) addCash(p, -price); seqAll(k === 'self' ? p : p.spouse); }
      toast(`<b style="color:${p.color}">${esc(p.name)}</b> passou no laboratório`); done(); return;
    }
    modal(`<h3>🔬 Laboratório de genética</h3>
      <p>O sequenciamento revela as cartas <b>genéticas</b> e de <b>risco poligênico</b>${free ? ' (de graça para geneticistas!)' : ` por ${money(price)} por pessoa`}. Hábitos e crenças não aparecem no DNA.</p>
      ${p.neg && false ? '' : ''}
      ${p.habits.neg ? '<p class="meta">Sua carta "Desconfiança da ciência" faria você recusar o exame… mas aqui a curiosidade venceu.</p>' : ''}
      ${opts.length ? opts.map(([k, t]) => `<button class="opt" data-act="lab" data-v="${k}">${t}${free ? '' : ` (${money(price)})`}</button>`).join('') : '<p>Todas as cartas genéticas da família já foram reveladas.</p>'}
      ${p.spouse && !hidden(p) && !hidden(p.spouse) ? coupleRisk(p) : ''}
      <div class="btns"><button class="btn primary" data-act="close">Sair do laboratório</button></div>`, done);
  }
  function seqAll(x) { for (const c of x.cards) if (CARDS[c.k].cat === 'gen' || CARDS[c.k].cat === 'risk') c.rev = true; x.seq = true; }
  function coupleRisk(p) {
    const a = p, b = p.spouse, out = [];
    const c2 = (x, l, al) => n(x.g, l, al);
    if (c2(a, 'hbb', 'S') && c2(b, 'hbb', 'S')) out.push('Anemia falciforme: <b>25%</b> por filho');
    if (c2(a, 'cftr', 'f') && c2(b, 'cftr', 'f')) out.push('Fibrose cística: <b>25%</b> por filho');
    if (has(a.g, 'fh', 'H') || has(b.g, 'fh', 'H')) out.push('Hipercolesterolemia familiar: <b>50%</b> por filho (dominante)');
    const e4 = c2(a, 'apoe', 'e4') + c2(b, 'apoe', 'e4'); if (e4) out.push(`APOE ε4: cada filho tem ${e4 >= 3 ? 'pelo menos uma cópia com certeza' : e4 === 2 && (c2(a, 'apoe', 'e4') === 2 || c2(b, 'apoe', 'e4') === 2) ? '100% de chance de ao menos uma cópia' : e4 === 2 ? '75% de chance de ao menos uma cópia' : '50% de chance de uma cópia'} (fator de risco, não diagnóstico)`);
    if (c2(a, 'fut', 'h') && c2(b, 'fut', 'h')) out.push('Fenótipo Bombay: possível nos filhos');
    return `<div class="lesson"><b>Aconselhamento genético do casal</b><br>${out.length ? out.join('<br>') : 'Nenhum risco aumentado nas variantes testadas.'}</div>${lesson('teste')}`;
  }

  // ---------- check-up: revela hábitos e oferece mudança ----------
  function checkup(p, done, title) {
    const keys = p.cards.filter(c => ['hab', 'cren', 'risk'].includes(CARDS[c.k].cat) || c.k === 'fh').map(c => c.k);
    const revealedHtml = revealCards(p, keys);
    if (has(p.g, 'fh', 'H') && !p.treatFH) p.treatFH = true;
    const fixable = p.cards.filter(c => c.rev && CARDS[c.k].fix);
    if (p.cpu) {
      for (const c of fixable) if (p.cash > 15000) tryFix(p, c.k);
      toast(`<b style="color:${p.color}">${esc(p.name)}</b> fez um check-up`); done(); return;
    }
    modal(`<h3>${title || '🩺 Check-up'}</h3><p>Exames de sangue, pressão e uma conversa franca sobre hábitos.${p.treatFH && keys.includes('fh') ? ' O colesterol alto foi tratado.' : ''}</p>${revealedHtml}
      ${fixable.length ? `<p><b>Quer mudar algum hábito?</b> Mudar hábitos reduz o risco das doenças multifatoriais.</p>${fixable.map(c => { const F = CARDS[c.k].fix; return `<button class="opt" data-act="fix" data-v="${c.k}">${F.n} · ${money(F.c)} · chance de sucesso ${pct(F.ok)}<br><span class="meta">${CARDS[c.k].n}: ${CARDS[c.k].d}</span></button>`; }).join('')}` : '<p class="meta">Nenhum hábito para mudar agora.</p>'}
      <div class="btns"><button class="btn primary" data-act="close">Sair do consultório</button></div>`, done);
  }
  function tryFix(p, k) {
    const F = CARDS[k].fix; if (!F || p.cash < F.c) return null;
    addCash(p, -F.c);
    const ok = Math.random() < F.ok;
    if (ok) {
      delete p.habits[k]; p.cards = p.cards.filter(c => c.k !== k);
      if (F.to) { p.habits[F.to] = true; p.cards.push({ k: F.to, rev: true }); }
      log(`${p.name} conseguiu: ${F.n}.`);
    } else log(`${p.name} tentou (${F.n}), mas teve uma recaída.`);
    return ok;
  }

  // ---------- doenças multifatoriais ----------
  function health(p, show) {
    const late = BOARD[p.pos].age >= 65;
    const pool = DISEASES.filter(d => !p.dis[d.k] && (!d.late || late));
    if (!pool.length) { show('🫀 Saúde em dia', '<p>Nada de novo nos exames.</p>'); return; }
    const scored = pool.map(d => { const f = d.f(p), r = clamp(f.reduce((a, x) => a + x[1], 0), .01, .9); return { d, f, r }; });
    let tot = scored.reduce((a, s) => a + s.r + .05, 0), x = Math.random() * tot, sel = scored[0];
    for (const s of scored) { x -= s.r + .05; if (x <= 0) { sel = s; break; } }
    const { d, f, r } = sel, roll = Math.random(), sick = roll < r;
    const keys = f.filter(z => z[1] !== 0 && z[2]).map(z => z[2]);
    let cost = 0;
    if (sick) { p.dis[d.k] = true; cost = d.cost * (p.insured ? .5 : 1); addCash(p, -cost); p.chronic += d.chronic; if (d.k === 'iam' && has(p.g, 'fh', 'H')) p.treatFH = true; sfx.lose(); } else sfx.good();
    log(`${p.name}: risco de ${d.n} ${pct(r)} → ${sick ? 'teve a doença' : 'escapou'}.`);
    const rows = f.filter(z => z[1] !== 0).map(z => `<tr><td>${z[0]}</td><td class="${z[1] > 0 ? 'neg' : 'pos'}">${z[1] > 0 ? '+' : '−'}${pct(Math.abs(z[1]))}</td></tr>`).join('');
    const body = `<p>Os anos passam. Seu risco de <b>${d.n}</b> nesta fase da vida:</p>
      <table class="risk">${rows}<tr class="tot"><td>Risco total</td><td>${pct(r)}</td></tr></table>
      <div class="riskbar"><i style="width:${r * 100}%"></i><b style="left:${roll * 100}%"></b></div>
      <p class="big ${sick ? 'neg' : 'pos'}">${sick ? `Diagnóstico: ${d.n}. ${money(-cost)}${d.chronic ? ` e tratamento contínuo de ${money(-d.chronic * (p.insured ? .5 : 1))} a cada pagamento` : ''}` : 'Saudável desta vez!'}</p>
      ${p.insured && sick ? '<p class="meta">🛡️ O plano pagou metade.</p>' : ''}
      ${revealCards(p, keys)}${lesson('multi')}${d.k === 'alz' ? lesson('apoe') : ''}${keys.some(k => k === 'fumo' || k === 'alcool') ? lesson('vicio') : ''}`;
    show(`🫀 ${d.n}`, body);
  }

  function house(p, done) {
    const H = [{ n: 'Apartamento na cidade', loc: 'cidade', c: 40000, v: 55000 }, { n: 'Casa na encosta', loc: 'encosta', c: 30000, v: 45000 }, { n: 'Casa com quintal', loc: 'quintal', c: 80000, v: 115000 }, { n: 'Casa de praia', loc: 'praia', c: 140000, v: 200000 }];
    if (p.house) { done(); return; }
    if (p.cpu) { const h = H.filter(x => x.c <= p.cash + 20000).sort((a, b) => b.c - a.c)[0] || H[1]; addCash(p, -h.c); p.house = { ...h }; toast(`<b style="color:${p.color}">${esc(p.name)}</b> comprou: ${h.n}`); log(`${p.name} comprou ${h.n}.`); done(); return; }
    modal(`<h3>🏠 Compra da casa</h3><p>No fim, a casa vale mais do que custou… se o clima deixar. Encostas sofrem com chuvas extremas, e casas de praia com a subida do mar.</p>
      ${H.map((h, i) => `<button class="opt" data-act="house" data-v="${i}"><b>${h.n}</b> · custa ${money(h.c)} · vale ${money(h.v)} na aposentadoria</button>`).join('')}
      <div class="btns"><button class="btn" data-act="close">Continuar de aluguel</button></div>`, done);
    S._houses = H;
  }
  function retire(p, show) {
    const base = baseSalary(p), rate = p.sector === 'pub' || p.career === 'milc' ? .9 : .5;
    p.pension = Math.round(base * rate);
    sfx.good();
    log(`${p.name} se aposentou (aposentadoria de ${money(p.pension)}).`);
    show(`🏖️ ${esc(p.name)} se aposentou aos 65!`, `<p>Daqui para frente, cada dia de pagamento paga a aposentadoria: <b>${money(p.pension)}</b> (${pct(rate)} do salário${rate < .9 ? ', porque no setor privado o benefício é menor' : ''}).</p>${invTotal(p) ? `<p>Seus investimentos somam ${money(invTotal(p))} e continuam rendendo.</p>` : '<p class="meta">Você não tem investimentos. Eles ajudariam a completar a renda agora.</p>'}${lesson('previdencia')}`);
  }

  // =====================================================================
  // EVENTOS GLOBAIS (no começo de cada rodada)
  // =====================================================================
  function globalEvent() {
    const pool = GLOBAL.flatMap(g => Array(g.w).fill(g)).filter(g => !(g.k === 'mar' && S.sea >= 3) && !(g.k === 'precisao' && S.labPrice < 5000) && !(g.k === 'crise' && S.econ));
    const G = pick(pool), act = S.players.filter(p => !p.done), lines = [];
    let intro = '', les = '';
    const pay = (p, v, why, med) => { if (med && v < 0 && p.insured) v = Math.round(v / 2); addCash(p, v, true); lines.push(`<li><b style="color:${p.color}">${esc(p.name)}</b>: ${why} <b class="${v >= 0 ? 'pos' : 'neg'}">${v ? (v > 0 ? '+' : '') + money(v) : ''}</b></li>`); };
    if (G.k === 'pandemia') {
      intro = 'Um vírus novo se espalha pelo mundo. Vacinas chegam rápido, de graça, pelo SUS.';
      for (const p of act) {
        if (p.habits.neg) { reveal(p, 'neg'); Math.random() < .45 ? pay(p, -20000, 'recusou a vacina e foi internado(a)', true) : pay(p, -4000, 'recusou a vacina, adoeceu e ficou semanas sem trabalhar', true); }
        else Math.random() < .08 ? pay(p, -3000, 'vacinado(a), teve um caso leve', true) : pay(p, 0, 'vacinado(a), passou bem');
        if (p.career === 'med') pay(p, 10000, 'plantões extras na pandemia');
        if (['art', 'chef', 'vend'].includes(p.career)) pay(p, -8000, 'o trabalho parou com o isolamento');
      }
      les = lesson('pandemia') + (act.some(p => p.habits.neg) ? lesson('neg') : '');
    } else if (G.k === 'desinfo') {
      intro = 'Boatos nas redes fazem a vacinação infantil despencar. O sarampo, que estava eliminado, voltou.';
      for (const p of act) {
        const neg = p.habits.neg; if (neg) reveal(p, 'neg');
        if (!p.kids.length) { pay(p, 0, neg ? 'acreditou nos boatos, mas não tem filhos pequenos' : 'não tem filhos pequenos'); continue; }
        if (neg) { const sick = p.kids.filter(() => Math.random() < .4).length; pay(p, -4000 * sick, sick ? `não vacinou os filhos: ${sick} pegaram sarampo` : 'não vacinou os filhos e teve sorte desta vez', true); }
        else pay(p, 0, 'filhos vacinados e protegidos');
      }
      les = lesson('neg');
    } else if (G.k === 'mar') {
      S.sea++;
      intro = `O derretimento do gelo polar elevou o nível do mar. ${S.sea === 1 ? 'A orla do tabuleiro (canto inferior direito) foi invadida pela água.' : 'A água avançou mais pela parte de baixo do tabuleiro.'} Casas alagadas cobram prejuízo de quem cai nelas.`;
      for (const p of act) if (p.house && p.house.loc === 'praia') { p.house.v = Math.round(p.house.v * .6); pay(p, -5000, 'a casa de praia perdeu 40% do valor e precisou de reforma'); }
      les = lesson('clima');
    } else if (G.k === 'chuva') {
      const cand = BOARD.filter(s => ['ev', 'gene', 'pay'].includes(s.t) && !S.flood.includes(s.id) && s.y > 200);
      for (const s of shuffle(cand).slice(0, 3)) S.flood.push(s.id);
      intro = 'Tempestades nunca vistas: alagamentos e deslizamentos. Três ruas do tabuleiro ficaram alagadas.';
      for (const p of act) {
        if (p.house && p.house.loc === 'encosta') { p.house.v = Math.round(p.house.v * .5); pay(p, -10000, 'deslizamento atingiu a casa na encosta (valor caiu pela metade)'); }
        else if (p.house && p.house.loc === 'quintal') pay(p, -3000, 'o quintal alagou');
        else pay(p, 0, 'passou sem danos');
      }
      les = lesson('clima');
    } else if (G.k === 'calor') {
      intro = 'A temperatura bateu recorde por semanas. Hospitais lotados de casos de pressão alta e desidratação.';
      for (const p of act) { const risk = p.habits.sed || p.dis.has || p.dis.iam; pay(p, risk ? -5000 : -1500, risk ? 'passou mal no calor (sedentarismo ou doença cardiovascular)' : 'ar-condicionado e conta de luz', risk); }
      les = lesson('clima');
    } else if (G.k === 'seca') {
      intro = 'Meses sem chuva. Os preços dos alimentos dispararam.';
      for (const p of act) pay(p, p.career === 'chef' ? -6000 : -2000, p.career === 'chef' ? 'o restaurante sofreu com os preços' : 'conta do mercado subiu');
      les = lesson('clima');
    } else if (G.k === 'crise') {
      S.econ = { mult: .8, rounds: 2 };
      for (const p of act) for (const v of p.inv) if (v.type === 'aco') v.amt = Math.round(v.amt * .7);
      intro = 'Recessão por duas rodadas: salários do setor privado caem 30%, os sem setor definido 20%, e servidores públicos e militares não são afetados. Ações perdem 30%.';
    } else if (G.k === 'tech') {
      intro = 'Inteligência artificial e biotecnologia mudam o mercado de trabalho.';
      for (const p of act) {
        if (['eng', 'gen'].includes(p.career)) { p.raise += 4000; pay(p, 0, 'salário +R$ 4 mil (carreira em alta)'); }
        else if (p.career === 'vend') { p.raise -= 2000; pay(p, 0, 'salário −R$ 2 mil (vendas automatizadas)'); }
      }
    } else if (G.k === 'precisao') {
      S.labPrice = 2500;
      intro = 'O sequenciamento de genomas ficou muito mais barato: o laboratório agora cobra metade.';
      les = lesson('precisao');
    }
    S.globals.push(G.k);
    log(`🌍 ${G.t.replace(/^\S+\s/, '')}`);
    sfx.global();
    return `<h3>🌍 ${G.t}</h3><p>${intro}</p>${lines.length ? `<ul class="glist">${lines.join('')}</ul>` : ''}${les}`;
  }

  function nextPlayer() {
    if (S.players.every(p => p.done)) { S.phase = 'end'; sfx.end(); render(); return; }
    let newRound = false;
    do { S.cur = (S.cur + 1) % S.players.length; if (S.cur === 0) { S.turnNo++; newRound = true; } } while (cur().done);
    busy = false;
    if (newRound) {
      if (S.econ && --S.econ.rounds <= 0) { S.econ = null; log('A economia se recuperou.'); }
      if (S.turnNo >= 3 && Math.random() < .45) {
        const html = globalEvent(); render();
        if (humans()) { modal(html + `<div class="btns"><button class="btn primary" data-act="close">Continuar</button></div>`, () => { render(); if (cur().cpu) setTimeout(spin, 600); }); return; }
        toast(html.replace(/<(?!b|\/b)[^>]+>/g, ' ').slice(0, 140));
      }
    }
    render();
    if (cur().cpu) setTimeout(spin, 700);
  }
  function score(p) {
    const kids = p.kids.length * 20000, house = p.house ? p.house.v : 0, debt = Math.round(p.debt * 1.25), inv = invTotal(p);
    const life = p.life || lifespan(p).total, lifeB = (life - 76) * 2000;
    return { cash: p.cash, house, kids, debt, inv, life, lifeB, alt: p.altruism, total: p.cash + house + kids + inv + lifeB + p.altruism - debt };
  }

  function gainHabit(p, k, revealed) {
    if (p.habits[k]) return false;
    if (k === 'ativo' && p.habits.sed) { delete p.habits.sed; p.cards = p.cards.filter(c => c.k !== 'sed'); }
    if (k === 'sed' && p.habits.ativo) return false;
    p.habits[k] = true; p.cards.push({ k, rev: !!revealed }); return true;
  }
  function applyEvent(p, E, show) {
    let c = E.cash || 0;
    if (E.med && c < 0 && p.insured) c = Math.round(c / 2);
    if (E.artBonus && p.career === 'art') c *= 3;
    addCash(p, c); if (E.raise) p.raise += E.raise; if (E.after) E.after();
    let gained = '';
    if (E.gain && Math.random() < E.gainP && gainHabit(p, E.gain, false)) gained = '<p class="meta">Algo mudou nos seus hábitos… uma carta nova entrou na sua mão, virada para baixo.</p>';
    if (c > 0) sfx.coin(); else if (c < 0) sfx.lose();
    const body = `<div class="evcard"><p>${E.h}</p></div>${c || E.raise ? `<p class="big ${c >= 0 ? 'pos' : 'neg'}">${c ? (c > 0 ? '+' : '') + money(c) : ''}${E.raise ? ` · salário +${money(E.raise)}` : ''}</p>` : ''}${E.med && p.insured && (E.cash || 0) < 0 ? '<p class="meta">🛡️ O plano de saúde pagou metade.</p>' : ''}${gained}${revealCards(p, E.rev)}${lesson(E.lesson)}`;
    show(E.t, body);
  }
  function school(p, done) {
    const apply = k => {
      let h = '';
      if (k === 'esp') { p.nutri = (p.nutri || 0) + 1; h = gainHabit(p, 'ativo', true) ? 'O esporte virou hábito: <b>carta Atividade física</b>.' : 'Você gostou do esporte.'; }

    baby: () => Sound.arp([84, 88, 91, 96], .09, { type: 'sine', vol: .1, dur: .2 }),
    global: () => { Sound.noise(.6, { freq: 400, sweep: 120, vol: .12 }); Sound.arp([55, 58, 62], .2, { type: 'sawtooth', vol: .05, dur: .4, delay: .2 }); },
    end: () => Sound.arp([60, 64, 67, 72, 76, 79, 84], .11, { type: 'triangle', vol: .13, dur: .3 }),
  };

  // =====================================================================
  // AÇÕES
  // =====================================================================
  document.addEventListener('input', e => { const i = e.target.dataset.i; if (i != null && e.target.classList.contains('txt')) setup[+i].name = e.target.value; });
  document.addEventListener('click', e => {
    wakeAudio();
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const a = el.dataset.act, v = el.dataset.v, i = el.dataset.i != null ? +el.dataset.i : null;
    switch (a) {
      case 'close': closeModal(); break;
      case 'ssex': setup[i].sex = v; render(); break;
      case 'scpu': setup[i].cpu = !setup[i].cpu; if (setup[i].cpu && /^(Você|Jogador)/.test(setup[i].name)) setup[i].name = `Computador ${i + 1}`; if (!setup[i].cpu && /^Computador/.test(setup[i].name)) setup[i].name = `Jogador ${i + 1}`; render(); break;
      case 'sadd': setup.push({ name: `Jogador ${setup.length + 1}`, sex: pick(['F', 'M']), cpu: false, token: pick(Object.keys(TOKENS).filter(k => !setup.some(c => c.token === k))) }); render(); break;
      case 'sfast': fastMode = v === '1'; render(); break;
      case 'stok': setup[i].token = v; sfx.tick(); render(); break;
      case 'sdel': setup.splice(i, 1); render(); break;
      case 'start': newGame(setup.map(c => ({ ...c, name: c.name.trim() || 'Jogador' }))); S.fast = fastMode; busy = false; render(); rules(); if (cur().cpu) setTimeout(spin, 900); break;
      case 'continue': S = load(); busy = false; render(); if (cur().cpu) setTimeout(spin, 700); break;
      case 'reset': modal(`<h3>Nova partida?</h3><p>A partida atual será perdida.</p><div class="btns"><button class="btn primary" data-act="again">Sim</button><button class="btn" data-act="close">Cancelar</button></div>`); break;
      case 'again': $('#modalRoot').innerHTML = ''; modalCb = null; S = null; busy = false; try { localStorage.removeItem(SAVE_KEY); } catch (e2) {} render(); break;
      case 'rules': rules(); break;
      case 'spin': spin(); break;
      case 'payoff': { const p = cur(); if (p.debt > 0 && p.cash >= 20000 && !p.cpu && !busy) { p.cash -= 20000; p.debt -= 20000; log(`${p.name} quitou R$ 20 mil da dívida.`); sfx.coin(); renderBoard(); } break; }
      case 'branch': { const cb = S._branchCb; S._branchCb = null; $('#modalRoot').innerHTML = ''; modalCb = null; sfx.tick(); cb && cb(+v); break; }
      case 'career': setCareer(v); break;
      case 'insure': { const p = cur(); addCash(p, -10000); p.insured = true; log(`${p.name} contratou plano de saúde.`); sfx.good(); closeModal(); break; }
      case 'lab': { const p = cur(), free = p.career === 'gen'; if (!free) addCash(p, -S.labPrice); seqAll(v === 'self' ? p : p.spouse); sfx.good(); const done = modalCb; modalCb = null; lab(p, done); render(); break; }
      case 'fix': {
        const p = cur(), k = v, C = CARDS[k], done = modalCb; modalCb = null;
        if (p.cash < C.fix.c) { toast('Dinheiro insuficiente.'); modalCb = done; break; }
        const ok = tryFix(p, k); render(); ok ? sfx.good() : sfx.lose();
        modal(`<h3>${ok ? '✅ Conseguiu!' : '😓 Recaída'}</h3><p>${C.fix.n}: ${ok ? (C.fix.to ? 'a carta virou <b>Atividade física</b>.' : `a carta <b>${C.n}</b> foi descartada.`) : 'não deu certo desta vez. No próximo check-up dá para tentar de novo.'}</p>${k === 'fumo' || k === 'alcool' ? lesson('vicio') : k === 'neg' ? lesson('neg') : lesson('multi')}<div class="btns"><button class="btn primary" data-act="close">Continuar</button></div>`, done);
        break;
      }
      case 'fam': S._fam && S._fam(v === '1'); break;
      case 'school': S._school && S._school(v); break;
      case 'peer': S._peer && S._peer(v === '1'); break;
      case 'hemo': S._hemo && S._hemo(v); render(); break;
      case 'donate': S._donate && S._donate(v === '1'); render(); break;
      case 'inv': { const p = cur(), [k, a] = v.split(':'); addCash(p, -+a); p.inv.push({ type: k, amt: +a }); log(`${p.name} investiu ${money(+a)} em ${INV[k][0]}.`); sfx.coin(); closeModal(); break; }
      case 'pos': { const p = cur(); addCash(p, -15000); p.raise += p.fac ? 3000 : 1500; p.study = true; log(`${p.name} fez pós-graduação.`); sfx.good(); closeModal(); break; }
      case 'house': { const p = cur(), h = S._houses[+v]; addCash(p, -h.c); p.house = { ...h }; log(`${p.name} comprou ${h.n}.`); sfx.good(); closeModal(); break; }
    }
    const lg = $('#log'); if (lg) lg.scrollTop = lg.scrollHeight;
  });
  if (/github\.io$/.test(location.hostname)) $('#backlink').hidden = false;
  S = null; render();
  window.__HE = { get S() { return S; }, spin, render, ph, score, cur, BOARD, get busy() { return busy; }, globalEvent, flooded };

})();
</script>
</body>
</html>
