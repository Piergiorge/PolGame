<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surto — RPG de investigação genética</title>
<style>
  :root {
    --bg:#0e1a1c; --panel:#152629; --panel2:#1c3236; --line:#2a464b; --text:#eaf2ef; --muted:#93aeaa;
    --accent:#4dd0b1; --warm:#ffb86b; --good:#9ccc65; --bad:#ff7a7a; --paper:#f4efe4; --ink:#22303a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:radial-gradient(1200px 600px at 90% -10%, #1f3d3a66, transparent 70%), var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height:100vh; }
  button { font:inherit; cursor:pointer; }
  .wrap { max-width:1200px; margin:0 auto; padding:14px 14px 40px; }
  header.top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; margin-bottom:12px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand h1 { margin:0; font:700 24px/1 Georgia, 'Times New Roman', serif; letter-spacing:.12em; }
  .brand h1 span { color:var(--warm); }
  .brand small { color:var(--muted); display:block; font-size:12px; margin-top:3px; }
  .res { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:13px; white-space:nowrap; }
  .pill b { color:var(--warm); }
  .xpbar { display:inline-block; width:70px; height:7px; background:#0b1517; border-radius:4px; overflow:hidden; vertical-align:middle; margin-left:4px; }
  .xpbar i { display:block; height:100%; background:var(--accent); }
  .ghost, .soundbtn { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; font-size:12px; }
  .ghost:hover, .soundbtn:hover { color:var(--text); border-color:#46707a; }
  h2 { margin:4px 0 6px; font:700 21px Georgia, serif; }
  h3 { margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 14px; }
  .meta { color:var(--muted); font-size:12px; }
  .muted { color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .btn { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 11px; font-size:13px; font-weight:600; }
  .btn:hover:not(:disabled) { border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.primary { background:var(--accent); color:#06231d; border-color:var(--accent); }
  .btn.warm { background:var(--warm); color:#2b1600; border-color:var(--warm); }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .stars { color:var(--warm); letter-spacing:1px; }
  /* título */
  .title { text-align:center; padding:30px 10px; }
  .title h2 { font-size:44px; letter-spacing:.2em; margin:0; }
  .title .tagline { color:var(--muted); font-size:16px; margin:6px 0 24px; }
  .hubgrid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 2fr); gap:12px; align-items:start; }
  @media (max-width:760px) { .hubgrid { grid-template-columns:1fr; } }
  .bgs { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; max-width:820px; margin:12px auto; text-align:left; }
  .bg { background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:12px; color:var(--text); text-align:left; }
  .bg.on { border-color:var(--warm); background:#22302a; }
  .bg b { display:block; font-size:15px; margin-bottom:4px; }
  input.name { background:#0b1517; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 12px; font-size:15px; width:min(320px, 90%); }
  /* hub */
  .clist { display:grid; gap:8px; }
  .citem { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .citem.now { border-color:var(--warm); }
  .citem.off { opacity:.5; }
  .citem .n { font:700 18px Georgia, serif; color:var(--warm); width:28px; text-align:center; }
  .citem .grow { flex:1; }
  .perks { display:flex; flex-wrap:wrap; gap:6px; }
  .perk { background:#1f3a3a; border-radius:6px; padding:2px 8px; font-size:12px; }
  /* caso */
  .casehead { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .clock { font-size:16px; font-weight:700; }
  .clock.low { color:var(--bad); }
  .casegrid { display:grid; grid-template-columns:minmax(0, 1fr) 360px; gap:12px; align-items:start; }
  @media (max-width:900px) { .casegrid { grid-template-columns:1fr; } }
  .pedwrap { background:var(--paper); border-radius:12px; overflow:auto; max-height:72vh; box-shadow:inset 0 0 0 1px #d9cfba; }
  svg.ped { display:block; }
  svg.ped text { font-family:system-ui, sans-serif; text-anchor:middle; fill:var(--ink); }
  svg.ped .nm { font-size:11.5px; font-weight:600; }
  svg.ped .ag { font-size:10px; fill:#6a7178; }
  svg.ped .lb { font-size:9.5px; fill:#8a8f94; }
  svg.ped .gen { font:700 14px Georgia, serif; fill:#8a7d62; text-anchor:start; }
  svg.ped .ln { stroke:var(--ink); stroke-width:1.6; fill:none; }
  svg.ped .sym { stroke:var(--ink); stroke-width:2; }
  svg.ped .pn { cursor:pointer; }
  svg.ped .pn:hover .sym { stroke:#c4561d; }
  svg.ped .sel { fill:none; stroke:#e07a1f; stroke-width:3; }
  svg.ped .hl { fill:#ffb86b55; stroke:#e07a1f; stroke-width:1.5; stroke-dasharray:5 3; }
  svg.ped .q { font:700 15px system-ui; fill:#7d8790; }
  svg.ped .seqt { font:600 9.5px ui-monospace, Menlo, monospace; fill:#2f7d6b; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); margin-top:8px; align-items:center; }
  .legend span { display:inline-flex; gap:5px; align-items:center; }
  .side { display:flex; flex-direction:column; gap:10px; }
  .person h3 { font:700 18px Georgia, serif; margin:0; }
  .quote { background:#0f1d1f; border-left:3px solid var(--accent); border-radius:6px; padding:8px 10px; margin:8px 0; font-style:italic; }
  .tag { display:inline-block; background:#1f3a3a; border-radius:6px; padding:1px 7px; font-size:12px; margin:2px 4px 2px 0; }
  .tag.aff { background:#4a2622; color:#ffc9bd; }
  .tag.un { background:#203a2a; color:#c9f0cf; }
  .tag.q { background:#3a3420; color:#ffe3a6; }
  .hyp { display:grid; grid-template-columns:auto 1fr; gap:6px 8px; align-items:center; }
  .hyp .st { width:34px; text-align:center; border-radius:6px; padding:3px 0; background:#0f1d1f; border:1px solid var(--line); color:var(--text); }
  .hyp .st.x { color:var(--bad); }
  .hyp .st.ok { color:var(--good); }
  .hel { font-size:12px; margin-top:2px; }
  .relbar { display:inline-block; width:60px; height:6px; background:#0b1517; border-radius:3px; overflow:hidden; vertical-align:middle; margin-right:5px; }
  .relbar i { display:block; height:100%; background:var(--accent); }
  .log { max-height:180px; overflow:auto; font-size:12.5px; }
  .log p { margin:3px 0; padding-left:10px; border-left:2px solid var(--line); }
  /* modal e toast */
  .modal-bg { position:fixed; inset:0; background:#020807cc; display:flex; align-items:center; justify-content:center; padding:16px; z-index:40; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; width:min(720px, 100%); max-height:90vh; overflow:auto; }
  .modal h3 { margin:0 0 8px; font:700 21px Georgia, serif; color:var(--warm); }
  .modal p { margin:6px 0; }
  .modal .who { display:flex; gap:10px; align-items:flex-start; }
  .modal .avatar { flex:0 0 48px; height:48px; border-radius:50%; background:#2a464b; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .opt { display:block; width:100%; text-align:left; background:#0f1d1f; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 10px; margin:4px 0; }
  .opt.on { border-color:var(--warm); background:#2b2a1c; }
  .opt.right { border-color:var(--good); background:#1d3320; }
  .opt.wrong { border-color:var(--bad); background:#3a1f1f; }
  .lesson { background:#0f1d1f; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .lesson h4 { margin:0 0 4px; color:var(--accent); }
  .guide h4 { margin:12px 0 4px; color:var(--accent); }
  .toast-box { position:fixed; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(380px, 92vw); }
  .toast { background:#183236; border:1px solid var(--accent); border-radius:10px; padding:9px 12px; font-size:13px; box-shadow:0 6px 20px #0008; animation:tin .25s ease; }
  .toast.warm { border-color:var(--warm); }
  @keyframes tin { from { transform:translateY(10px); opacity:0; } }
  .backlink { color:var(--muted); text-decoration:none; font-size:13px; display:inline-block; margin-bottom:6px; }
  .backlink:hover { color:var(--text); }
  .backlink[hidden] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" id="backlink" href="../" hidden>← Todos os jogos</a>
  <header class="top">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
        <rect x="4" y="5" width="12" height="12" fill="none" stroke="#ffb86b" stroke-width="2"/>
        <circle cx="31" cy="11" r="6.5" fill="#ffb86b"/>
        <path d="M16 11H24.5M20 11V21M10 21H32M10 21V27M32 21V27" stroke="#4dd0b1" stroke-width="2" fill="none"/>
        <rect x="4" y="27" width="12" height="12" fill="#4dd0b1"/><circle cx="32" cy="33" r="6.5" fill="none" stroke="#4dd0b1" stroke-width="2"/>
      </svg>
      <div><h1>SUR<span>TO</span></h1><small>investigação genética no Vale do Sereno</small></div>
      <button class="soundbtn" id="soundBtn" type="button">🔊 Som ligado (M)</button>
    </div>
    <div class="res" id="res"></div>
  </header>
  <main id="main"></main>
</div>
<div class="toast-box" id="toasts"></div>
<div id="modalRoot"></div>
<script>
(() => {
  // ================= Som (gerado por código com a Web Audio API) =================
  const Sound = (() => {
    let ac = null, master = null, musicBus = null, muted = false, timer = null, step = 0, nextTime = 0, song = null;
    try { muted = localStorage.getItem('surto-mudo') === '1'; } catch (e) {}
    function ensure() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
          musicBus = ac.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0), vol = o.vol ?? 0.25;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur + 0.03);
    }
    function noise(dur, o = {}) {
      if (!ac || muted) return;
      const t = ac.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t); f.Q.value = o.q || 1;
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(o.vol ?? 0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.03);
    }
    const arp = (notes, gap, o = {}) => notes.forEach((n, i) => tone(midi(n), o.dur || 0.14, { ...o, delay: (o.delay || 0) + i * gap }));
    function note(freq, time, dur, type = 'triangle', vol = 0.5) {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(musicBus); osc.start(time); osc.stop(time + dur + 0.03);
    }
    function schedule() {
      if (!ac || !song) return;
      const bpm = typeof song.bpm === 'function' ? song.bpm() : song.bpm;
      const stepDur = 60 / bpm / 2;
      if (nextTime < ac.currentTime - 0.5) nextTime = ac.currentTime + 0.05; // aba voltou do segundo plano
      while (nextTime < ac.currentTime + 0.15) {
        if (!muted) song.play(step, nextTime, stepDur);
        step++; nextTime += stepDur;
      }
    }
    function music(s) {
      song = s;
      if (!ac || !s) return;
      step = 0; nextTime = ac.currentTime + 0.08;
      if (!timer) timer = setInterval(schedule, 40);
    }
    function toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.5;
      try { localStorage.setItem('surto-mudo', muted ? '1' : '0'); } catch (e) {}
      updateSoundButton();
      return muted;
    }
    return { ensure, tone, noise, arp, note, music, toggle, get muted() { return muted; } };
  })();
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundButton() { if (soundBtn) { soundBtn.textContent = Sound.muted ? '🔇 Som desligado (M)' : '🔊 Som ligado (M)'; soundBtn.setAttribute('aria-pressed', String(!Sound.muted)); } }
  if (soundBtn) soundBtn.addEventListener('click', () => { Sound.ensure(); Sound.toggle(); soundBtn.blur(); });
  updateSoundButton();
  addEventListener('keydown', e => { if (e.code === 'KeyM' && !e.repeat) { Sound.ensure(); Sound.toggle(); } });
  // links "todos os jogos" só aparecem no site publicado
  for (const a of document.querySelectorAll('.backlink')) if (!/github\.io$/.test(location.hostname)) a.hidden = true;

  // =====================================================================
  // UTILITÁRIOS
  // =====================================================================
  const rand = n => Math.floor(Math.random() * n);
  const pick = a => a[rand(a.length)];
  const ri = (a, b) => a + rand(b - a + 1);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // =====================================================================
  // MODOS DE HERANÇA E VEROSSIMILHANÇA
  // Hipótese do alelo raro: quem entra na família por casamento (sem histórico) não carrega
  // a variante, a não ser que seja afetado. Os fundadores do topo podem ser portadores.
  // =====================================================================
  const MODES = {
    AD:  { n: 'Autossômica dominante', sh: 'AD' },
    AR:  { n: 'Autossômica recessiva', sh: 'AR' },
    XLR: { n: 'Recessiva ligada ao X', sh: 'XR' },
    XLD: { n: 'Dominante ligada ao X', sh: 'XD' },
    MT:  { n: 'Mitocondrial', sh: 'MT' },
    ENV: { n: 'Não genética (causa ambiental)', sh: 'AMB' },
  };
  const ALL_MODES = ['AD', 'AR', 'XLR', 'XLD', 'MT', 'ENV'];
  const isX = m => m === 'XLR' || m === 'XLD';
  const domain = (mode, sex) => mode === 'MT' ? [0, 1] : isX(mode) && sex === 'M' ? [0, 1] : [0, 1, 2];
  function pAff(mode, sex, g, pen = 1) {
    let a;
    switch (mode) {
      case 'AD': a = g >= 1; break;
      case 'AR': a = g === 2; break;
      case 'XLR': a = sex === 'M' ? g === 1 : g === 2; break;
      case 'XLD': a = g >= 1; break;
      case 'MT': a = g === 1; break;
      default: a = false;
    }
    return a ? (mode === 'AD' ? pen : 1) : 0;
  }
  const pObs = (mode, sex, g, obs, pen) => obs == null ? 1 : obs === 'A' ? pAff(mode, sex, g, pen) : 1 - pAff(mode, sex, g, pen);
  const minAff = (mode, sex) => domain(mode, sex).find(g => pAff(mode, sex, g) > 0);
  const gam = g => g === 0 ? [[0, 1]] : g === 1 ? [[0, .5], [1, .5]] : [[1, 1]];
  function trans(mode, sex, gc, gm, gf) {
    if (mode === 'MT') return gc === gm ? 1 : 0;
    let s = 0;
    if (isX(mode)) {
      if (sex === 'M') { for (const [a, p] of gam(gm)) if (a === gc) s += p; return s; }
      for (const [a, p] of gam(gm)) if (a + gf === gc) s += p;
      return s;
    }
    for (const [a, p] of gam(gm)) for (const [b, q] of gam(gf)) if (a + b === gc) s += p * q;
    return s;
  }

  // fatores para eliminação de variáveis
  function mkF(v, d, fn) {
    const n = d.reduce((a, b) => a * b, 1), t = new Float64Array(n), a = new Array(v.length).fill(0);
    for (let i = 0; i < n; i++) {
      t[i] = fn(a);
      for (let k = v.length - 1; k >= 0; k--) { if (++a[k] < d[k]) break; a[k] = 0; }
    }
    return { v, d, t };
  }
  function product(fs) {
    const v = [], d = [];
    for (const f of fs) f.v.forEach((x, i) => { if (!v.includes(x)) { v.push(x); d.push(f.d[i]); } });
    const maps = fs.map(f => f.v.map(x => v.indexOf(x)));
    return mkF(v, d, a => {
      let p = 1;
      for (let j = 0; j < fs.length; j++) {
        const f = fs[j], m = maps[j]; let idx = 0;
        for (let k = 0; k < m.length; k++) idx = idx * f.d[k] + a[m[k]];
        p *= f.t[idx]; if (!p) return 0;
      }
      return p;
    });
  }
  function sumOut(f, x) {
    const i = f.v.indexOf(x), v = f.v.filter(y => y !== x), d = f.d.filter((_, k) => k !== i);
    return mkF(v, d, a => {
      let s = 0; const b = [...a.slice(0, i), 0, ...a.slice(i)];
      for (let g = 0; g < f.d[i]; g++) {
        b[i] = g; let idx = 0;
        for (let k = 0; k < b.length; k++) idx = idx * f.d[k] + b[k];
        s += f.t[idx];
      }
      return s;
    });
  }

  function allowedMap(fam, mode, obsOf, pen) {
    const A = {};
    for (const p of Object.values(fam.people)) {
      const o = obsOf(p);
      const d = domain(mode, p.sex).filter(g => pObs(mode, p.sex, g, o, pen) > 0);
      if (p.marriedIn) { const v = o === 'A' ? d[0] : 0; A[p.id] = d.includes(v) ? [v] : []; }
      else if (p.top) { const m = minAff(mode, p.sex); A[p.id] = d.filter(g => g <= m); }
      else A[p.id] = d;
    }
    return A;
  }
  // verossimilhança: máximo sobre os genótipos dos fundadores do topo, soma sobre o resto
  function likelihood(fam, mode, obsOf, pen = 1) {
    if (mode === 'ENV') return 0;
    const ppl = Object.values(fam.people), A = allowedMap(fam, mode, obsOf, pen);
    if (ppl.some(p => !A[p.id].length)) return 0;
    const tops = ppl.filter(p => p.top);
    const order = ppl.slice().sort((a, b) => b.gen - a.gen || a.id - b.id).map(p => p.id);
    let best = 0;
    const combos = tops.reduce((acc, p) => acc.flatMap(c => A[p.id].map(g => ({ ...c, [p.id]: g }))), [{}]);
    for (const fix of combos) {
      const vals = id => fix[id] !== undefined ? [fix[id]] : A[id];
      let F = [];
      for (const p of ppl) {
        const V = vals(p.id), o = obsOf(p);
        F.push(mkF([p.id], [V.length], a => pObs(mode, p.sex, V[a[0]], o, pen)));
        if (p.parents) {
          const [m, f] = p.parents, Vm = vals(m), Vf = vals(f);
          if (mode === 'MT') F.push(mkF([p.id, m], [V.length, Vm.length], a => trans(mode, p.sex, V[a[0]], Vm[a[1]], 0)));
          else F.push(mkF([p.id, m, f], [V.length, Vm.length, Vf.length], a => trans(mode, p.sex, V[a[0]], Vm[a[1]], Vf[a[2]])));
        }
      }
      for (const x of order) {
        const inn = F.filter(f => f.v.includes(x)); if (!inn.length) continue;
        F = F.filter(f => !f.v.includes(x));
        F.push(sumOut(product(inn), x));
      }

  // ---------- nomes e detalhes ----------

  // ---------- layout do heredograma ----------
  function layout(fam) {

    for (const m of opts) if (m !== 'ENV') {
      const r = res[m];
      if (!r.L) { const w = witness(cs.fam, m, obsKnown, m === 'AD' ? (T.pen || 1) : 1); r.msg = w ? w.msg : 'Nenhuma família sozinha contradiz, mas o conjunto das gerações não fecha.'; r.ids = w ? w.ids : []; }
      else r.rel = r.L / max;
    }
    if (opts.includes('ENV')) res.ENV = { env: true, ok: max === 0 };
    cs.hel.res = res; cs.hel.at = Object.keys(cs.inv).length + Object.keys(cs.gossip).length;
    cs.log.push('Você discutiu o caso com a Dra. Helena.');
    sfx.hel(); render();
  }
  function helLine(m) {
    const cs = S.cs, r = cs.hel.res && cs.hel.res[m]; if (!r) return '';
    if (r.env) return `<div class="hel">${r.ok ? '<b style="color:var(--good)">Plausível:</b> nenhuma herança genética explica o que você levantou.' : 'Ainda existe explicação genética compatível.'}</div>`;
    if (!r.L) return `<div class="hel"><b style="color:var(--bad)">Descartada.</b> ${esc(r.msg)} ${r.ids.length ? `<button class="ghost" data-act="hl" data-v="${m}">mostrar</button>` : ''}</div>`;
    const lab = r.rel > .999 ? 'melhor explicação até agora' : r.rel >= .25 ? 'também plausível' : r.rel >= 1 / 16 ? 'possível, mas menos provável' : `muito improvável (≈1 em ${Math.round(1 / r.rel)} em relação à melhor)`;
    return `<div class="hel"><span class="relbar"><i style="width:${Math.max(3, r.rel * 100)}%"></i></span>${lab}</div>`;
  }

  // ---------- laudo ----------
  function laudo() {
    const cs = S.cs, q = cs.q;

    modal(`<h3>📝 Laudo da família ${esc(cs.famName)}</h3>

  }
  function sign() {
    const cs = S.cs, T = tplOf(cs), q = cs.q;
    const mOK = cs.lsel.mode === T.mode, qOK = cs.lsel.ans === q.a;
    let xp = (mOK ? 60 : 10) + (qOK ? 40 : 0) + (mOK ? cs.hours * 3 : 0) + (cs.plantao ? 20 : 0);
    xp = Math.round(xp * (1 + .2 * perk('estudo')));
    const base = cs.plantao ? 320 : 220 + 30 * cs.tpl;
    const cash = Math.round(base * (.6 + .1 * S.rep) * (1 + .3 * perk('captacao')) * (mOK ? 1 : .3));
    const rep0 = S.rep; S.rep = Math.max(0, Math.min(5, S.rep + (mOK && qOK ? 1 : mOK ? 0 : -1)));
    S.cash += cash; S.solved += mOK ? 1 : 0;
    if (!cs.plantao && mOK && S.camp === cs.tpl) S.camp++;
    if (cs.plantao) S.plantoes++;
    const lv0 = S.level; S.xp += xp;
    while (S.xp >= need()) { S.xp -= need(); S.level++; S.pendingPerk = (S.pendingPerk || 0) + 1; }
    cs.reveal = true; cs.hl = []; cs.result = { mOK, qOK, xp, cash };

  // ---------- heredograma ----------
  function pedSVG() {
    const cs = S.cs, fam = cs.fam, ppl = Object.values(fam.people), P = id => fam.people[id], T = tplOf(cs);
    const vis = p => cs.reveal || cs.disc[p.id];
    const SW = 76, RH = 108, PX = 40, PY = 36, R = 14;
    const X = x => PX + x * SW + SW / 2, Y = r => PY + r * RH + R;
    const maxX = Math.max(...ppl.map(p => p.x)), maxR = Math.max(...ppl.map(p => p.gen));
    const W = PX + (maxX + 1) * SW + 16, H = PY + (maxR + 1) * RH - 10;
    let L = '', N = '';
    const seen = new Set();
    for (const a of ppl) for (const s of a.spouses) {
      const key = [a.id, s].sort((x, y) => x - y).join('-'); if (seen.has(key)) continue; seen.add(key);
      const b = P(s); if (!vis(a) || !vis(b)) continue;
      const [l, r] = a.x < b.x ? [a, b] : [b, a], y = Y(a.gen);
      const cons = fam.consang && fam.consang.includes(a.id) && fam.consang.includes(b.id);
      let topY; const near = !ppl.some(q => q.gen === a.gen && q.x > l.x && q.x < r.x && vis(q));
      if (near) {
        L += cons ? `<path class="ln" d="M${X(l.x) + R} ${y - 3}H${X(r.x) - R}M${X(l.x) + R} ${y + 3}H${X(r.x) - R}"/>` : `<path class="ln" d="M${X(l.x) + R} ${y}H${X(r.x) - R}"/>`; topY = y;
      } else {
        const yy = y - R - 16; topY = yy;
        L += `<path class="ln" d="M${X(l.x)} ${y - R}V${yy}H${X(r.x)}V${y - R}"/>` + (cons ? `<path class="ln" d="M${X(l.x) + 5} ${y - R}V${yy + 5}H${X(r.x) - 5}V${y - R}"/>` : '');
      }
      const kids = a.kids.filter(k => b.kids.includes(k)).map(P).filter(vis); if (!kids.length) continue;
      const kx = kids.map(k => X(k.x)), cx = near ? (X(l.x) + X(r.x)) / 2 : (Math.min(...kx) + Math.max(...kx)) / 2;
      const sy = y + RH / 2 + 4, ky = Y(a.gen + 1) - R;
      L += `<path class="ln" d="M${cx} ${topY}V${sy}M${Math.min(cx, ...kx)} ${sy}H${Math.max(cx, ...kx)}${kx.map(x => `M${x} ${sy}V${ky}`).join('')}"/>`;
    }
    for (const p of ppl) {
      if (!vis(p)) continue;
      const x = X(p.x), y = Y(p.gen), k = known(p);
      const fill = !k ? '#e3dccb' : p.obs === 'A' ? '#22303a' : '#ffffff';
      const shape = (cls, pad, f) => p.sex === 'M' ? `<rect x="${x - R - pad}" y="${y - R - pad}" width="${2 * (R + pad)}" height="${2 * (R + pad)}" class="${cls}" ${f ? `fill="${f}"` : ''}/>` : `<circle cx="${x}" cy="${y}" r="${R + pad}" class="${cls}" ${f ? `fill="${f}"` : ''}/>`;
      const showSeq = (cs.seq[p.id] || cs.reveal) && !T.env;
      let g = `<rect x="${x - 34}" y="${y - R - 8}" width="68" height="${2 * R + 52}" fill="transparent"/>`;
      if (cs.hl.includes(p.id)) g += `<rect x="${x - 30}" y="${y - 24}" width="60" height="62" rx="8" class="hl"/>`;
      g += shape('sym', 0, fill);
      const dot = showSeq && p.g >= 1 && p.obs !== 'A';
      if (!k || (p.obs == null && !dot)) g += `<text x="${x}" y="${y + 5}" class="q">?</text>`;
      if (dot) g += `<circle cx="${x}" cy="${y}" r="4.5" fill="#22303a"/>`;
      if (!p.alive) g += `<path d="M${x - R - 6} ${y + R + 6}L${x + R + 6} ${y - R - 6}" class="ln"/>`;
      if (p.id === cs.pb) g += `<path d="M${x - R - 22} ${y + R + 12}L${x - R - 4} ${y + R - 4}" class="ln" style="stroke-width:2.2"/><path d="M${x - R - 4} ${y + R - 4}l-8 1l5 6z" fill="#22303a"/><text x="${x - R - 26}" y="${y + R + 22}" style="font-size:11px;font-weight:700">P</text>`;
      if (cs.sel === p.id && !cs.reveal) g += shape('sel', 5);
      g += `<text x="${x}" y="${y + R + 14}" class="nm">${esc(p.name)}</text>`;
      g += `<text x="${x}" y="${y + R + 26}" class="ag">${p.label}${k ? ` · ${p.alive ? p.age + ' a' : '†' + p.deadAge}` : ''}</text>`;
      if (showSeq) g += `<text x="${x}" y="${y + R + 38}" class="seqt">${seqShort(p)}</text>`;
      else if (cs.gossip[p.id] && !cs.inv[p.id]) g += `<text x="${x}" y="${y + R + 38}" class="lb">(relato)</text>`;
      N += `<g class="pn" data-act="sel" data-id="${p.id}">${g}</g>`;
    }
    const rows = Array.from({ length: maxR + 1 }, (_, r) => `<text x="8" y="${Y(r) + 5}" class="gen">${['I', 'II', 'III', 'IV', 'V'][r]}</text>`).join('');
    return `<svg class="ped" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${rows}${L}${N}</svg>`;
  }
  const legend = () => `<div class="legend">

    modal(`<h3>${cs.plantao ? '🚑 Plantão' : `Caso ${cs.tpl + 1}`}: família ${esc(cs.famName)}</h3>
      ${helena(`<p>${T.caller} encaminhou <b>${esc(pb.name)}</b>, ${pb.age} anos, com <b>${T.dis.name}</b> (${T.dis.short}). Há suspeita de que outras pessoas da família tenham o mesmo quadro.</p>
      <p>Descubra o modo de herança e responda à pergunta do laudo. Você tem <b>${cs.hours} horas</b> de investigação.</p>
      ${cs.plantao ? '<p class="meta">No plantão, todos os modos de herança são possíveis.</p>' : `<p class="meta">${INTROS[cs.tpl]}</p>`}`)}
      <div class="btns" style="margin-top:10px">${S.seenHow ? '<button class="btn primary" data-act="close">Começar</button><button class="btn" data-act="how">Como investigar</button>' : '<button class="btn primary" data-act="how">Como investigar →</button>'}</div>`);
    S.seenHow = true;
  }
  function how() {
    modal(`<h3>Como investigar</h3>
      <ol>
        <li><b>Clique em uma pessoa</b> do heredograma para ver o que você sabe sobre ela.</li>
        <li><b>Entrevistar</b> (vivos) ou <b>consultar prontuário</b> (falecidos) custa 1 hora, mostra se a pessoa tem a doença e revela os parentes dela no heredograma.</li>
        <li><b>Sequenciar</b> custa horas e verba e mostra quantas cópias da variante a pessoa carrega. Útil para achar portadores.</li>
        <li>Use o <b>quadro de hipóteses</b> para anotar o que já descartou. A <b>Dra. Helena</b> avalia todas as hipóteses com o que você já levantou (as consultas são limitadas).</li>
        <li>Quando tiver certeza, <b>emita o laudo</b>. Horas que sobrarem viram experiência.</li>
      </ol>
      <p class="meta"><b>Hipótese do alelo raro:</b> quem entrou na família por casamento, sem histórico, é considerado não portador da variante, a menos que seja afetado.</p>
      <div class="btns"><button class="btn primary" data-act="close">Entendi</button></div>`);
  }
  function guide() {
    modal(`<div class="guide"><h3>Guia de heredogramas</h3>
      <p><b>Notação:</b> quadrado = homem, círculo = mulher, preenchido = afetado, ponto central = portador, barra = falecido, linha dupla = consanguinidade, seta P = probando. Gerações em algarismos romanos.</p>
      <h4>Autossômica dominante</h4><p>Todo afetado tem um genitor afetado; homens e mulheres igualmente; transmissão de pai para filho homem é possível; filho de afetado (Aa × aa): 1/2.</p>
      <h4>Autossômica recessiva</h4><p>Afetados costumam ter pais não afetados (portadores); homens e mulheres igualmente; mais comum em casamentos consanguíneos; Aa × Aa: 1/4 afetados, e 2/3 dos irmãos não afetados são portadores.</p>
      <h4>Recessiva ligada ao X</h4><p>Muito mais homens afetados; passa por mães portadoras; nunca de pai para filho homem; todas as filhas de um homem afetado são portadoras.</p>
      <h4>Dominante ligada ao X</h4><p>Homem afetado: todas as filhas afetadas e nenhum filho. Mulher afetada: 1/2 dos filhos de ambos os sexos. Mais mulheres afetadas.</p>
      <h4>Mitocondrial</h4><p>Só a mãe transmite, para todos os filhos; homem afetado não transmite. A gravidade varia (heteroplasmia).</p>
      <h4>Não genética</h4><p>Quando os afetados se agrupam por lugar ou exposição, não por parentesco, e nenhuma herança explica o heredograma: suspeite de uma <b>fenocópia</b> ambiental.</p>
      <h4>Hipótese do alelo raro</h4><p>Quem entra na família por casamento é considerado não portador, a menos que seja afetado. É o que se assume nos exercícios de heredograma quando a doença é rara.</p>
      <div class="btns" style="margin-top:12px"><button class="btn primary" data-act="close">Fechar</button></div></div>`);
  }
  function perkPick() {
    const avail = shuffle(Object.keys(PERKS).filter(k => perk(k) < PERKS[k].max)).slice(0, 3);
    if (!avail.length) { S.pendingPerk = 0; render(); return; }
    modal(`<h3>⭐ Nível ${S.level}: ${rank()}</h3><p>Escolha uma habilidade nova:</p>
      ${avail.map(k => `<button class="opt" data-act="perk" data-v="${k}"><b>${PERKS[k].n}</b>${perk(k) ? ` (nível ${perk(k) + 1})` : ''}<br><span class="meta">${PERKS[k].d}</span></button>`).join('')}`);
  }

  // =====================================================================
  // SOM
  // =====================================================================
  const SONG = { bpm: 68, play(step, t, d) {
    const CH = [[57, 60, 64, 69], [53, 57, 60, 65], [48, 52, 55, 60], [52, 56, 59, 64]];
    const bar = Math.floor(step / 8) % 4, s = step % 8, ch = CH[bar];
    if (s === 0) Sound.note(midi(ch[0] - 12), t, d * 7, 'sine', .22);
    if (s % 2 === 0) Sound.note(midi(ch[(s / 2) % 4] + 12), t, d * 2.5, 'triangle', .1);
    if (s === 5 && bar % 2) Sound.note(midi(ch[3] + 12), t, d * 2, 'sine', .07);
  } };
  let musicOn = false;
  function wakeAudio() { Sound.ensure(); if (!musicOn) { musicOn = true; Sound.music(SONG); } }
  const sfx = {
    tick: () => Sound.tone(700, .03, { type: 'sine', vol: .05 }),
    step: () => { for (let i = 0; i < 3; i++) Sound.noise(.05, { freq: 500, vol: .12, delay: i * .14 }); Sound.arp([72, 76], .08, { type: 'sine', vol: .08, delay: .45 }); },
    paper: () => { Sound.noise(.25, { freq: 4000, sweep: 1500, vol: .12 }); Sound.noise(.18, { freq: 3000, vol: .08, delay: .25 }); },
    seq: () => { for (let i = 0; i < 10; i++) Sound.tone(midi(76 + (i * 7) % 12), .04, { type: 'sine', vol: .07, delay: i * .05 }); Sound.arp([84, 88], .1, { type: 'triangle', vol: .12, delay: .6 }); },
    hel: () => Sound.arp([69, 72, 76], .12, { type: 'sine', vol: .12 }),
    good: () => Sound.arp([72, 76, 79, 84], .1, { type: 'triangle', vol: .15, dur: .25 }),
    bad: () => Sound.arp([67, 63, 60], .18, { type: 'triangle', vol: .15, dur: .35 }),
    level: () => Sound.arp([72, 76, 79, 84, 79, 84, 88], .09, { type: 'square', vol: .1, dur: .18 }),
  };

  // =====================================================================
  // AÇÕES
  // =====================================================================
  document.addEventListener('click', e => {
    wakeAudio();
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const a = el.dataset.act, id = el.dataset.id ? +el.dataset.id : null, v = el.dataset.v;
    switch (a) {
      case 'close': closeModal(); render(); if (S && S.pendingPerk && S.screen === 'hub') perkPick(); break;
      case 'guide': guide(); break;
      case 'how': how(); break;
      case 'bg': newBg = v; sfx.tick(); render(); break;
      case 'continue': S = load(); S.screen = S.cs && !S.cs.reveal ? 'case' : 'hub'; render(); if (S.screen === 'case') centerPed(); break;
      case 'new': {
        const name = ($('#pname').value || '').trim() || 'Dra. Residente';
        S = { v: 1, name, bg: newBg, level: 1, xp: 0, rep: 3, cash: 400, perks: { [BGS[newBg].perk]: 1 }, camp: 0, solved: 0, plantoes: 0, screen: 'hub', cs: null, pendingPerk: 0, seenHow: false };
        render(); sfx.good();
        modal(`<h3>Bem-vinda(o) ao Vale do Sereno</h3>${helena(`<p>${esc(name)}, que bom ter você aqui. Eu sou a Dra. Helena Prado e estou me aposentando depois de 35 anos atendendo as famílias do vale. O serviço agora é seu.</p><p>Cada caso é uma família. Converse com as pessoas, leia os prontuários e monte o heredograma: é ele que conta como a doença passa adiante. Quando precisar, me chame para discutir as hipóteses.</p>`)}<div class="btns" style="margin-top:10px"><button class="btn primary" data-act="close">Vamos ao primeiro caso</button></div>`);
        break;
      }
      case 'hub': closeModal(); S.screen = 'hub'; render(); if (S.pendingPerk) perkPick(); break;
      case 'resume': S.screen = 'case'; render(); centerPed(); break;
      case 'open': {
        const i = +v; closeModal();
        if (S.cs && !S.cs.reveal && S.cs.tpl === i && !S.cs.plantao) { S.screen = 'case'; render(); centerPed(); break; }
        startCase(i, false); break;
      }
      case 'plantao': startCase(rand(CASES.length), true); break;
      case 'sel': S.cs.sel = id; S.cs.hl = []; sfx.tick(); render(); break;
      case 'inv': investigate(id); break;
      case 'seq': sequence(id); break;
      case 'helena': consult(); break;
      case 'hyp': { const cur = S.cs.hyp[v] || ''; S.cs.hyp[v] = cur === '' ? 'x' : cur === 'x' ? 'ok' : ''; if (S.cs.hyp[v] === 'ok') for (const m in S.cs.hyp) if (m !== v && S.cs.hyp[m] === 'ok') S.cs.hyp[m] = ''; sfx.tick(); render(); break; }
      case 'hl': { const r = S.cs.hel.res && S.cs.hel.res[v]; S.cs.hl = r && r.ids ? r.ids : []; render(); break; }
      case 'laudo': laudo(); break;
      case 'lmode': S.cs.lsel.mode = v; sfx.tick(); laudo(); break;
      case 'lans': S.cs.lsel.ans = v; sfx.tick(); laudo(); break;
      case 'sign': sign(); break;
      case 'perkpick': perkPick(); break;
      case 'perk': S.perks[v] = perk(v) + 1; S.pendingPerk = Math.max(0, S.pendingPerk - 1); sfx.level(); closeModal(); render(); toast(`⭐ Nova habilidade: <b>${PERKS[v].n}</b>`, 'warm'); if (S.pendingPerk) perkPick(); break;
    }
    const lg = $('#log'); if (lg) lg.scrollTop = lg.scrollHeight;
  });

  if (/github\.io$/.test(location.hostname)) $('#backlink').hidden = false;
  S = null;
  render();
  window.__SU = { get S() { return S; }, CASES, genCase, likelihood, witness, render, startCase };

})();
</script>
</body>
</html>
