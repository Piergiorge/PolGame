  #scr { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges;
    filter: saturate(1.15) contrast(1.05); touch-action: none; }
  @media (pointer: fine) { #scr { cursor: none; } }
  .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px); }
  .glare { position: absolute; inset: 0; pointer-events: none;

                radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%);
    animation: flick 0.12s infinite; }
  @keyframes flick { 0% { opacity: .97 } 50% { opacity: 1 } 100% { opacity: .98 } }
  @media (max-width: 600px) {
    .bezel { padding: 3% 3% 1.5% 3%; border-radius: 14px; }
    .screen { border-radius: 6px; }
    .panel { font-size: 9px; letter-spacing: 1px; padding-top: 6px; }
  }
  .panel { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 2px;
    color: #6f6756; font: bold 12px monospace; letter-spacing: 3px; }
  .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3cf05a; box-shadow: 0 0 6px #3cf05a; margin-left: 8px; }
  .vents { width: 30%; height: 8px; background: repeating-linear-gradient(90deg, #8f8670 0 3px, transparent 3px 7px); border-radius: 2px; }

  function bitmap(ch) {

  // quebra em linhas de no máximo n caracteres

    const out = [];
    for (const para of String(s).split('\n')) {

      let line = '';
      for (const w of para.split(' ')) {

  function piLocus(base, L, ch, mo, af) {
    if (!ch || !af || ch.length < 2 || af.length < 2) return { pi: null };
    let O;
    if (mo && mo.length === 2) {
      const [a, b] = ch;
      const ma = mo.includes(a), mb = mo.includes(b);
      if (!ma && !mb) return { pi: null, mom: false };
      if (a === b) O = [a];
      else if (ma && mb) O = [a, b];
      else O = [ma ? b : a];
      const t = O.reduce((s, x) => s + af.filter(y => y === x).length / 2, 0);
      const den = O.reduce((s, x) => s + fr(base, L, x), 0);
      return { pi: t / den, inc: t === 0 };
    }
    // duo
    const [a, b] = ch, pa = fr(base, L, a), pb = fr(base, L, b);
    const has = x => af.includes(x), homo = af[0] === af[1];
    let pi;
    if (a === b) pi = has(a) ? (homo ? 1 / pa : 1 / (2 * pa)) : 0;
    else if (has(a) && has(b)) pi = (pa + pb) / (4 * pa * pb);
    else if (has(a)) pi = homo ? 1 / (2 * pa) : 1 / (4 * pa);
    else if (has(b)) pi = homo ? 1 / (2 * pb) : 1 / (4 * pb);

    return { pi, inc: pi === 0 };

      if (r.inc) { inc++; rows.push({ L, pi: 0 }); continue; }
      cpi *= r.pi; rows.push({ L, pi: r.pi });
    }
    return { rows, cpi, inc, momBad, W: cpi / (cpi + 1) };
  }

          const want = !s ? 'Inconclusivo' : kind === 'pai' || kind === 'mut' ? 'Paternidade praticamente provada' : 'Paternidade excluída';

          add(e ? A[1] === right : A[1] === 'Não estimado', e ? (A[1] === right ? 'Data estimada corretamente.' : `A estimativa era ${right}.`) : 'Sem exame.');

          add(e ? A[2] === alive : A[2] === 'Não sei' ? 'half' : false, alive === 'Não' ? `Em ${fmt(claim)}/${fmt(mo)} ele já estava morto: a versão de ${s} não para de pé.` : `A data citada por ${s} é anterior à morte estimada: a versão é possível.`);
